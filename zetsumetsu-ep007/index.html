": 1065.0166666666667, "i": 373}, {"t": 1067.2166666666667, "i": 374}, {"t": 1070.7, "i": 375}, {"t": 1073.1166666666666, "i": 376}, {"t": 1074.85, "i": 377}, {"t": 1078.5, "i": 377}], "subs": [{"t": 0.0, "x": "岩はまだ温かかった。日が沈んだあとも、平たい岩は"}, {"t": 3.7666666666666666, "x": "昼の熱をしばらく抱えている。"}, {"t": 5.583333333333333, "x": "私はその上に腹をつけて沖を見ていた。"}, {"t": 8.183333333333334, "x": "舟が一艘岩の脇を通っていった。"}, {"t": 10.566666666666666, "x": "舟の上の人間が、こちらを指さした。"}, {"t": 13.433333333333334, "x": "声が水の上を渡ってきた。何を言ったのかは分からない。"}, {"t": 16.933333333333334, "x": "舟は止まらずに遠ざかり、うねりの"}, {"t": 19.4, "x": "向こうに沈むように見えなくなった。"}, {"t": 21.283333333333335, "x": "岩の上には、私のほかにまだ何頭かが残っていた。"}, {"t": 24.966666666666665, "x": "あの人間は自分が何を見たのかを知らなかったと思う。"}, {"t": 28.233333333333334, "x": "私も知らなかった。私がいつどこで息を止めたのかは、"}, {"t": 31.616666666666667, "x": "どこにも書かれていない。そばで見ていた"}, {"t": 34.166666666666664, "x": "人間が、一人もいなかったからだ。"}, {"t": 36.31666666666667, "x": "私が生きていた世界は、海の真ん中に突き出した岩だった。"}, {"t": 40.166666666666664, "x": "土はほとんど無い。木も生えていない。"}, {"t": 42.5, "x": "大きな岩が二つ向かい合って立っていて、"}, {"t": 44.8, "x": "そのまわりに小さな岩がいくつも散らばっている。"}, {"t": 47.81666666666667, "x": "まわりはどこまで行っても海だ。"}, {"t": 49.65, "x": "波は岩の根元を少しずつ削っていく。"}, {"t": 52.18333333333333, "x": "ところどころに深い穴が開いていて、"}, {"t": 54.266666666666666, "x": "奥まで入ると外の音が急に遠くなる。"}, {"t": 57.166666666666664, "x": "暗くてひんやりしていて、水の匂いが濃い。"}, {"t": 59.983333333333334, "x": "私はその岩の上で生まれた。"}, {"t": 61.916666666666664, "x": "最初に覚えているのは母の声だ。"}, {"t": 64.08333333333333, "x": "岩の上には同じ声を出す者がたくさんいた。"}, {"t": 66.88333333333334, "x": "それでも母は私を声で探し当てたし、私も"}, {"t": 70.26666666666667, "x": "母の声をほかのどの声とも取り違えなかった。"}, {"t": 72.93333333333334, "x": "母が海から戻ってくると、私は"}, {"t": 75.51666666666667, "x": "鳴いて自分の場所を知らせた。"}, {"t": 77.1, "x": "母の毛は灰色がかった茶色で、濡れると黒く光った。"}, {"t": 80.76666666666667, "x": "母の体は大きな雄よりずっと小さかった。"}, {"t": 83.5, "x": "それでも岩の上で私を守るには十分な大きさだった。"}, {"t": 87.1, "x": "海に入ったのは少し大きくなってからだ。"}, {"t": 89.55, "x": "最初は岩のすぐそばの浅いところだけだった。"}, {"t": 92.26666666666667, "x": "陸の上では重たい体が、水に入ると急に軽くなる。"}, {"t": 96.1, "x": "前のひれで水を押すと体ごと前に出る。"}, {"t": 98.68333333333334, "x": "それが分かった日のことは、今でも覚えている。"}, {"t": 101.68333333333334, "x": "陸ではうまく歩けない、と思われているかもしれない。"}, {"t": 105.13333333333334, "x": "そんなことはない。前のひれで体を持ち上げ、後ろのひれを"}, {"t": 109.08333333333333, "x": "体の下に折り込んで岩の上を一歩ずつ進む。"}, {"t": 111.86666666666666, "x": "急な斜面でも登れた。食べ物は海の中にある。"}, {"t": 114.98333333333333, "x": "夜の海に潜ると、暗い水の中をイカが群れて泳いでいる。"}, {"t": 119.03333333333333, "x": "岩の割れ目にはタコがいる。"}, {"t": 120.66666666666667, "x": "群れで泳ぐ魚を横から追えば、何匹かは口に入った。"}, {"t": 124.55, "x": "腹が満ちたら岩に戻って濡れた体を日に当てて乾かす。"}, {"t": 127.98333333333333, "x": "乾いたら眠る。それを毎日繰り返した。"}, {"t": 130.65, "x": "岩の上で暮らしているのは私たちだけではない。"}, {"t": 133.41666666666666, "x": "白い海鳥が岩の上の方を埋め尽くしていて、"}, {"t": 136.21666666666667, "x": "朝から晩まで鳴き交わしていた。"}, {"t": 138.31666666666666, "x": "鳥たちは私たちの頭の上を平気で飛んでいく。"}, {"t": 141.45, "x": "私たちも鳥を気にしなかった。"}, {"t": 143.38333333333333, "x": "岩の上のほうは鳥の糞で白くなっていて、雨が"}, {"t": 146.6, "x": "降るとそれが流れ落ちて岩の根元の水の色が少し変わった。"}, {"t": 150.05, "x": "岩の上がいちばん騒がしくなるのは、夏の初めだった。"}, {"t": 153.65, "x": "大きな雄が、平らな岩のいちばん良い場所を取る。"}, {"t": 157.06666666666666, "x": "首が太く頭のてっぺんが盛り上がっていて、"}, {"t": 159.65, "x": "毛は暗い茶色をしている。そのまわりに雌たちが集まる。"}, {"t": 163.31666666666666, "x": "ほかの雄が近づくと大きな雄は胸を張って"}, {"t": 165.9, "x": "吠え、ときには噛みついて追い払った。"}, {"t": 168.55, "x": "私はそれを少し離れた岩から見ていた。"}, {"t": 171.05, "x": "まだ若くて、その輪の中に入る体ではなかった。"}, {"t": 174.46666666666667, "x": "輪に入れない若い雄たちは、平らな岩から"}, {"t": 177.35, "x": "少し離れた低い岩に集まっていた。私もその中にいた。"}, {"t": 180.88333333333333, "x": "そこでは毎日、大きな雄の真似ごとが続いた。"}, {"t": 184.21666666666667, "x": "向かい合って首を振り、相手をじっとにらみ、"}, {"t": 186.96666666666667, "x": "吠えながら突っかかるふりをして、ぶつかる手前で止まる。"}, {"t": 190.66666666666666, "x": "本気で噛みつく者はいなかった。"}, {"t": 192.6, "x": "負けたほうも、少し場所をずらしてまた眠るだけだった。"}, {"t": 195.96666666666667, "x": "私は体の大きい相手にはいつも押し負けた。"}, {"t": 198.78333333333333, "x": "大きな雄が平らな岩からこちらへ顔を"}, {"t": 201.15, "x": "向けると、低い岩の上は急に静かになった。"}, {"t": 204.3, "x": "いつかは自分が平らな岩のいちばん良い場所を取る。"}, {"t": 207.36666666666667, "x": "低い岩の上の誰もがそう思っていたはずだ。"}, {"t": 210.06666666666666, "x": "私もそう思っていた。その日に"}, {"t": 212.13333333333333, "x": "張り合う相手は、この低い岩で首を"}, {"t": 214.48333333333332, "x": "振り合っている誰かになるのだろうと、疑いもしなかった。"}, {"t": 217.98333333333332, "x": "平らな岩はいつも混んでいた。"}, {"t": 219.83333333333334, "x": "寝返りを打てば誰かにぶつかる。"}, {"t": 221.76666666666668, "x": "水から上がろうとすると、上がる場所が空いていない。"}, {"t": 224.98333333333332, "x": "仕方なく一段低い岩で波をかぶりながら眠った夜もある。"}, {"t": 228.5, "x": "冬の海は荒れる。風の強い日には"}, {"t": 230.5, "x": "波が岩のずいぶん上まで駆け上がってきて、"}, {"t": 233.16666666666666, "x": "低いところにいる者はさらわれそうになる。"}, {"t": 235.8, "x": "そういう日は穴の奥に入って波の音が低くなるのを待った。"}, {"t": 239.28333333333333, "x": "寒い朝には吐いた息が白く漂った。"}, {"t": 241.75, "x": "私は母の背中に顎を乗せて日が高くなるのを待った。"}, {"t": 245.01666666666668, "x": "母は動かずにそうさせてくれた。"}, {"t": 247.05, "x": "そうやって季節がいくつも過ぎた。"}, {"t": 249.0, "x": "混んでいた岩が少しずつ広くなっていった。"}, {"t": 251.43333333333334, "x": "そのことに、私は途中まで気づかなかった。"}, {"t": 254.43333333333334, "x": "人間を最初に見たのがいつだったのか、"}, {"t": 256.7, "x": "はっきりとは覚えていない。"}, {"t": 258.45, "x": "覚えているのは音のほうだ。"}, {"t": 260.1666666666667, "x": "遠くから低い音が近づいてくる。"}, {"t": 262.2, "x": "水の上を這うような、途切れない音だ。"}, {"t": 264.8833333333333, "x": "その音が聞こえると、岩の上の"}, {"t": 267.21666666666664, "x": "年寄りたちが一斉に顔を上げた。"}, {"t": 269.2, "x": "そして次々に水へ滑り込んでいった。"}, {"t": 271.53333333333336, "x": "私は理由を知らなかった。誰も教えてはくれなかった。"}, {"t": 274.96666666666664, "x": "ただ年寄りたちが水に入るのを見て、"}, {"t": 277.2, "x": "同じように水に入った。そうするものだと体が覚えた。"}, {"t": 281.01666666666665, "x": "音の正体は舟だった。舟は岩のまわりをゆっくり回って、"}, {"t": 284.81666666666666, "x": "しばらくすると離れていった。"}, {"t": 286.71666666666664, "x": "舟が見えなくなると、年寄りたちはまた岩に戻ってくる。"}, {"t": 290.45, "x": "何も起きなかった日のほうが、ずっと多かった。"}, {"t": 293.3833333333333, "x": "あとで思うと、年寄りたちは舟そのものではなく舟が"}, {"t": 296.85, "x": "昔運んできたものを覚えていたのかもしれない。"}, {"t": 299.46666666666664, "x": "それが何だったのかを、私は見ていない。"}, {"t": 302.31666666666666, "x": "見ていないことは言えない。"}, {"t": 303.81666666666666, "x": "岩の奥の深い穴には、年寄りたちは決して入らなかった。"}, {"t": 307.6666666666667, "x": "私は若いころ何度かその穴で眠った。"}, {"t": 310.21666666666664, "x": "静かで波も届かなくて、いい場所だった。"}, {"t": 313.0833333333333, "x": "年寄りたちがなぜそこを避けるのか、"}, {"t": 315.0833333333333, "x": "私には最後まで分からなかった。"}, {"t": 317.3333333333333, "x": "人間が岩の上に上がってきたこともある。"}, {"t": 319.8333333333333, "x": "舟から小さな舟が下ろされて、何人かが岩に足をかけた。"}, {"t": 323.8666666666667, "x": "私たちは水の中から、顔だけ出してそれを見ていた。"}, {"t": 327.3833333333333, "x": "人間は岩の上を歩き回り、何かを置いたり"}, {"t": 330.5833333333333, "x": "持ち上げたりして日が傾くと帰っていった。"}, {"t": 332.9, "x": "人間は陸の上では私たちよりずっと身軽だった。"}, {"t": 335.95, "x": "人間が去ったあとの岩には、"}, {"t": 337.6166666666667, "x": "嗅いだことのない匂いがしばらく残った。"}, {"t": 340.18333333333334, "x": "私たちはその匂いが薄れるまで、そこへは上がらなかった。"}, {"t": 343.8, "x": "人間の中には面白い者もいた。"}, {"t": 346.0, "x": "一人の人間が水に入ってきたことがある。"}, {"t": 348.45, "x": "私たちのすぐそばまで泳いできて、"}, {"t": 350.53333333333336, "x": "手に持っていた魚をこちらへ放った。"}, {"t": 353.01666666666665, "x": "私はしばらく迷ってからそれを食べた。"}, {"t": 355.3833333333333, "x": "人間はそれを見て、また魚を放った。"}, {"t": 358.1666666666667, "x": "そのあと、私はその人間のまわりを何周か泳いだ。"}, {"t": 361.95, "x": "人間は笑っているような声を出していた。"}, {"t": 364.3833333333333, "x": "私は人間を悪く思ったことがない。"}, {"t": 366.8333333333333, "x": "私が見た人間は、舟と足音と"}, {"t": 369.43333333333334, "x": "放られた魚と、こちらを指す手だけだ。"}, {"t": 372.03333333333336, "x": "悪く思うための材料を、私は持っていない。"}, {"t": 375.35, "x": "一度だけ、妙なことがあった。"}, {"t": 377.53333333333336, "x": "舟が岩のまわりを、いつもよりずっとゆっくり一周した。"}, {"t": 381.1333333333333, "x": "舟の上の人間は、岩の上の私たちを"}, {"t": 384.18333333333334, "x": "一頭ずつ順に指でさしていった。端から端まで。"}, {"t": 387.1666666666667, "x": "途中で一度止まって、また最初からやり直した。"}, {"t": 390.3666666666667, "x": "数えていたのだと思う。私が"}, {"t": 392.1666666666667, "x": "何番目に数えられたのかは知らない。"}, {"t": 394.51666666666665, "x": "何のために数えていたのかは知らない。"}, {"t": 396.73333333333335, "x": "ただ、そのとき岩の上にいた者を全部合わせても"}, {"t": 399.95, "x": "私が子どもだったころの夏の岩の半分も埋まらなかった。"}, {"t": 403.4, "x": "それは私にも分かった。大きな雄は"}, {"t": 405.6333333333333, "x": "ある年の春に戻ってこなかった。"}, {"t": 407.71666666666664, "x": "その夏、平らな岩のいちばん良い"}, {"t": 410.1, "x": "場所を取る雄は現れなかった。次の夏も同じだった。"}, {"t": 413.4166666666667, "x": "雌たちは平らな岩に上がってきたが、輪はできなかった。"}, {"t": 416.98333333333335, "x": "それぞれが離れて眠った。私の体は、"}, {"t": 419.48333333333335, "x": "そのころにはもう十分に大きくなっていた。"}, {"t": 422.4166666666667, "x": "首は太くなり、頭のてっぺんも盛り上がってきた。"}, {"t": 425.71666666666664, "x": "吠えれば岩に声が跳ね返ってくる。"}, {"t": 427.8833333333333, "x": "平らな岩のいちばん良い場所は、空いていた。"}, {"t": 430.81666666666666, "x": "取り合う相手は、どこにもいなかった。"}, {"t": 433.23333333333335, "x": "私は一番の場所に腹をつけて、雌たちが"}, {"t": 436.21666666666664, "x": "上がってくるはずの岩の縁をしばらく眺めていた。"}, {"t": 438.9, "x": "岩の上の一頭には見えていなかったものがある。"}, {"t": 441.78333333333336, "x": "この岩の外側で、百年近くかけて"}, {"t": 444.56666666666666, "x": "積み上げられた数字である。"}, {"t": 446.1166666666667, "x": "ニホンアシカは、日本の周りの"}, {"t": 448.46666666666664, "x": "海に住んでいたアシカである。"}, {"t": 450.01666666666665, "x": "カリフォルニアアシカに近いが、二百万年ほど"}, {"t": 453.03333333333336, "x": "前に枝分かれした別の種と考えられている。"}, {"t": 455.76666666666665, "x": "長いあいだその亜種として扱われていたが、"}, {"t": 458.28333333333336, "x": "二〇〇三年以降は独立した種とされている。"}, {"t": 461.4166666666667, "x": "雄は体長二メートル三十センチから二メートル五十センチ、"}, {"t": 465.18333333333334, "x": "体重はおよそ四百五十から五百六十キログラム。"}, {"t": 469.23333333333335, "x": "雌は体長一メートル六十センチほどで、"}, {"t": 472.03333333333336, "x": "雄よりはるかに小さい。繁殖期の五月から六月、雄は"}, {"t": 476.6166666666667, "x": "十数頭の雌を率いてハーレムを作った。"}, {"t": 479.4, "x": "分布は日本海側がサハリン南部から"}, {"t": 481.81666666666666, "x": "長崎県まで、太平洋側は千島から宮崎県まで。"}, {"t": 485.8333333333333, "x": "繁殖地として知られていたのは、伊豆諸島の"}, {"t": 488.7, "x": "島々と隠岐諸島の北西の沖に浮かぶ岩の島、竹島である。"}, {"t": 493.1166666666667, "x": "各地ではトド、ミチ、アジカなどと呼ばれてきた。"}, {"t": 497.03333333333336, "x": "隠岐ではメチと呼ばれた。人間との付き合いは古い。"}, {"t": 500.35, "x": "北海道の礼文島の遺跡からは、およそ三千二百年前の"}, {"t": 504.6333333333333, "x": "ニホンアシカの頭の骨が出ている。"}, {"t": 506.7, "x": "古事記には、海の神の宮殿で「みち」の"}, {"t": 510.78333333333336, "x": "皮を敷いて客をもてなす場面がある。"}, {"t": 513.1, "x": "この「みち」がニホンアシカのことである。"}, {"t": 516.65, "x": "出雲国風土記にはアシカの群れていた"}, {"t": 518.85, "x": "島が等々嶋、トドシマという名で出てくる。"}, {"t": 521.6666666666666, "x": "明治より前には、日本の周りに"}, {"t": 524.1166666666667, "x": "三万から五万頭がいたと推定されている。"}, {"t": 526.8166666666667, "x": "一九〇二年三月三日、京都日出新聞は京都の"}, {"t": 530.9833333333333, "x": "新京極の見世物小屋で起きた騒ぎを報じている。"}, {"t": 534.2166666666667, "x": "その年の二月十五日に日本海の岩の島で捕らえられた、"}, {"t": 538.0166666666667, "x": "長さ七尺およそ二メートル十センチのアシカが"}, {"t": 541.1833333333333, "x": "見世物として出されたところ二度にわたって逃げ出した。"}, {"t": 544.1333333333333, "x": "観客は驚き、警官まで駆けつけた。"}, {"t": 547.05, "x": "最後は舞台の下の奈落で取り押さえられたという。"}, {"t": 550.2, "x": "生きたまま遠くへ運ばれる。"}, {"t": 551.9666666666667, "x": "その形はこの時すでに始まっていた。"}, {"t": 554.5333333333333, "x": "本格的な漁が始まったのは、一九〇三年である。"}, {"t": 558.4333333333333, "x": "隠岐の中井養三郎らがこの岩の島でアシカ猟を始めると、"}, {"t": 562.15, "x": "ほかの漁業者も次々に乗り出した。"}, {"t": 564.7, "x": "獲りすぎを心配する声が出るまでに、"}, {"t": 567.05, "x": "時間はかからなかった。一九〇五年、"}, {"t": 570.0833333333334, "x": "漁は許可を受けた一つの会社、"}, {"t": 572.5666666666667, "x": "竹島漁猟合資会社にまとめられた。"}, {"t": 575.3833333333333, "x": "獲れた数は記録に残っている。"}, {"t": 577.3666666666667, "x": "一九〇六年におよそ千三百頭。"}, {"t": 580.1166666666667, "x": "一九〇七年におよそ二千頭。"}, {"t": 582.5833333333334, "x": "一九〇八年におよそ千八百頭。"}, {"t": 585.35, "x": "一九〇四年から一九一一年までの八年間で、"}, {"t": 589.2333333333333, "x": "合わせておよそ一万四千頭が捕獲された。"}, {"t": 592.45, "x": "江戸時代からアシカの油は明かりにも"}, {"t": 594.6666666666666, "x": "使われる貴重なものだった。"}, {"t": 596.2833333333333, "x": "明治の漁でも使い道は多かった。"}, {"t": 598.6666666666666, "x": "皮は革になった。体からは油が採れた。"}, {"t": 601.8, "x": "一頭から数斗、一升瓶にして"}, {"t": 604.35, "x": "数十本分の油が採れたと記録されている。"}, {"t": 607.1666666666666, "x": "その油は石鹸や膠に加工された。残りは肥料になった。"}, {"t": 611.45, "x": "ここで、この漁に歯止めが無かったわけではないことも"}, {"t": 614.8166666666667, "x": "書いておく。会社は岩の島を十六の区画に分け、"}, {"t": 618.1166666666667, "x": "その四分の一を保護場とした。"}, {"t": 620.5333333333333, "x": "そこには人も船も近づかないことになっていた。"}, {"t": 623.4666666666667, "x": "アシカを守り、漁を続けていくための決まりである。"}, {"t": 626.9166666666666, "x": "それでも数は戻らなかった。"}, {"t": 628.8666666666667, "x": "アシカは決まった季節に、決まった"}, {"t": 631.2333333333333, "x": "繁殖場にだけ集まって子を産む。"}, {"t": 633.4166666666666, "x": "愛知県のレッドデータブックは、"}, {"t": 635.2166666666667, "x": "そうした繁殖場での狩猟が減少の要因として"}, {"t": 638.7, "x": "大きく響いたと考えられると書いている。"}, {"t": 641.1, "x": "子を産む場所で獲ることは、次の年に"}, {"t": 643.6666666666666, "x": "生まれる数を先に減らすことでもあった。"}, {"t": 645.8666666666667, "x": "一九一五年には、年間の捕獲数は"}, {"t": 649.1666666666666, "x": "三百頭ほどに落ちたとされる。"}, {"t": 651.0166666666667, "x": "昭和に入ると猟の目的が変わる。"}, {"t": 653.4166666666666, "x": "皮や油ではなく、生きたアシカそのものが売り物になった。"}, {"t": 657.3666666666667, "x": "動物園やサーカスへ売るためである。"}, {"t": 659.7333333333333, "x": "隠岐の久見の漁師たちは岩の島の洞窟の前に網を張り、"}, {"t": 663.2666666666667, "x": "奥からアシカを追い出して生け捕りにした。"}, {"t": 665.8166666666667, "x": "一九三四年には大阪朝日新聞が、大阪市立"}, {"t": 670.1333333333333, "x": "天王寺動物園の獣医を伴ってこの猟を取材している。"}, {"t": 673.6666666666666, "x": "一九三五年ごろ、一年に獲られる数は"}, {"t": 677.3166666666667, "x": "二十頭から五十頭ほどになっていた。"}, {"t": 679.5833333333334, "x": "この頃、漁師たちに恐れられた一頭の雄がいた。"}, {"t": 683.05, "x": "岩の島の古い呼び名から、リャンコ大王と呼ばれた。"}, {"t": 686.5333333333333, "x": "当時の新聞によれば体長二メートル八十八センチ、"}, {"t": 690.0333333333333, "x": "体重七百五十キログラム。岩の"}, {"t": 692.5833333333334, "x": "島でいちばん大きく、力も強かったという。"}, {"t": 696.2333333333333, "x": "この雄は銃で撃たれ、剥製になった。"}, {"t": 699.0833333333334, "x": "撃たれた年は一九三一年とする資料と一九三四年とする"}, {"t": 704.1, "x": "資料があり、どちらとも決まっていない。"}, {"t": 706.6833333333333, "x": "ニホンアシカの猟は、第二次世界大戦の前に止まった。"}, {"t": 710.5833333333334, "x": "一九五一年、その岩の島で数えられた"}, {"t": 714.3666666666667, "x": "ニホンアシカは五十から六十頭だった。"}, {"t": 716.7833333333333, "x": "明治の終わりに一年で獲られていた数の、"}, {"t": 719.25, "x": "およそ三十分の一から四十分の一である。"}, {"t": 722.6, "x": "夏が来るたびに、岩の上が静かになっていった。"}, {"t": 725.75, "x": "平らな岩に上がってくる雌は、毎年少しずつ減った。"}, {"t": 729.3333333333334, "x": "去年いた顔が今年はいない。"}, {"t": 731.15, "x": "どこへ行ったのかを私は知らない。"}, {"t": 733.15, "x": "海に出たまま戻らなかったのだと思う。"}, {"t": 735.4166666666666, "x": "戻らない理由を私は見ていない。"}, {"t": 737.5, "x": "子どもの声が、いつのまにか聞こえなくなっていた。"}, {"t": 740.65, "x": "私が生まれたころは、夏になると"}, {"t": 742.95, "x": "岩のあちこちで小さな声がしていた。"}, {"t": 745.0833333333334, "x": "母親を呼ぶ声だ。それに答える声が重なって、"}, {"t": 748.25, "x": "岩全体が鳴っているようだった。"}, {"t": 750.45, "x": "その声がある夏にはほんの数えるほどになり、"}, {"t": 753.0666666666667, "x": "次の夏には一つも無かった。"}, {"t": 755.2, "x": "ある朝、平らな岩の端に若い雌が一頭だけ"}, {"t": 758.1, "x": "上がってきた。私は近づこうとした。"}, {"t": 760.7, "x": "雌は私を見て、すぐに水へ戻っていった。"}, {"t": 763.75, "x": "それきり二度と上がってこなかった。"}, {"t": 765.63333333333   document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
