"t": 1007.9833333333333, "i": 372}, {"t": 1011.0, "i": 373}, {"t": 1015.1666666666666, "i": 374}, {"t": 1017.4, "i": 375}, {"t": 1019.45, "i": 376}, {"t": 1021.8166666666667, "i": 377}, {"t": 1023.8666666666667, "i": 378}, {"t": 1025.7833333333333, "i": 379}, {"t": 1029.5333333333333, "i": 380}, {"t": 1032.2, "i": 381}, {"t": 1035.5666666666666, "i": 382}, {"t": 1038.1333333333334, "i": 383}, {"t": 1041.2, "i": 384}, {"t": 1043.75, "i": 385}, {"t": 1046.9333333333334, "i": 386}, {"t": 1050.5833333333333, "i": 387}, {"t": 1053.2666666666667, "i": 388}, {"t": 1055.5666666666666, "i": 389}, {"t": 1058.9166666666667, "i": 390}, {"t": 1061.4333333333334, "i": 391}, {"t": 1065.6, "i": 392}, {"t": 1068.9666666666667, "i": 393}, {"t": 1072.7666666666667, "i": 394}, {"t": 1074.8166666666666, "i": 394}], "subs": [{"t": 0.0, "x": "足の下で乾いた落ち葉が鳴った。"}, {"t": 2.0166666666666666, "x": "私はまだ立っている。脚には力が残っていて、走ろうと"}, {"t": 5.916666666666667, "x": "思えば今でも藪の奥まで一息に抜けられる。"}, {"t": 8.55, "x": "ただ走っていった先に、呼び返してくれる声がもう無い。"}, {"t": 12.05, "x": "私が倒れるところを見ている人間はいない。"}, {"t": 14.7, "x": "日付を書く者も場所を記す者もいない。"}, {"t": 17.166666666666668, "x": "私には人間のつけた名前すら無い。"}, {"t": 19.466666666666665, "x": "けれども私が立っているこの場所に、人間はもう来ない。"}, {"t": 23.05, "x": "人間は私たちを太った鈍い鳥だと思っていた。"}, {"t": 26.166666666666668, "x": "両手を広げてゆっくりと近づいてくる"}, {"t": 28.383333333333333, "x": "あの歩き方で、それは分かった。"}, {"t": 30.533333333333335, "x": "なぜそう見えたのかを私は知っている。"}, {"t": 32.833333333333336, "x": "私は、のろまだったのではない。"}, {"t": 35.0, "x": "私の世界は森と、その下の地面でできていた。"}, {"t": 38.266666666666666, "x": "森は海の音が届くところまで続いている。"}, {"t": 40.88333333333333, "x": "乾いた風の吹く側の森で、背の低い木と葉の"}, {"t": 43.95, "x": "細長い木と幹のまっすぐな椰子が"}, {"t": 45.81666666666667, "x": "混ざり合っている。地面は落ち葉で柔らかい。"}, {"t": 48.43333333333333, "x": "ところどころに岩が顔を出していて、"}, {"t": 50.43333333333333, "x": "岩のあいだには湿った窪みがある。"}, {"t": 52.71666666666667, "x": "私たちが暮らしていたのは海の近くの森だけではない。"}, {"t": 55.86666666666667, "x": "島の奥の山のほうにも仲間がいて、"}, {"t": 58.11666666666667, "x": "洞穴のある岩の斜面を歩いていた。"}, {"t": 60.63333333333333, "x": "私は一日の大半を歩いて過ごした。"}, {"t": 63.166666666666664, "x": "下を見て落ちている実を探す。"}, {"t": 65.01666666666667, "x": "熟れて落ちたばかりの実は柔らかい。"}, {"t": 67.18333333333334, "x": "落ちてから日のたった実は種だけが硬く残っている。"}, {"t": 70.21666666666667, "x": "私の嘴は大きくて先が鉤のように曲がっている。"}, {"t": 73.51666666666667, "x": "硬い種でもこれで割れる。森の地面で実を"}, {"t": 75.95, "x": "探していたのは私たちだけではなかった。"}, {"t": 78.4, "x": "背中に硬い甲羅を負った大きな亀が、"}, {"t": 80.76666666666667, "x": "ゆっくりと落ち葉の上を歩いていた。"}, {"t": 83.1, "x": "亀も私たちと同じように大きな実を好んだ。"}, {"t": 85.93333333333334, "x": "実のよく落ちる木の下では、"}, {"t": 87.46666666666667, "x": "亀と私が同じ実のそばにいることもあった。"}, {"t": 90.5, "x": "亀は私を追わず、私も亀を追わなかった。"}, {"t": 93.71666666666667, "x": "嘴の太い別の鳥も、やはり大きな実を好んで食べていた。"}, {"t": 97.68333333333334, "x": "大きな実を食べられる者は、"}, {"t": 99.28333333333333, "x": "この森にそう多くはいなかった。"}, {"t": 101.41666666666667, "x": "私たちはその数少ない者の一つだった。"}, {"t": 103.98333333333333, "x": "飲み込んだものは腹の奥の袋で潰される。"}, {"t": 106.55, "x": "そのために私は小石を飲む。"}, {"t": 108.46666666666667, "x": "水場のそばで丸い石を選んで飲み込んでおく。"}, {"t": 111.21666666666667, "x": "石は腹の中で転がって硬い殻を砕いてくれる。"}, {"t": 114.16666666666667, "x": "奇妙に思われるかもしれないが、"}, {"t": 116.05, "x": "私たちにとっては当たり前のことだった。"}, {"t": 118.76666666666667, "x": "実を探すのに頼っていたのは目だけではない。"}, {"t": 121.33333333333333, "x": "私は鼻がよく利いた。落ち葉に埋もれた実でも、熟れた"}, {"t": 125.11666666666666, "x": "匂いがすればその場所が分かった。"}, {"t": 126.95, "x": "歩くのは日の高いあいだだけではなかった。"}, {"t": 129.36666666666667, "x": "薄明るい朝にも日の傾いた夕方にも、"}, {"t": 131.98333333333332, "x": "私は森の地面を歩いた。暑さの和らぐその時間は、ほかの"}, {"t": 136.48333333333332, "x": "生き物と実を取り合うことも少なかった。翼はある。"}, {"t": 139.55, "x": "小さい。広げても体は浮かない。"}, {"t": 142.3, "x": "けれども要らないものではなかった。"}, {"t": 144.2, "x": "走りながら向きを変えるとき、"}, {"t": 145.88333333333333, "x": "翼を少し開くと体が傾かずに済む。"}, {"t": 148.83333333333334, "x": "相手に自分を大きく見せたいときも"}, {"t": 150.85, "x": "翼を広げて羽を膨らませる。"}, {"t": 152.78333333333333, "x": "仲間と場所を争うこともあった。"}, {"t": 154.86666666666667, "x": "そういうとき私たちは翼で打ち合いはしない。"}, {"t": 157.7, "x": "使うのは嘴だった。けれども争いは長くは続かなかった。"}, {"t": 161.58333333333334, "x": "この森では、場所を奪い合わなければならないほど"}, {"t": 164.66666666666666, "x": "食べ物に困ることは少なかった。"}, {"t": 166.55, "x": "脚は太くて強い。指は地面をしっかりとつかむ。"}, {"t": 169.71666666666667, "x": "藪の中で何かが動けば、私は根の張った斜面でも"}, {"t": 173.26666666666668, "x": "倒れた木の上でも止まらずに抜けていける。"}, {"t": 175.51666666666668, "x": "私たちは歩くのが好きで、走るのは速かった。"}, {"t": 178.66666666666666, "x": "もっとも、この森で私たちを"}, {"t": 180.85, "x": "追いかけてくるものはいなかった。"}, {"t": 182.41666666666666, "x": "この島には私たちを食べる獣がいなかった。"}, {"t": 185.26666666666668, "x": "空から襲ってくる大きな鳥もいなかった。"}, {"t": 187.71666666666667, "x": "地面にいるのは陸の蟹くらいだ。"}, {"t": 189.7, "x": "蟹は巣の近くまで来ることがあるが、"}, {"t": 191.78333333333333, "x": "嘴で追い払えばそれで済んだ。"}, {"t": 194.13333333333333, "x": "だから私たちは、逃げるということを"}, {"t": 196.6, "x": "覚える必要がなかった。私の体は季節によって変わる。"}, {"t": 200.1, "x": "暑くて雨の多い季節には体が軽くなる。"}, {"t": 202.83333333333334, "x": "涼しくて乾いた季節になると、"}, {"t": 204.68333333333334, "x": "実を食べるほどに体に重さがついていく。"}, {"t": 207.53333333333333, "x": "重くなるのは卵を産む前の季節だ。"}, {"t": 209.9, "x": "その重さはこれから子を育てるために要るものだった。"}, {"t": 212.9, "x": "羽も季節で替わる。子を育て終えて暑い季節が過ぎると、"}, {"t": 216.46666666666667, "x": "翼と尾の羽から抜けていく。"}, {"t": 218.6, "x": "抜け替わるあいだ私の体は黒っぽい"}, {"t": 220.88333333333333, "x": "綿のような毛に覆われる。それが済むと、"}, {"t": 223.53333333333333, "x": "くすんだ灰色がかった茶色の羽がまた揃う。"}, {"t": 226.31666666666666, "x": "同じ私でも見る季節によっては別の鳥に見えただろう。"}, {"t": 229.73333333333332, "x": "巣は地面に作る。茂みの根元に"}, {"t": 231.73333333333332, "x": "落ち葉と草を寄せて浅い窪みにする。"}, {"t": 234.16666666666666, "x": "卵は一つだけ産む。白くて大きな卵だ。"}, {"t": 237.15, "x": "雛が出てくると、雛は驚くほどの速さで大きくなる。"}, {"t": 240.76666666666668, "x": "風の荒れる季節が来る前に、ほとんど親と"}, {"t": 243.6, "x": "変わらない体になっていなければならないからだ。"}, {"t": 246.11666666666667, "x": "一つの巣から一羽。それが私たちの増え方だった。"}, {"t": 249.4, "x": "急ぐ理由はどこにもなかった。"}, {"t": 251.25, "x": "夜は茂みの根元で眠る。朝になればまた地面を歩く。"}, {"t": 254.81666666666666, "x": "仲間とは茂み越しに声で呼び合った。"}, {"t": 257.1666666666667, "x": "姿が見えなくても声が返ってくれば、"}, {"t": 259.46666666666664, "x": "そこに仲間がいることは分かる。"}, {"t": 261.55, "x": "声の高さと間の取り方で、それが誰なのかも分かった。"}, {"t": 265.1333333333333, "x": "森は広く、敵はいなかった。"}, {"t": 267.4166666666667, "x": "私たちの暮らしはそれで出来上がっていた。"}, {"t": 269.8666666666667, "x": "初めて見た人間は海のほうから歩いてきた。"}, {"t": 272.5833333333333, "x": "二本の脚で立って歩く生き物を、"}, {"t": 274.56666666666666, "x": "私はそれまで見たことがなかった。"}, {"t": 276.98333333333335, "x": "背は私よりずっと高い。羽は無い。"}, {"t": 279.76666666666665, "x": "そのかわりに色のついた布を体に巻いている。"}, {"t": 282.48333333333335, "x": "手に長い棒を持っている者もいた。私は逃げなかった。"}, {"t": 285.9166666666667, "x": "逃げなかったのは脚が遅かったからではない。"}, {"t": 288.43333333333334, "x": "逃げるという考えそのものが、"}, {"t": 290.18333333333334, "x": "そのときの私の中に無かったからだ。"}, {"t": 292.6, "x": "この森で近づいてくるものが"}, {"t": 294.21666666666664, "x": "私を食べたことは一度もなかった。"}, {"t": 296.3, "x": "私はその場に立ったまま人間を見ていた。"}, {"t": 298.8833333333333, "x": "人間も私を見ていた。人間は"}, {"t": 300.76666666666665, "x": "両手を広げてゆっくりと近づいてきた。"}, {"t": 303.3666666666667, "x": "私が走らないと決めてかかっている歩き方だった。"}, {"t": 306.3666666666667, "x": "私は首を伸ばして羽を膨らませた。"}, {"t": 308.6666666666667, "x": "相手に自分を大きく見せるときの形だ。"}, {"t": 311.2, "x": "人間はそこで足を止めた。それから地面にしゃがみ込んで、"}, {"t": 314.56666666666666, "x": "平たい板のようなものに何かを描き始めた。"}, {"t": 317.5833333333333, "x": "ときどき私のほうを見てはまた板に目を落とす。"}, {"t": 320.43333333333334, "x": "私はそのあいだずっと羽を膨らませていた。"}, {"t": 323.05, "x": "膨らませた羽の分だけ私は丸く見えたはずだ。"}, {"t": 326.03333333333336, "x": "人間が板に写し取ったのはそういう私だった。"}, {"t": 328.95, "x": "人間はそれから何度もやってきた。"}, {"t": 330.98333333333335, "x": "来るたびに仲間が何羽か連れていかれた。"}, {"t": 333.31666666666666, "x": "棒で打たれる者がいた。脚をつかまれて"}, {"t": 335.6, "x": "生きたまま運ばれていく者もいた。"}, {"t": 337.6333333333333, "x": "私は茂みの陰からそれを見ていた。追いかけはしなかった。"}, {"t": 341.23333333333335, "x": "追いかけて何をすればいいのかを私たちは知らなかった。"}, {"t": 344.45, "x": "一度、捕まった仲間が人間の手に嘴で強く噛みついた。"}, {"t": 348.5833333333333, "x": "人間は大きな声を上げて手を振り回した。"}, {"t": 351.21666666666664, "x": "硬い種を割る嘴だ。噛まれれば痛い。"}, {"t": 353.9, "x": "生きたまま連れていかれた仲間は、海に"}, {"t": 356.5, "x": "浮かぶ大きな影のところまで運ばれていった。"}, {"t": 358.95, "x": "その先で何があったのかを私は見ていない。"}, {"t": 361.5833333333333, "x": "ただ、森を歩かず自分で実を探さず、与えられるものだけを"}, {"t": 365.8833333333333, "x": "食べる暮らしが体をどう変えるかは想像がつく。"}, {"t": 368.71666666666664, "x": "私たちは乾いた季節に重くなる鳥だ。"}, {"t": 371.28333333333336, "x": "歩かずに食べ続ければ重いままになる。"}, {"t": 373.6, "x": "人間の数は多くなかった。いつも"}, {"t": 375.6333333333333, "x": "同じくらいの数が海の近くの小屋にいた。"}, {"t": 378.21666666666664, "x": "変わったのは人間と一緒に来た獣のほうだ。"}, {"t": 380.98333333333335, "x": "最初に気づいたのは地面の匂いだった。"}, {"t": 383.31666666666666, "x": "知らない獣の匂いが森の奥まで入り込んでくる。"}, {"t": 386.35, "x": "鼻の長い、脚の短いずんぐりした獣だ。"}, {"t": 389.53333333333336, "x": "群れで地面を掘り返しながら進んでいく。"}, {"t": 391.98333333333335, "x": "落ち葉の下の根も落ちた実も、掘り出しては食べていく。"}, {"t": 395.25, "x": "その獣の通ったあとに巣が一つあった。"}, {"t": 397.6333333333333, "x": "私の巣だった。卵は無かった。"}, {"t": 399.8333333333333, "x": "殻のかけらだけが掘り返された"}, {"t": 401.6, "x": "土に混ざって散らばっていた。"}, {"t": 403.1333333333333, "x": "木の上にも知らないものが来た。"}, {"t": 404.98333333333335, "x": "長い尾の、手先の器用な獣だ。"}, {"t": 407.55, "x": "枝から枝へ渡りながら実をもいで食べる。"}, {"t": 409.9166666666667, "x": "熟れて落ちてくるはずの実が落ちる前に無くなっていく。"}, {"t": 412.8333333333333, "x": "その獣は地面に降りてきて茂みの根元を探ることもあった。"}, {"t": 416.46666666666664, "x": "人間の連れてきた犬という獣は私たちを追いかけてきた。"}, {"t": 419.98333333333335, "x": "この森に初めて、追いかけてくるものが現れた。"}, {"t": 423.2, "x": "私は走った。倒れた木を越えて藪の奥へ抜けた。"}, {"t": 426.5, "x": "脚は速かった。藪の中なら引き離すことができた。"}, {"t": 429.7, "x": "けれども巣は走れない。卵は置かれた"}, {"t": 431.93333333333334, "x": "場所から一歩も動けない。私の脚の速さは、"}, {"t": 435.0, "x": "卵を守る役には立たなかった。"}, {"t": 437.1333333333333, "x": "木の倒れる音も聞こえるようになった。"}, {"t": 439.3333333333333, "x": "海に近い森から先に木が減っていった。"}, {"t": 441.7, "x": "次の乾いた季節、私はもう一度卵を産んだ。"}, {"t": 445.28333333333336, "x": "前とは違う茂みのいちばん深い場所を選んだ。"}, {"t": 448.1666666666667, "x": "それでもある朝、巣は掘り返されていた。"}, {"t": 450.9, "x": "モーリシャス島はマダガスカルの東、"}, {"t": 453.06666666666666, "x": "インド洋に浮かぶ火山の島である。"}, {"t": 455.53333333333336, "x": "ドードーはこの島だけに住んでいた飛べないハトの仲間だ。"}, {"t": 458.78333333333336, "x": "学名はラフス・ククラトゥス。"}, {"t": 460.5, "x": "いま生きている鳥のうち最も近い"}, {"t": 462.6, "x": "親戚はミノバトとされている。"}, {"t": 464.4, "x": "人間の記録に初めて現れるのは一五九八年である。"}, {"t": 468.6333333333333, "x": "オランダの遠征隊がこの島に立ち寄り、"}, {"t": 470.95, "x": "副提督ワイブラント・ファン・ワールウェイクの"}, {"t": 473.71666666666664, "x": "航海日誌にこの鳥が登場する。"}, {"t": 475.76666666666665, "x": "オランダ人はこの鳥をワルフフォーヘルと呼んだ。"}, {"t": 478.53333333333336, "x": "ワルフには味気ない、胸の悪くなるという意味がある。"}, {"t": 481.96666666666664, "x": "一六〇二年の航海日誌からは"}, {"t": 484.25, "x": "ドーダールスという呼び名も現れる。"}, {"t": 486.3333333333333, "x": "意味は「太った尻」とも「結び目のある尻」とも言われる。"}, {"t": 491.45, "x": "ドードーという名前そのものの由来ははっきりしていない。"}, {"t": 494.71666666666664, "x": "生きたドードーは船に積まれて"}, {"t": 496.43333333333334, "x": "ヨーロッパやアジアへ運ばれた。"}, {"t": 498.21666666666664, "x": "古生物学者のジュリアン・ヒュームは同時代の"}, {"t": 500.81666666666666, "x": "記録と絵と標本を突き合わせて、少なくとも"}, {"t": 503.8, "x": "十一羽が生きたまま目的地に着いたと推定している。"}, {"t": 506.98333333333335, "x": "ヨーロッパでこの鳥を最も多く描いたのは"}, {"t": 509.56666666666666, "x": "画家ルーラント・サーフェリーである。"}, {"t": 511.3, "x": "なかでも一六二〇年代の一枚は、"}, {"t": 513.8666666666667, "x": "のちに鳥類学者ジョージ・エドワーズが"}, {"t": 516.3166666666667, "x": "持っていたことから「エドワーズのドードー」と呼ばれる。"}, {"t": 520.0, "x": "ひときわ太った鳥として描かれたこの絵が、"}, {"t": 522.55, "x": "その後のドードーの標準的な姿になった。"}, {"t": 525.5333333333333, "x": "いまの研究者の多くは、こうしたヨーロッパの"}, {"t": 528.5333333333333, "x": "絵の多くが飼われて餌を与えられすぎた個体や、"}, {"t": 531.3833333333333, "x": "雑に詰め物をされた剥製をもとにしていたと考えている。"}, {"t": 535.1833333333333, "x": "羽を膨らませた姿を描いた可能性も指摘されている。"}, {"t": 538.7833333333333, "x": "一八六六年、イギリスの解剖学者"}, {"t": 542.35, "x": "リチャード・オーウェンは島の湿地から"}, {"t": 544.1166666666667, "x": "掘り出された骨で初めて骨格を組み立てた。"}, {"t": 546.7833333333333, "x": "手本にしたのはエドワーズのドードーで、"}, {"t": 549.0, "x": "骨格はずんぐりと太りすぎていた。"}, {"t": 551.55, "x": "その前年には『不思議の国の"}, {"t": 553.9, "x": "アリス』にドードーが登場している。"}, {"t": 556.35, "x": "この本が広く読まれたことで"}, {"t": 558.1333333333333, "x": "描かれ方はさらに誇張されていった。"}, {"t": 560.3333333333334, "x": "見直しが始まったのは二十世紀の終わりである。"}, {"t": 563.2833333333333, "x": "一九九三年、アンドリュー・キッチナーは"}, {"t": 566.7666666666667, "x": "骨の寸法から模型を作って体重を見積もった。"}, {"t": 570.0166666666667, "x": "野生の個体でおよそ十・六から十七・五キログラム。"}, {"t": 573.7, "x": "誇張された絵に合わせた太った模型では"}, {"t": 576.15, "x": "二十一・七から二十七・八キログラムになった。"}, {"t": 579.4, "x": "キッチナーは脚の骨の強さから、この鳥が"}, {"t": 582.4166666666666, "x": "かなり速く走れたことも示している。"}, {"t": 584.6, "x": "二〇一一年、デルフィーヌ・アングストらは"}, {"t": 587.7166666666667, "x": "脚の骨の長さから平均体重を十・二キログラムと推定した。"}, {"t": 592.1333333333333, "x": "大きめの野生の七面鳥ほどである。"}, {"t": 594.5833333333334, "x": "同じ年に「それほど細くはなかった」とする反論も"}, {"t": 598.5, "x": "出ており、数字そのものはいまも議論が続いている。"}, {"t": 601.95, "x": "二〇一六年には骨格をシーティーで"}, {"t": 604.3166666666667, "x": "読み取って体積を計算し、十・六から"}, {"t": 607.4333333333333, "x": "十四・三キログラムとする研究が出た。"}, {"t": 610.1, "x": "二〇一七年には骨の断面に残る成長の"}, {"t": 613.2333333333333, "x": "跡から暮らしの季節が読み取られた。"}, {"t": 615.3, "x": "繁殖はおよそ八月。その前に体を太らせ、繁殖を"}, {"t": 619.65, "x": "終えた親は三月ごろから羽が抜け替わる。"}, {"t": 622.2666666666667, "x": "船乗りたちの記録で羽の描写が食い違うのは、見た"}, {"t": 625.7666666666667, "x": "季節が違ったためかもしれない。"}, {"t": 627.5666666666667, "x": "二〇二四年には分類を見直した研究者たちが、"}, {"t": 630.8833333333333, "x": "足の指を閉じる腱がきわめて強かったことを挙げて、"}, {"t": 634.4166666666666, "x": "非常に活発で速い動物だったと述べている。"}, {"t": 637.55, "x": "インドにも一枚の絵が残っている。"}, {"t": 639.7, "x": "ムガル帝国の画家ウスタード・マンスールが"}, {"t": 641.9666666666667, "x": "一六二五年ごろに描いたとされるもので、そこにいる"}, {"t": 645.75, "x": "ドードーはヨーロッパの絵より細く茶色がかっている。"}, {"t": 648.6333333333333, "x": "生きたドードーを描いた絵のうち"}, {"t": 650.35, "x": "最も正確なものの一つと考えられている。"}, {"t": 653.1, "x": "骨格の形は標本があるので確かである。"}, {"t": 655.9333333333333, "x": "体重には推定の幅があり、羽の色は断定できない。"}, {"t": 659.9, "x": "そのうえで、太って動けない鳥という姿は"}, {"t": 663.0333333333333, "x": "野生の姿ではなかった可能性が高い。"}, {"t": 665.6166666666667, "x": "では、なぜ止まらなかったのか。"}, {"t": 667.9166666666666, "x": "モーリシャスはオランダ東インド会社の"}, {"t": 670.2, "x": "船が水と食料を積み込む島として使われた。"}, {"t": 673.15, "x": "ただし十七世紀を通じて島に"}, {"t": 675.35, "x": "住む人間は五十人を超えなかった。"}, {"t": 677.7, "x": "考古学の調査でも、人間がドードーを大量に"}, {"t": 681.0833333333334, "x": "食べた跡はほとんど見つかっていない。"}, {"t": 683.1, "x": "影響が大きかったのは人間と一緒に上陸した動物である。"}, {"t": 687.0666666666667, "x": "犬、猫、ブタ、ネズミ、そしてカニクイザル。"}, {"t": 691.7333333333333, "x": "彼らは地面の巣を荒らし、限られた食べ物を奪い合った。"}, {"t": 695.7666666666667, "x": "なかでもブタとサルの影響は"}, {"t": 697.5, "x": "狩猟よりも大きかったと考えられている。"}, {"t": 699.9666666666667, "x": "同じころ森そのものも切り開かれていった。"}, {"t": 702.6166666666667, "x": "一つの巣に卵は一つ。地面に置かれた"}, {"t": 705.4166666 2.2666666666667, "x": "私は首を低くして、落ち葉の"}, {"t": 814.6, "x": "上に仲間の匂いをもう一度探した。"}, {"t": 816.75, "x": "見つからなかった。犬に追われたのはそのころのことだ。"}, {"t": 819.9166666666666, "x": "茂みの向こうから低い息づかいが近づいてきた。"}, {"t": 822.7833333333333, "x": "私は走った。倒れた木を越え、根の張った斜面を"}, {"t": 826.4, "x": "駆け下り、岩のあいだの窪みを渡った。"}, {"t": 829.0166666666667, "x": "脚はまだ速かった。息づかいは途中で聞こえなくなった。"}, {"t": 832.4833333333333, "x": "走り終えて私は立ち止まった。"}, {"t": 834.45, "x": "胸が大きく上下していた。走れる脚があることを、私は"}, {"t": 838.5, "x": "そのとき少しだけ誇らしいと思った。"}, {"t": 840.6333333333333, "x": "けれどもこの脚で守れるのは、もう私一羽だけだった。"}, {"t": 844.1833333333333, "x": "人間を最後に見たのがいつだったかは覚えていない。"}, {"t": 847.1833333333333, "x": "海の近くに火を焚く煙が上がっていたのは覚えている。"}, {"t": 850.4333333333333, "x": "人間はもう森の奥まで私たちを探しには来なくなっていた。"}, {"t": 854.1, "x": "探しても見つからなくなっていたのだと思う。"}, {"t": 856.5166666666667, "x": "ときどき思い出すのは、羽を膨らませた私を"}, {"t": 859.5833333333334, "x": "板に描いていたあの人間のことだ。"}, {"t": 861.6, "x": "あの板の中の私は丸かっただろう。"}, {"t": 863.9333333333333, "x": "膨らませた羽と乾いた季節の重い体。"}, {"t": 866.5666666666667, "x": "あの人間は見たとおりに描いたのだと思う。"}, {"t": 869.1666666666666, "x": "嘘を描いたわけではない。ただ私が"}, {"t": 871.4333333333333, "x": "走るところを、あの人間は見ていなかった。"}, {"t": 874.2666666666667, "x": "逃げなかったのは走れなかったからではない。"}, {"t": 876.6333333333333, "x": "逃げる理由を知らなかったからだ。"}, {"t": 878.5166666666667, "x": "人間の目に映ったのは、その逃げなかった私たちだった。"}, {"t": 882.1333333333333, "x": "私たちの本当の速さを知っているのは、"}, {"t": 884.6333333333333, "x": "この森の地面だけだ。最後の"}, {"t": 886.4333333333333, "x": "日のことは順を追っては覚えていない。"}, {"t": 888.9166666666666, "x": "覚えているのは水場へ降りる道の"}, {"t": 890.95, "x": "途中で脚が止まったことだ。"}, {"t": 892.55, "x": "痛みがあったわけではない。"}, {"t": 894.0833333333334, "x": "次の一歩を出す理由が見つからなかった。"}, {"t": 896.5333333333333, "x": "私は道の上に立っていた。倒れてはいない。"}, {"t": 899.4333333333333, "x": "脚にはまだ力が残っていた。"}, {"t": 901.3333333333334, "x": "葉の細長い木が風で揺れていた。"}, {"t": 903.45, "x": "遠くで知らない獣が地面を掘る音がした。私は鳴いた。"}, {"t": 907.0833333333334, "x": "返事は無い。もう一度だけ鳴いた。"}, {"t": 909.2, "x": "やはり返事は無い。それで分かった。"}, {"t": 911.4, "x": "私は脚を折って落ち葉の上に体を下ろした。"}, {"t": 914.2666666666667, "x": "巣の上でもない     mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
