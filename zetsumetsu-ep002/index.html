375}, {"t": 1072.5166666666667, "i": 376}, {"t": 1074.4, "i": 377}, {"t": 1077.1333333333334, "i": 378}, {"t": 1079.95, "i": 379}, {"t": 1082.2833333333333, "i": 379}], "subs": [{"t": 0.0, "x": "人間は私をベンジャミンと呼ぶ。"}, {"t": 2.1, "x": "その名で呼ばれたことは一度もない。"}, {"t": 4.116666666666666, "x": "私が死んでずっと後になって、"}, {"t": 5.85, "x": "ある男がそう言い出し、それが広まった。"}, {"t": 8.983333333333333, "x": "私にはもう訂正のしようがない。"}, {"t": 11.083333333333334, "x": "今、私はコンクリートの床に伏せている。"}, {"t": 14.033333333333333, "x": "腹の下から冷えが上がってくる。"}, {"t": 15.916666666666666, "x": "この島の九月はまだ冬の続きだ。"}, {"t": 18.116666666666667, "x": "網の向こうで街の音がしている。鼻を上げて風を吸った。"}, {"t": 21.65, "x": "山のほうから来る風にも、海のほうから来る"}, {"t": 24.616666666666667, "x": "風にも、私と同じ匂いは混ざっていない。"}, {"t": 27.566666666666666, "x": "昨日も、その前の冬も混ざっていなかった。"}, {"t": 30.45, "x": "檻の外に、もう仲間はいなかった。"}, {"t": 32.85, "x": "少なくとも私の鼻が届くところには。"}, {"t": 35.31666666666667, "x": "私の世界は夜でできていた。"}, {"t": 37.25, "x": "昼は倒れた木の下や岩の割れ目で眠る。"}, {"t": 39.8, "x": "日が落ちて森の中から明るさが"}, {"t": 41.666666666666664, "x": "引いていくと、そこで初めて目を開ける。"}, {"t": 44.2, "x": "一日はそこから始まる。最初の記憶は暗くて暖かい場所だ。"}, {"t": 48.21666666666667, "x": "母の腹にある袋の中だ。私たちの"}, {"t": 50.5, "x": "袋は後ろ向きに開いている。"}, {"t": 52.46666666666667, "x": "母が歩くと袋の口は母の後ろ足のほうを向いて揺れた。"}, {"t": 56.05, "x": "外の匂いはいつも後ろから入ってきた。"}, {"t": 58.5, "x": "やがて私は袋から顔を出し、それから袋を出た。"}, {"t": 62.06666666666667, "x": "しばらくは母の近くにいて、母が"}, {"t": 64.46666666666667, "x": "何を嗅ぎどこで立ち止まるかを見て覚えた。"}, {"t": 66.86666666666666, "x": "体が大きくなると、ひとりで歩くようになった。"}, {"t": 70.01666666666667, "x": "私の背中から尾の付け根にかけて黒い縞が並んでいる。"}, {"t": 73.28333333333333, "x": "それは知っている。自分の体の色については言わない。"}, {"t": 76.63333333333334, "x": "夜しか歩かない者に色はほとんど要らなかった。"}, {"t": 79.41666666666667, "x": "森の暗がりで役に立つのは目と耳と鼻だ。"}, {"t": 82.05, "x": "私は速く走れない。脚の運びが硬く、"}, {"t": 84.58333333333333, "x": "長く追いかけることには向いていない。"}, {"t": 87.26666666666667, "x": "だから待つ。獣の通り道を覚えておく。"}, {"t": 90.06666666666666, "x": "草が倒れている筋や土が踏み固められた場所。"}, {"t": 92.95, "x": "同じ匂いが何度も重なっているところ。"}, {"t": 95.36666666666666, "x": "その脇で風下に伏せて動かずにいる。"}, {"t": 97.75, "x": "伏せているあいだ動かすのは耳だけだ。"}, {"t": 100.01666666666667, "x": "枝の折れる音と葉の擦れる音、遠くの沢の音。"}, {"t": 103.53333333333333, "x": "その中から自分の知っている重さの足音を拾い出す。"}, {"t": 106.86666666666666, "x": "夜露が背中に降りて毛が重くなっても、私は顔を上げない。"}, {"t": 110.91666666666667, "x": "やがて小さな足音が近づいてくる。"}, {"t": 113.2, "x": "ワラビーだったりポッサムだったり、"}, {"t": 114.9, "x": "地面を掘る小さな獣だったりする。"}, {"t": 117.53333333333333, "x": "距離が縮まったところで一度だけ跳ぶ。"}, {"t": 119.78333333333333, "x": "うまくいく夜もある。いかない夜のほうが多い。"}, {"t": 122.7, "x": "うまくいかなければ場所を変えてまた待つ。"}, {"t": 125.0, "x": "腹が空いている夜は長い。けれども一度に"}, {"t": 127.55, "x": "たくさん食べておけば、しばらくは持つ。"}, {"t": 130.1, "x": "口は大きく開く。顎が外れそうなほど開く。"}, {"t": 133.25, "x": "これは獲物を捕るためだけのものではない。"}, {"t": 135.6, "x": "落ち着かないときや何かに近づかれたとき、"}, {"t": 138.03333333333333, "x": "私は口を開けて見せる。近づくなという意味だ。"}, {"t": 141.33333333333334, "x": "声も持っていた。短く乾いた咳のような声を続けて出す。"}, {"t": 145.15, "x": "遠くの仲間には、もっと長く引く声で居場所を知らせる。"}, {"t": 148.68333333333334, "x": "けれども仲間がいることを教えてくれるのは、"}, {"t": 151.13333333333333, "x": "声より匂いのほうだった。獣の通り道の"}, {"t": 154.0, "x": "脇に、私ではない誰かの匂いが残っている。"}, {"t": 157.2, "x": "新しい匂いなら昨夜ここを誰かが通った。"}, {"t": 159.91666666666666, "x": "古い匂いならしばらく前だ。"}, {"t": 161.65, "x": "会いに行くことはあまりない。"}, {"t": 163.13333333333333, "x": "私たちはひとりか、せいぜい二頭で歩く。"}, {"t": 165.98333333333332, "x": "ただ同じ森のどこかに同じ匂いの持ち主がいる。"}, {"t": 168.98333333333332, "x": "それが分かっていれば十分だった。雨の多い森だった。"}, {"t": 172.4, "x": "苔が岩を覆い、朽ちた木の上に若い木が生えている。"}, {"t": 176.21666666666667, "x": "夜明けが近づくと霧が谷に降りてきて音が遠くなる。"}, {"t": 179.33333333333334, "x": "それが眠る合図だった。冬の夜は長い。"}, {"t": 182.01666666666668, "x": "長いぶんだけ歩ける。霜の降りた草を踏むと足の裏が痛む。"}, {"t": 185.88333333333333, "x": "それでも冬は嫌いではなかった。"}, {"t": 187.85, "x": "冷えた空気は匂いを遠くまで運ばない。"}, {"t": 190.3, "x": "そのかわり近くの匂いがはっきりする。"}, {"t": 192.56666666666666, "x": "獲物がすぐそばにいるかどうかが、"}, {"t": 194.53333333333333, "x": "冬のほうがよく分かった。春が来ると"}, {"t": 196.93333333333334, "x": "森の匂いが一度にふくらむ。"}, {"t": 198.76666666666668, "x": "どこかの袋の中で新しい子が育ち始める季節だ。"}, {"t": 202.0, "x": "私はこの島しか知らない。海の"}, {"t": 203.98333333333332, "x": "向こうに大きな陸があって、かつてそこにも"}, {"t": 206.8, "x": "私たちがいたということを私は知らない。"}, {"t": 209.2, "x": "私が知っていたのは森の匂いと夜の長さと、"}, {"t": 212.0, "x": "通り道に残る仲間の匂いだけだった。"}, {"t": 214.73333333333332, "x": "人間は私が生まれるより前からこの島にいた。"}, {"t": 217.68333333333334, "x": "だから私にとって人間は、ある日突然来たものではない。"}, {"t": 221.41666666666666, "x": "森の端に行けばいつもそこにいる何かだった。"}, {"t": 224.06666666666666, "x": "森の端には柵があった。柵の"}, {"t": 225.93333333333334, "x": "向こうに白くて丸い獣が群れている。"}, {"t": 228.38333333333333, "x": "鈍い声で鳴き、同じ方向を向いて草を食べている。"}, {"t": 231.9, "x": "匂いが強い。風に乗って森の奥まで届く。"}, {"t": 234.83333333333334, "x": "あれが羊というものだと知ったのはずっと後のことだ。"}, {"t": 237.86666666666667, "x": "私は柵の中に入ったことがない。入る理由が無かった。"}, {"t": 241.43333333333334, "x": "あの獣は大きすぎて、私の口には合わない。"}, {"t": 244.73333333333332, "x": "柵の近くには犬がいた。犬は私たちの匂いを嫌う。"}, {"t": 248.35, "x": "吠えながら追ってくる。私は走るのが得意ではないから、"}, {"t": 251.68333333333334, "x": "茂みの深いほうへ逃げ込むしかなかった。"}, {"t": 254.23333333333332, "x": "乾いた破裂音を何度か聞いた。"}, {"t": 256.26666666666665, "x": "遠くの谷で一度。尾根の向こうで一度。"}, {"t": 258.85, "x": "そのあとしばらく森が静かになる。"}, {"t": 260.85, "x": "いつの頃からか、通り道に残る"}, {"t": 263.1666666666667, "x": "仲間の匂いが古いままになった。"}, {"t": 265.05, "x": "前は幾筋も重なっていた匂いが一筋になる。"}, {"t": 267.93333333333334, "x": "その一筋も新しくならない。"}, {"t": 269.75, "x": "やがてどの道からも薄れて消えていく。"}, {"t": 272.05, "x": "私はそれを、そういう季節なのだと思っていた。"}, {"t": 275.28333333333336, "x": "獣の通り道にも見慣れないものが増えた。"}, {"t": 277.85, "x": "人間の匂いのついた細いものが地面の近くに張られている。"}, {"t": 281.3833333333333, "x": "私はそれを避けて歩いていた。"}, {"t": 283.3, "x": "ある夜、避けきれなかった。"}, {"t": 285.23333333333335, "x": "脚が引かれて前に進めなくなった。引けば引くほど締まる。"}, {"t": 288.55, "x": "私は口を開けて、見えない相手に向かって何度も威嚇した。"}, {"t": 292.48333333333335, "x": "誰も来なかった。朝が来て、それから人間が来た。"}, {"t": 295.96666666666664, "x": "そこから先のことは順番通りには覚えていない。"}, {"t": 298.98333333333335, "x": "暗い箱の中にいた。揺れていた。匂いが次々に変わった。"}, {"t": 302.85, "x": "森の匂いが薄くなり、煙と油の匂いが濃くなっていった。"}, {"t": 306.75, "x": "箱が開いたとき、私はコンクリートの床の上にいた。"}, {"t": 310.43333333333334, "x": "囲いは狭かった。何歩か歩けば網に当たる。"}, {"t": 313.4, "x": "向きを変えてまた何歩か歩く。私はそれを繰り返した。"}, {"t": 316.93333333333334, "x": "人間はそれを見て、行ったり来たりしていると言った。"}, {"t": 320.0833333333333, "x": "私にとっては夜の森で獣の通り道を"}, {"t": 322.76666666666665, "x": "たどるのと同じことだった。"}, {"t": 324.21666666666664, "x": "ただ、どこまでたどっても同じ網に戻ってくる。"}, {"t": 327.3, "x": "まわりには知らない匂いが満ちていた。"}, {"t": 329.43333333333334, "x": "知らない獣の毛の匂い。知らない鳥の羽の匂い。"}, {"t": 332.73333333333335, "x": "夜になると、あちこちの囲いから知らない声が上がる。"}, {"t": 336.26666666666665, "x": "そのどれもが私の声とは違っていた。"}, {"t": 338.7, "x": "最初の夜、私は一晩じゅう鼻を上げていた。"}, {"t": 341.9166666666667, "x": "森の匂いを探した。見つかるのは煙の匂いばかりだった。"}, {"t": 345.5, "x": "人間の街というものは、夜になっても匂いが眠らない。"}, {"t": 349.03333333333336, "x": "網の目に鼻先を押し当てると冷たい針金の匂いがした。"}, {"t": 352.45, "x": "自分の毛に残っていた森の匂いも、"}, {"t": 354.53333333333336, "x": "何日かするうちに網と床の匂いに変わっていった。"}, {"t": 357.8833333333333, "x": "昼のあいだ網の前を人間が通る。"}, {"t": 360.2, "x": "眠る時間なのに足音と声が途切れない。"}, {"t": 362.7, "x": "私は深く眠ることをやめて浅くまどろむようになった。"}, {"t": 365.95, "x": "目を半分閉じて床に伏せる。"}, {"t": 367.8, "x": "足音が近づけば顔を上げ、遠ざかればまた伏せる。"}, {"t": 371.28333333333336, "x": "森では日が落ちれば目が覚めた。"}, {"t": 373.1666666666667, "x": "ここでは足音がすっかり途切れるまで、"}, {"t": 375.3833333333333, "x": "目を閉じきることができなかった。"}, {"t": 377.4, "x": "立ち止まって私を指さす人間がいる。"}, {"t": 379.8666666666667, "x": "トラという言葉が聞こえた。"}, {"t": 381.51666666666665, "x": "オオカミという言葉も聞こえた。"}, {"t": 383.3666666666667, "x": "私はトラを見たことがない。"}, {"t": 385.06666666666666, "x": "オオカミも見たことがない。"}, {"t": 386.56666666666666, "x": "私はそのどちらでもなかったのだと思う。"}, {"t": 388.98333333333335, "x": "人間は私が口を開けるのを待っていた。"}, {"t": 391.45, "x": "私が大きく口を開けると網の外で声が上がる。"}, {"t": 394.5, "x": "人間はそれをあくびと呼んだ。"}, {"t": 396.28333333333336, "x": "あれはあくびではない。近づくなという合図だ。"}, {"t": 399.0833333333333, "x": "ただ、網のこちら側から出す合図は、"}, {"t": 401.6333333333333, "x": "網の向こう側には届かなかった。"}, {"t": 403.98333333333335, "x": "餌は人間が持ってきた。肉の塊が網の下から押し込まれる。"}, {"t": 407.95, "x": "まだ温かいこともあれば冷えきっていることもある。"}, {"t": 410.81666666666666, "x": "自分で待って獲る必要は無くなった。"}, {"t": 412.96666666666664, "x": "そのかわり、待つということそのものが無くなった。"}, {"t": 416.0, "x": "ここで網の外側から記録を見ていく。"}, {"t": 418.53333333333336, "x": "フクロオオカミはオオカミではない。"}, {"t": 420.51666666666665, "x": "腹に袋を持つ有袋類で、カンガルーや"}, {"t": 423.46666666666664, "x": "コアラと同じ仲間に入る肉食獣である。"}, {"t": 426.06666666666666, "x": "袋は後ろ向きに開き、雄にも袋があった。"}, {"t": 429.5, "x": "学名はギリシャ語で「袋を持つ犬の頭の者」を意味する。"}, {"t": 434.06666666666666, "x": "背中から尾の付け根に並ぶ濃い縞から、"}, {"t": 436.48333333333335, "x": "英語圏ではタスマニアタイガーとも呼ばれた。"}, {"t": 439.55, "x": "トラでもない。この獣はかつてオーストラリア大陸にも"}, {"t": 442.8666666666667, "x": "広く住んでいた。大陸から姿を"}, {"t": 445.18333333333334, "x": "消したのは、およそ三千二百年前と推定されている。"}, {"t": 448.93333333333334, "x": "二千年以上前とする見方もあり時期には幅がある。"}, {"t": 452.28333333333336, "x": "ディンゴと呼ばれる野生の犬が大陸に広がった"}, {"t": 455.05, "x": "時期と重なることから、関係が指摘されている。"}, {"t": 458.1333333333333, "x": "以後この種が残ったのは、海峡を"}, {"t": 460.65, "x": "隔てた南の島タスマニアだけだった。"}, {"t": 462.96666666666664, "x": "十九世紀の初め、イギリスからの"}, {"t": 465.6333333333333, "x": "入植者がこの島に羊を持ち込んだ。"}, {"t": 468.05, "x": "一八〇八年には島の測量副長官だった"}, {"t": 471.15, "x": "ジョージ・ハリスが、この獣について"}, {"t": 474.01666666666665, "x": "最初の詳しい学術的な記載を残している。"}, {"t": 476.85, "x": "羊が増えると羊が殺される事件も増えた。"}, {"t": 479.8833333333333, "x": "その犯人として名指しされたのがフクロオオカミだった。"}, {"t": 483.15, "x": "一八三〇年、島の北西部に広大な土地を"}, {"t": 487.01666666666665, "x": "持つヴァン・ディーメンズ・ランド会社が"}, {"t": 489.98333333333335, "x": "フクロオオカミに賞金をかけた。"}, {"t": 491.81666666666666, "x": "雄一頭に五シリング、雌一頭に七シリング。"}, {"t": 495.35, "x": "記録に残るものとしては最初の賞金制度とされている。"}, {"t": 498.8666666666667, "x": "会社は賞金だけでは足りないと考えた。"}, {"t": 501.6333333333333, "x": "一八三五年から三七年にかけては、野犬と"}, {"t": 505.8, "x": "フクロオオカミを駆除するための専門の男を雇っている。"}, {"t": 509.25, "x": "一八八九年にも、トラやカンガルーを罠で"}, {"t": 512.9333333333333, "x": "捕る信用できる男を求める広告を出した。"}, {"t": 515.7666666666667, "x": "この会社の文書では、フクロオオカミは"}, {"t": 518.6, "x": "トラと書かれていた。この会社の"}, {"t": 520.4833333333333, "x": "牧場の一つウールノースでは、"}, {"t": 522.25, "x": "賞金目当てに殺された数が記録に残っている。"}, {"t": 525.6333333333333, "x": "その数は一九〇〇年の十九頭が最も多く、"}, {"t": 529.0833333333334, "x": "一九〇六年には一頭に減った。"}, {"t": 531.8333333333334, "x": "そのあと記録が途絶え、一九一四年に"}, {"t": 535.05, "x": "最後の三頭が殺されている。"}, {"t": 536.95, "x": "一八八八年にはタスマニア植民地政府が賞金制度を始めた。"}, {"t": 542.0, "x": "成獣一頭につき一ポンド、子ども一頭につき十シリング。"}, {"t": 546.25, "x": "死体を役所に持ち込めば賞金が支払われた。"}, {"t": 549.3166666666667, "x": "制度は一九〇九年まで続き、その間に"}, {"t": 552.7166666666667, "x": "支払われた賞金は二千百八十四件にのぼる。"}, {"t": 556.0833333333334, "x": "これは支払われた件数であって殺された数ではない。"}, {"t": 559.3833333333333, "x": "賞金を請求されずに殺された個体は、"}, {"t": 562.0666666666667, "x": "これよりはるかに多かったと考えられている。"}, {"t": 565.0333333333333, "x": "ではフクロオオカミは本当に羊を襲っていたのか。"}, {"t": 568.3333333333334, "x": "二〇一一年、ニューサウスウェールズ大学の研究チームが"}, {"t": 572.5, "x": "頭骨の強度をコンピューターで再現して調べた。"}, {"t": 575.4666666666667, "x": "結論は、顎の力が体の大きさの割に弱く、"}, {"t": 579.1333333333333, "x": "主な獲物はポッサムほどの大きさの"}, {"t": 581.6833333333333, "x": "動物だった可能性が高いというものだった。"}, {"t": 584.35, "x": "羊を襲う獣という評判は少なくとも"}, {"t": 587.1, "x": "誇張されていたことになる。"}, {"t": 588.5833333333334, "x": "オーストラリア博物館も、羊や家禽を襲ったという"}, {"t": 592.2, "x": "報告はほぼ確実に誇張されていると記している。"}, {"t": 595.2833333333333, "x": "ただし減った原因を賞金だけに求めることはできない。"}, {"t": 598.6833333333333, "x": "入植者が連れてきた犬が野生化し、同じ獲物を奪い合った。"}, {"t": 603.0, "x": "森が切り開かれて牧場に変わった。"}, {"t": 605.3833333333333, "x": "獲物になる小型の有袋類も数を減らした。"}, {"t": 608.25, "x": "十九世紀の末には人間が持ち込んだ病気が"}, {"t": 611.2333333333333, "x": "野生の個体群に広がったとする研究もあるが、"}, {"t": 614.2666666666667, "x": "その病気が何だったのかは確定していない。"}, {"t": 617.1833333333333, "x": "どの原因がどれだけ効いたのかを"}, {"t": 619.1, "x": "今から分けて量ることはできない。"}, {"t": 621.0333333333333, "x": "確かなのは、いくつもの原因が"}, {"t": 623.25, "x": "同じ時期に重なったということである。"}, {"t": 625.2833333333333, "x": "政府の賞金制度が終わった一九〇九年の時点で、"}, {"t": 628.9, "x": "野生の個体はすでに目に見えて少なくなっていた。"}, {"t": 632.2833333333333, "x": "一九三〇年、島の北西部で農家の"}, {"t": 635.9, "x": "ウィルフ・バッティが一頭を撃った。"}, {"t": 638.35, "x": "これが野生で殺された最後の確かな記録とされている。"}, {"t": 641.75, "x": "翌一九三一年には若い雄が生け捕りにされ、"}, {"t": 645.4333333333333, "x": "動物の商人に売られた。年代の確かな野生の"}, {"t": 648.7333333333333, "x": "記録としては、これが最後とされる。"}, {"t": 651.55, "x": "この頃から生きたまま捕らえられて動物園に"}, {"t": 654.25, "x": "売られる個体が、わずかに残るだけになった。"}, {"t": 657.05, "x": "一九三六年七月十日、タスマニア州は"}, {"t": 660.95, "x": "フクロオオカミを保護の対象に加えた。"}, {"t": 663.3166666666667, "x": "最後の飼育個体が死んだのは、その五十九日後である。"}, {"t": 667.2166666666667, "x": "法律が遅すぎたと言うのはたやすい。"}, {"t": 669.6666666666666, "x": "ただ当時の人々の手元には、この島に何頭"}, {"t": 672.9166666666666, "x": "残っているのかを数える方法が無かった。"}, {"t": 675.4, "x": "数えられないものは減っていることにも気づけない。"}, {"t": 678.2, "x": "気づいたときには守る対象がほとんど残っていなかった。"}, {"t": 681.6, "x": "最後の個体が死んだあと、動物園は"}, {"t": 684.5333333333333, "x": "すぐに代わりの一頭を探した。"}, {"t": 686.4666666666667, "x": "示された額は三十ポンドだった。"}, {"t": 688.8666666666667, "x": "代わりは二度と見つからなかった。"}, {"t": 690.8666666666667, "x": "冬のあいだ私はひとりだった。"}, {"t": 692.7166666666667, "x": "いつからひとりだったのかを、ここで言うつもりはない。"}, {"t": 695.85, "x": "私がどこで捕まったのか、いつこの囲いに来たのかに"}, {"t": 699.1666666666666, "x": "ついて人間の記録は二つに割れている。"}, {"t": 701.4666666666667, "x": "私はそれを正すために話しているのではない。"}, {"t": 704.1833333333333, "x": "私が話せるのはこの冬のことだけだ。"}, {"t": 706.5666666666667, "x": "朝、囲いの隅で眠りに入る。昼は足音で目が覚める。"}, {"t": 710.7166666666667, "x": "人間が網の前に立ち、少しして去っていく。"}, {"t": 713.95, "x": "夕方になると人間の数が減る。"}, {"t": 716.0333333333333, "x": "夜になると網の向こうが静かになる。"}, {"t": 718.2666666666667, "x": "夜は私の時間のはずだった。"}, {"t": 720.2333333333333, "x": "目を開けて鼻を上げる。風がある。"}, {"t": 722.75, "x": "森の匂いがかすかに混ざっている日もある。"}, {"t": 725.1333333333333, "x": "山のほうから来る風だ。私はその方角に"}, {"t": 727.8, "x": "顔を向けて、しばらく動かないでいる。"}, {"t": 730.4833333333333, "x": "待つことは得意だった。森では待っていれば何かが来た。"}, {"t": 733.85, "x": "ここでは何も来なかった。来るのは朝の人間と昼の足音と、"}, {"t": 737.6333333333333, "x": "網の下から押し込まれる肉だけだ。"}, {"t": 739.9333333333333, "x": "私は歩いた。網に当たり向きを変え、また網に当たる。"}, {"t": 743.8666666666667, "x": "コンクリートの床は爪の音をそのまま返してくる。"}, {"t": 746.7833333333333, "x": "森の土は音を吸い込んだ。ここでは"}, {"t": 749.05, "x": "自分の足音がいつまでも耳に残る。"}, {"t": 751.3166666666667, "x": "歩きながら私は頭の中で森の通り道をたどっていた。"}, {"t": 754.8833333333333, "x": "倒れた木をまたいで沢の手前で折れる。"}, {"t": 757.2666666666667, "x": "苔の岩の脇で風下に回る。網に"}, {"t": 759.3166666666667, "x": "当たるたびにその道は途切れる。"}, {"t": 761.5, "x": "向きを変えると、また倒れた木のところから始まる。"}, {"t": 764.8, "x": "何度たどり直しても、沢の向こうへは一度も行けなかった。"}, {"t": 768.5333333333333, "x": "長く引くほうの声を、私はこの囲いで一度も出していない。"}, {"t": 772.4833333333333, " const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
