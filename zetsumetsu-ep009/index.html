"i": 373}, {"t": 1033.7, "i": 374}, {"t": 1037.45, "i": 375}, {"t": 1041.6, "i": 376}, {"t": 1043.5333333333333, "i": 377}, {"t": 1046.0, "i": 378}, {"t": 1048.1, "i": 379}, {"t": 1051.6666666666667, "i": 380}, {"t": 1055.2166666666667, "i": 381}, {"t": 1057.5666666666666, "i": 382}, {"t": 1060.3833333333334, "i": 383}, {"t": 1063.4166666666667, "i": 384}, {"t": 1065.9, "i": 385}, {"t": 1068.0333333333333, "i": 386}, {"t": 1070.2166666666667, "i": 387}, {"t": 1072.1666666666667, "i": 388}, {"t": 1074.4166666666667, "i": 389}, {"t": 1077.2166666666667, "i": 390}, {"t": 1080.45, "i": 391}, {"t": 1083.6, "i": 392}, {"t": 1086.45, "i": 393}, {"t": 1089.0333333333333, "i": 393}], "subs": [{"t": 0.0, "x": "その朝、私は門まで行かなかった。"}, {"t": 2.6333333333333333, "x": "門は囲いの向こうの端にある。"}, {"t": 4.566666666666666, "x": "毎朝そこまで歩いて、首を伸ばして待つ。"}, {"t": 7.483333333333333, "x": "足音が来る。鍵の音がする。"}, {"t": 9.566666666666666, "x": "それが私の一日の始まりだった。"}, {"t": 11.85, "x": "その前の夜は、いつもより深く冷えた。"}, {"t": 14.633333333333333, "x": "体の下の土が甲羅の中の温かさを少しずつ持っていった。"}, {"t": 18.333333333333332, "x": "私は首だけを伸ばした。門のほうではなく、水場のほうへ。"}, {"t": 22.3, "x": "水場まで、あと数歩だった。"}, {"t": 24.383333333333333, "x": "朝の足音を、私は聞いていない。"}, {"t": 27.1, "x": "人間は私をジョージと呼んだ。"}, {"t": 29.033333333333335, "x": "ひとりぼっちのジョージ、と。"}, {"t": 30.95, "x": "呼び名の意味は長いあいだ分からなかった。今は分かる。"}, {"t": 34.2, "x": "私の後ろにもう同じ甲羅を持つものは一頭もいない。"}, {"t": 37.46666666666667, "x": "私が生まれた島は、黒かった。"}, {"t": 39.88333333333333, "x": "足の下は冷えて固まった溶岩だ。"}, {"t": 42.06666666666667, "x": "ところどころ割れて、割れ目から草が出ている。"}, {"t": 44.95, "x": "低いところは乾いていて登っていくと空気が湿ってくる。"}, {"t": 48.21666666666667, "x": "上のほうはよく霧がかかった。"}, {"t": 50.05, "x": "私は遅い。それを困ったと思ったことはない。"}, {"t": 52.983333333333334, "x": "島で私を追いかけてくるものは無かったし、"}, {"t": 55.46666666666667, "x": "私が追いかけるものも無かった。"}, {"t": 57.65, "x": "食べるものは向こうから動かない。"}, {"t": 59.56666666666667, "x": "サボテンの平たい葉も草も落ちた実もそこで待っている。"}, {"t": 62.6, "x": "私はそこまで歩いていけばいい。"}, {"t": 64.58333333333333, "x": "私の甲羅は前のほうが高く反っている。"}, {"t": 67.16666666666667, "x": "首を上へ伸ばせるように、そういう形になっている。"}, {"t": 70.53333333333333, "x": "首を伸ばすと背の高いサボテンの葉に届く。"}, {"t": 73.16666666666667, "x": "届かないときは届くところまで首を伸ばしたまま少し待つ。"}, {"t": 76.55, "x": "風が吹いて葉が下がることもある。"}, {"t": 78.55, "x": "下がらないこともある。そのときは別の葉を探す。"}, {"t": 81.55, "x": "乾いた時期には地面の水が消える。"}, {"t": 83.75, "x": "雨が来るまで私は動く量を減らす。"}, {"t": 86.13333333333334, "x": "甲羅の中に水を持っておける体なので、急ぐ必要が無い。"}, {"t": 90.11666666666666, "x": "雨が来ると溶岩のくぼみに水がたまる。"}, {"t": 92.55, "x": "私はそこまで行って首を沈めて長く飲む。"}, {"t": 95.16666666666667, "x": "夜は冷える。朝は日の当たる岩の上で体を温める。"}, {"t": 98.76666666666667, "x": "温まるまでは動かない。動けない、と言ったほうが近い。"}, {"t": 102.65, "x": "一日の形は、それでできていた。"}, {"t": 105.9, "x": "温まる。歩く。食べる。水を探す。日陰に入る。"}, {"t": 110.35, "x": "また冷える。眠るときは首と脚を甲羅の中へ引く。"}, {"t": 113.65, "x": "甲羅は私の家で、私の体そのものだ。"}, {"t": 116.78333333333333, "x": "そうして動かずにいると外から見た私は"}, {"t": 119.23333333333333, "x": "たぶん岩と区別がつかない。季節はあった。"}, {"t": 121.78333333333333, "x": "けれども、年というものを私は数えなかった。"}, {"t": 124.93333333333334, "x": "雨の季節には低い斜面まで緑が下りてくる。"}, {"t": 127.7, "x": "乾いた季節には、緑は霧のかかる上のほうへ退いていく。"}, {"t": 131.75, "x": "私はその緑の端を追って斜面を上ったり下りたりした。"}, {"t": 135.3, "x": "一年という言葉を知らなくても、"}, {"t": 137.23333333333332, "x": "体はその往復を覚えていた。"}, {"t": 139.56666666666666, "x": "若いころのことはぼんやりしている。"}, {"t": 141.6, "x": "同じ甲羅を遠くの斜面に見たような気がする日がある。"}, {"t": 144.7, "x": "けれどもそれが本当に見たものなのか影を見"}, {"t": 147.23333333333332, "x": "間違えたのか、今の私には確かめようがない。"}, {"t": 150.3, "x": "はっきり覚えているのは、そのあとの長い時間だ。"}, {"t": 153.43333333333334, "x": "歩いても歩いても同じ形の甲羅に出会わない。"}, {"t": 156.3, "x": "霧の中に丸いものが見えて近づくと、岩だった。"}, {"t": 159.7, "x": "水場に踏み跡があって追いかけると、"}, {"t": 161.75, "x": "それは私自身の踏み跡だった。"}, {"t": 164.08333333333334, "x": "鳴き声を上げる体ではない。"}, {"t": 165.88333333333333, "x": "呼ぶ方法を私は持っていなかった。"}, {"t": 168.11666666666667, "x": "持っていたとしても、返事をする"}, {"t": 170.25, "x": "相手がいなかったのだろう。"}, {"t": 171.6, "x": "それでも島は静かではなかった。"}, {"t": 173.56666666666666, "x": "鳥が鳴く。風が低い木を鳴らす。"}, {"t": 175.81666666666666, "x": "海の音が下のほうからずっと上がってくる。"}, {"t": 178.25, "x": "トカゲが岩の上を走る。私の周りでは、私以外のものが"}, {"t": 182.55, "x": "それぞれの速さで生きていた。"}, {"t": 184.13333333333333, "x": "海鳥が頭の上を渡っていく日もある。"}, {"t": 186.63333333333333, "x": "あの鳥たちは海の向こうから来て、"}, {"t": 188.61666666666667, "x": "海の向こうへ帰っていく。私は"}, {"t": 190.63333333333333, "x": "この島の外に何があるのかを知らなかった。"}, {"t": 193.51666666666668, "x": "島の端は海で、海は私の歩ける場所ではなかった。"}, {"t": 197.26666666666668, "x": "私の速さで生きているものだけが、いなかった。"}, {"t": 200.35, "x": "それが寂しいということなのかどうか私は知らない。"}, {"t": 203.35, "x": "比べる相手がいないと、寂しさは形にならない。"}, {"t": 206.58333333333334, "x": "私はただ歩いて食べて温まって冷えた。"}, {"t": 209.08333333333334, "x": "何十回、雨の季節が来たのだろう。"}, {"t": 211.81666666666666, "x": "ある時期から、島の景色が少しずつ変わり始めた。"}, {"t": 215.06666666666666, "x": "先に来たのは、人間ではなかった。"}, {"t": 217.5, "x": "最初は声だった。聞いたことのない短い鳴き声が"}, {"t": 220.58333333333334, "x": "低いほうの斜面から上がってきた。"}, {"t": 222.45, "x": "それから姿が見えた。四本の細い脚と跳ねるような歩き方。"}, {"t": 226.4, "x": "私よりずっと小さくてずっと速い。"}, {"t": 228.61666666666667, "x": "ヤギという名前を、私は後になって知った。"}, {"t": 231.66666666666666, "x": "はじめは数頭だった。それがいつのまにか群れになった。"}, {"t": 234.98333333333332, "x": "群れが増えて、別の群れができた。"}, {"t": 237.33333333333334, "x": "どこへ歩いてもあの鳴き声が聞こえるようになった。"}, {"t": 240.16666666666666, "x": "ヤギは何でも食べた。草を根元近くまで食べる。"}, {"t": 243.26666666666668, "x": "低い木の葉を食べる。私の首が届く高さの"}, {"t": 245.93333333333334, "x": "葉も私より先に食べ尽くしていた。"}, {"t": 248.16666666666666, "x": "落ちたサボテンの葉は私が近づく前に無くなっていた。"}, {"t": 251.31666666666666, "x": "ヤギは私を怖がらなかった。"}, {"t": 253.23333333333332, "x": "すぐそばまで来て私が首を伸ばしている葉を"}, {"t": 255.73333333333332, "x": "反対側からかじった。私が首を"}, {"t": 257.56666666666666, "x": "引っ込めても気にする様子も無かった。"}, {"t": 259.9166666666667, "x": "私は遅い。それまで一度も困ったことのなかった"}, {"t": 262.9166666666667, "x": "この遅さが、初めて意味を持った。"}, {"t": 265.1666666666667, "x": "食べるものが向こうから動かないのは、私の"}, {"t": 268.01666666666665, "x": "前にほかのものが来なければの話だったのだ。"}, {"t": 270.51666666666665, "x": "斜面の緑が下のほうから薄くなっていった。"}, {"t": 273.1333333333333, "x": "溶岩の黒が、また見えるようになった。"}, {"t": 275.76666666666665, "x": "雨が来ても前ほどには草が戻らなかった。"}, {"t": 278.3333333333333, "x": "日陰を作っていた低い木が枯れて私は日差しを"}, {"t": 281.2, "x": "避ける場所を探して歩く距離が長くなった。"}, {"t": 283.6, "x": "ヤギを恨んだことはない。ヤギもまた食べていただけだ。"}, {"t": 286.7, "x": "私と同じことを私より速くやっていただけだ。"}, {"t": 289.6166666666667, "x": "人間が来たのは、そのあとだ。"}, {"t": 291.7, "x": "その人間は地面ばかり見ていた。"}, {"t": 293.76666666666665, "x": "岩のすき間をのぞき草の根元をかき分け"}, {"t": 296.06666666666666, "x": "小さな巻いた殻を拾っては手の中で転がしていた。"}, {"t": 298.95, "x": "私のほうを探していたのではない。"}, {"t": 301.0, "x": "探していたのはもっと小さな生きものだった。"}, {"t": 303.55, "x": "その人間が顔を上げたとき、私はそこにいた。"}, {"t": 306.8833333333333, "x": "人間はしばらく動かなかった。"}, {"t": 308.81666666666666, "x": "それから手に持っていた黒い小さな箱を私に向けた。"}, {"t": 312.0, "x": "かちり、という音がした。私は"}, {"t": 314.18333333333334, "x": "首を半分だけ出して、それを見ていた。"}, {"t": 317.0, "x": "危ないものかどうか、私にはまだ分からなかった。"}, {"t": 320.15, "x": "人間は私に触れなかった。人間は"}, {"t": 322.31666666666666, "x": "それから長いあいだ私の周りを歩いて、"}, {"t": 324.9, "x": "また地面に戻りやがて去っていった。"}, {"t": 327.2, "x": "私はその日のことを特別だとは思わなかった。"}, {"t": 330.1, "x": "島に人間が来ることは、それまでにもまれにあった。"}, {"t": 333.35, "x": "来て、去る。それだけのものだった。"}, {"t": 335.9166666666667, "x": "違ったのは、次に来た人間たちだ。"}, {"t": 338.48333333333335, "x": "何人もいた。長靴の音がした。"}, {"t": 340.75, "x": "縄と太い棒と低い声の相談があった。"}, {"t": 343.3666666666667, "x": "私の甲羅に手が掛かり、体が地面から離れた。"}, {"t": 346.8833333333333, "x": "私は首を引っ込めた。引っ込めることしか"}, {"t": 349.3666666666667, "x": "私にできることは無かった。"}, {"t": 351.06666666666666, "x": "運ばれていくあいだ溶岩の黒と"}, {"t": 353.05, "x": "薄くなった緑が甲羅の下で揺れていた。"}, {"t": 355.3, "x": "海の音が近づいた。波の上で体が上下した。"}, {"t": 358.53333333333336, "x": "振り向くことはできない。私の"}, {"t": 360.28333333333336, "x": "首はそういうふうには曲がらない。"}, {"t": 362.26666666666665, "x": "だから私は、島が小さくなっていくところを見ていない。"}, {"t": 365.78333333333336, "x": "私が見ていたのは、甲羅の縁の"}, {"t": 368.03333333333336, "x": "向こうの空と、それを横切る鳥だけだった。"}, {"t": 370.8333333333333, "x": "恨んではいない。あの人間たちが"}, {"t": 372.8, "x": "私をどこへ運ぼうとしているのかを、"}, {"t": 375.01666666666665, "x": "私は知らなかった。知らないものを恨むことはできない。"}, {"t": 378.65, "x": "ただあの島の霧の匂いを私はそれから一度も嗅いでいない。"}, {"t": 382.2, "x": "ジョージが生まれるより前に、"}, {"t": 383.75, "x": "島で起きることの大半はもう終わっていた。"}, {"t": 386.78333333333336, "x": "ガラパゴス諸島のゾウガメは"}, {"t": 388.45, "x": "島ごとに甲羅の形も体の大きさも違う。"}, {"t": 391.3833333333333, "x": "ピンタ島のゾウガメは一八七七年、動物学者"}, {"t": 395.68333333333334, "x": "アルバート・ギュンターによって記載された。"}, {"t": 397.85, "x": "学名はケロノイディス・アビングドニ。"}, {"t": 400.0, "x": "種名のアビングドニは、ピンタ島の古い"}, {"t": 402.8, "x": "英語名アビングドン島から取られている。"}, {"t": 405.1333333333333, "x": "ジョージの甲羅は前の縁が鞍のように"}, {"t": 407.46666666666664, "x": "高く反り上がった形をしていた。"}, {"t": 409.45, "x": "首を高く伸ばし背の高い植物の"}, {"t": 411.56666666666666, "x": "葉に届かせることのできる体の形である。"}, {"t": 414.1166666666667, "x": "十九世紀、この諸島は捕鯨船の補給地だった。"}, {"t": 417.8666666666667, "x": "太平洋でクジラを追う船は何か月、ときに"}, {"t": 421.1666666666667, "x": "何年も港に戻らない。新鮮な肉が要る。"}, {"t": 424.15, "x": "ゾウガメはそのための理想的な食料と見なされた。"}, {"t": 427.3, "x": "生きたまま船に積んでおける。"}, {"t": 429.15, "x": "何か月も死なない。必要なときに一頭ずつ食べればいい。"}, {"t": 432.9, "x": "一九二五年動物学者チャールズ・"}, {"t": 435.5833333333333, "x": "ハスキンス・タウンゼンドは捕鯨船の古い"}, {"t": 437.8833333333333, "x": "航海日誌を読み込んで一本の論文にまとめた。"}, {"t": 440.93333333333334, "x": "七十九隻分の日誌を調べたところ一八三一年から"}, {"t": 445.15, "x": "一八六八年までのあいだにこれらの船だけで"}, {"t": 448.4, "x": "一万三千頭を超えるゾウガメが諸島から運び出されていた。"}, {"t": 452.0833333333333, "x": "日誌が残っている船だけで、この数である。"}, {"t": 455.2, "x": "日誌が失われた船や記録をつけなかった"}, {"t": 457.8833333333333, "x": "船の分は含まれていない。タウンゼンド自身実際に"}, {"t": 461.06666666666666, "x": "持ち去られた数はこれよりかなり多かったはずだと"}, {"t": 464.03333333333336, "x": "考えていた。十七世紀から十九世紀までに"}, {"t": 466.8666666666667, "x": "諸島全体で持ち去られたゾウガメは、"}, {"t": 469.4166666666667, "x": "およそ二十万頭と推定されている。"}, {"t": 471.81666666666666, "x": "ピンタ島のゾウガメについてガラパゴス保護協会は"}, {"t": 474.9, "x": "十九世紀に捕鯨船やオットセイ猟の船などに"}, {"t": 477.96666666666664, "x": "よって獲り尽くされた、と記している。"}, {"t": 480.28333333333336, "x": "ここで一つ押さえておくことがある。"}, {"t": 482.43333333333334, "x": "この一万三千という数は、獲っていた当時に"}, {"t": 485.68333333333334, "x": "誰かが数えたものではない。"}, {"t": 487.3, "x": "船乗りたちはその日に何頭積んだかを"}, {"t": 489.65, "x": "業務の記録として書いただけだ。"}, {"t": 491.48333333333335, "x": "それを合計して何が起きていたのかを数字にしたのは、"}, {"t": 494.68333333333334, "x": "最後の記録から半世紀以上たってからのことだった。"}, {"t": 498.28333333333336, "x": "獲っている最中に全体を数えている者はいなかった。"}, {"t": 501.6166666666667, "x": "数える仕組みも数えた結果を受け取って"}, {"t": 504.06666666666666, "x": "止める仕組みも、そこには無かった。"}, {"t": 506.31666666666666, "x": "二十世紀に入るころ、ピンタ島のゾウガメは"}, {"t": 509.43333333333334, "x": "もう、ほとんど残っていなかった。"}, {"t": 511.65, "x": "一九五九年、エクアドルはガラパゴス諸島を"}, {"t": 515.6166666666667, "x": "国立公園に定めた。同じ一九五九年、"}, {"t": 518.8, "x": "ピンタ島に漁師が三頭のヤギを"}, {"t": 521.4333333333333, "x": "放したと、ガラパゴス保護協会は記録している。"}, {"t": 524.75, "x": "資料によっては一九五八年とするものもある。"}, {"t": 528.3666666666667, "x": "ピンタ島の面積は、およそ六十平方キロメートルである。"}, {"t": 532.4666666666667, "x": "ヤギには天敵がいなかった。"}, {"t": 534.3833333333333, "x": "一九七〇年には、島のヤギはおよそ四万頭と"}, {"t": 538.4666666666667, "x": "推定されるまでに増えていた。"}, {"t": 540.3, "x": "草も低木も食べ尽くされ残っていたゾウガメの"}, {"t": 543.15, "x": "食べものと日陰が、島から消えていった。"}, {"t": 545.8833333333333, "x": "一九七一年、ハンガリーの貝類学者"}, {"t": 549.5333333333333, "x": "ヨージェフ・ヴァーグヴェルジが"}, {"t": 550.8666666666667, "x": "カタツムリを調べるためにピンタ島に入った。"}, {"t": 553.4833333333333, "x": "彼はそこで一頭のゾウガメを見た。"}, {"t": 555.75, "x": "翌一九七二年、国立公園のレンジャーたちが"}, {"t": 559.7666666666667, "x": "このゾウガメを島から運び出し、"}, {"t": 561.6833333333333, "x": "サンタクルス島の飼育施設に移した。"}, {"t": 564.4166666666666, "x": "保護のためである。同じ種のメスを探す試みは続いた。"}, {"t": 568.1666666666666, "x": "見つけた者には一万ドルを払うという懸賞も出された。"}, {"t": 571.65, "x": "応じる者は現れなかった。サンタクルス島では、ジョージに"}, {"t": 575.6666666666666, "x": "子を残させる試みも続けられた。"}, {"t": 577.8666666666667, "x": "一九九二年からはイサベラ島ウォルフ火山から"}, {"t": 581.3333333333334, "x": "連れてこられた近縁のメス二頭が同じ囲いで暮らした。"}, {"t": 584.55, "x": "二〇〇八年と二〇〇九年には"}, {"t": 586.5, "x": "メスが卵を産み、卵は保育器に移された。"}, {"t": 589.8666666666667, "x": "しかしどの卵も孵らなかった。"}, {"t": 591.9833333333333, "x": "人工授精も試みられたが、成功していない。"}, {"t": 595.4, "x": "二〇一一年には、エスパニョラ島の"}, {"t": 598.2, "x": "系統のメス二頭が新たに加えられた。"}, {"t": 600.6666666666666, "x": "ピンタ島のヤギを取り除く作業は長くかかった。"}, {"t": 603.7333333333333, "x": "島にヤギがいなくなったと宣言されたのは"}, {"t": 606.3333333333334, "x": "二〇〇三年である。一九九九年に"}, {"t": 608.9, "x": "根絶が達成されたとする資料もあり、"}, {"t": 611.8166666666667, "x": "どの時点を完了とみなすかで年が分かれている。"}, {"t": 615.2, "x": "いずれにしてもジョージが島を"}, {"t": 616.7833333333333, "x": "離れてから三十年近   d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
