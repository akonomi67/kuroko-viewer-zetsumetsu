, {"t": 1057.2333333333333, "i": 373}, {"t": 1060.6333333333334, "i": 374}, {"t": 1063.3666666666666, "i": 375}, {"t": 1066.9, "i": 376}, {"t": 1070.8666666666666, "i": 377}, {"t": 1074.5833333333333, "i": 378}, {"t": 1077.85, "i": 379}, {"t": 1080.0333333333333, "i": 380}, {"t": 1082.7166666666667, "i": 381}, {"t": 1085.85, "i": 382}, {"t": 1087.35, "i": 382}], "subs": [{"t": 0.0, "x": "水が冷たい。前脚で水を掻く。"}, {"t": 2.35, "x": "尾で向きを決める。流れに逆らって上へ上へと泳ぐ。"}, {"t": 5.6, "x": "秋の水は重い。流れは細く、音は低い。"}, {"t": 8.933333333333334, "x": "掻いても掻いても、体が前に出ていかない。"}, {"t": 11.916666666666666, "x": "私はこの川で生きてきた。人間は私をたくさん見た。"}, {"t": 15.533333333333333, "x": "泳ぐところを見て、魚を噛むところを見た。"}, {"t": 18.483333333333334, "x": "黒い筒を向け、紙に書き、何度も数えた。"}, {"t": 21.983333333333334, "x": "私の体のほうは、この冷たい水の中で先に終わる。"}, {"t": 25.7, "x": "けれども紙の上の私は、そこから"}, {"t": 28.133333333333333, "x": "まだ長いあいだ生き続けた。"}, {"t": 29.7, "x": "人間がその紙を書き直して、"}, {"t": 31.516666666666666, "x": "もういないと記すまで、ずっと。"}, {"t": 33.9, "x": "そのあいだ、私の川は何も言わなかった。"}, {"t": 36.86666666666667, "x": "石の下を流れて、堰を越えて、海へ出ていくだけだった。"}, {"t": 40.93333333333333, "x": "私の世界は一本の川だった。"}, {"t": 43.06666666666667, "x": "山のほうから下りてきて田んぼのあいだを"}, {"t": 45.2, "x": "抜け、町を抜けて海に出る川だ。"}, {"t": 47.53333333333333, "x": "上のほうは狭くて速い。岩が多く、水は白く割れて落ちる。"}, {"t": 51.833333333333336, "x": "下のほうは広くてゆっくりしている。"}, {"t": 53.983333333333334, "x": "最後は塩の味が混ざって、そのまま海になる。"}, {"t": 57.18333333333333, "x": "私はその全部を使っていた。"}, {"t": 59.11666666666667, "x": "一晩のうちに淵から淵へ渡り、"}, {"t": 61.1, "x": "堰を越えてずいぶん遠くまで行く。"}, {"t": 63.6, "x": "川は私にとって道であり、食べる"}, {"t": 66.18333333333334, "x": "場所であり、眠る場所だった。"}, {"t": 68.15, "x": "眠るのは岸の穴だ。大きな木の根が水際に張り出していて、"}, {"t": 71.78333333333333, "x": "その下に暗い隙間がある。岩が"}, {"t": 73.73333333333333, "x": "割れて重なったところにもう一つ。"}, {"t": 75.95, "x": "草が深く茂った岸にもう一つ。"}, {"t": 78.03333333333333, "x": "私は日によって眠る場所を変えた。"}, {"t": 80.21666666666667, "x": "穴の中は乾いていて、外の音が遠い。"}, {"t": 83.15, "x": "濡れた体を丸めて目を閉じると、流れの"}, {"t": 85.83333333333333, "x": "音だけが低く届く。どの穴も水から遠くない。"}, {"t": 88.95, "x": "這い出せば、すぐそこが流れだった。"}, {"t": 91.31666666666666, "x": "空が暗くなりはじめると私は目を開ける。"}, {"t": 93.91666666666667, "x": "穴の口から顔を出し、水のにおいを"}, {"t": 96.43333333333334, "x": "確かめてから、また流れに入っていく。"}, {"t": 98.93333333333334, "x": "私の体は水のために作られている。頭は平たい。"}, {"t": 102.48333333333333, "x": "胴は細長い。脚は短くて指のあいだに水かきがある。"}, {"t": 106.1, "x": "尾は太くて長く、泳ぐときには舵になる。"}, {"t": 109.05, "x": "毛は細かく詰まっていて水を弾く。"}, {"t": 111.08333333333333, "x": "潜っても体の芯までは冷えない。耳は小さい。"}, {"t": 114.35, "x": "尾は付け根がいちばん太く、胴からそのまま続いている。"}, {"t": 117.88333333333334, "x": "食べるのはほとんどが水の中のものだ。"}, {"t": 120.11666666666666, "x": "石の下にいるカニ。岸の草の根元にいるエビ。"}, {"t": 123.08333333333333, "x": "流れのゆるいところで休んでいる魚。"}, {"t": 125.4, "x": "カニがいちばん確かだった。"}, {"t": 126.95, "x": "石をどければそこにいる。逃げ足は遅い。"}, {"t": 129.56666666666666, "x": "殻は硬いが噛めば割れる。魚は日によった。"}, {"t": 132.48333333333332, "x": "流れの陰で止まっている魚は捕れる。"}, {"t": 134.78333333333333, "x": "弱っている魚も捕れる。けれども鮎は駄目だった。"}, {"t": 137.91666666666666, "x": "あれは速すぎる。私が向きを"}, {"t": 139.65, "x": "変えるより先に鮎はもうそこにいない。"}, {"t": 142.05, "x": "何度追ってもほとんど口に入らなかった。"}, {"t": 144.41666666666666, "x": "私はよく食べた。暗いうちに食べて明け方に穴へ戻る。"}, {"t": 148.01666666666668, "x": "目が覚めたらまた食べる。私の"}, {"t": 149.76666666666668, "x": "一日はほとんどそれだけでできていた。"}, {"t": 152.0, "x": "食べたあとには岩の上に糞を残して歩いた。"}, {"t": 154.73333333333332, "x": "流れの中の大きな石の上。堰の角。岸の目立つところ。"}, {"t": 158.6, "x": "自分がどこを通ったのかはそれで分かる。"}, {"t": 160.98333333333332, "x": "残していくのは糞だけではなかった。"}, {"t": 163.05, "x": "岸の泥には足跡が並ぶ。指のあいだの"}, {"t": 165.65, "x": "水かきの跡まで、泥にはっきり写る。"}, {"t": 168.26666666666668, "x": "平たい石の上には食べ残しを置いていった。"}, {"t": 170.88333333333333, "x": "割れたカニの殻。骨の見える魚の頭。"}, {"t": 173.61666666666667, "x": "一つの寝床から次の寝床までのあいだに、"}, {"t": 176.08333333333334, "x": "そういう跡がいくつも落ちている。"}, {"t": 178.25, "x": "この川の上から下までが私の場所だった。"}, {"t": 180.9, "x": "どこへ行っても、少し前の自分のにおいがした。"}, {"t": 184.03333333333333, "x": "そのにおいを辿れば、夜の川で迷うことはなかった。"}, {"t": 187.51666666666668, "x": "雨が跡を流してしまっても、次の夜には"}, {"t": 190.43333333333334, "x": "また同じ石の上に新しい跡が増えていた。"}, {"t": 193.1, "x": "水の中の音もよく知っていた。瀬は高い音で鳴る。"}, {"t": 196.35, "x": "水面が細かく砕けて、月の光もいっしょに砕ける。"}, {"t": 199.91666666666666, "x": "淵はほとんど鳴らない。堰の下では水が"}, {"t": 202.41666666666666, "x": "絶えず落ちて、底のほうで低く唸っている。"}, {"t": 205.2, "x": "目を閉じていても、その音の並びで"}, {"t": 207.55, "x": "自分が川のどこにいるのかが分かった。"}, {"t": 209.68333333333334, "x": "以前はほかにもいた。岸の泥に"}, {"t": 211.51666666666668, "x": "自分のものではない足跡を見たことがある。"}, {"t": 214.11666666666667, "x": "水の中で自分のものではないにおいを"}, {"t": 216.2, "x": "嗅いだことがある。ずっと前のことだ。"}, {"t": 218.4, "x": "今はもうそういうものにはほとんど行き当たらない。"}, {"t": 221.11666666666667, "x": "川の形も少しずつ変わっていった。"}, {"t": 223.35, "x": "岸の土がある年から灰色の固い壁になった。"}, {"t": 226.3, "x": "つるりとしていて爪がかからない。"}, {"t": 228.11666666666667, "x": "穴を掘ることもできない。壁の下には草も生えない。"}, {"t": 231.28333333333333, "x": "草がなければその根元にエビはいない。水の量も変わった。"}, {"t": 234.85, "x": "夏になると川から田んぼへ水が引かれていく。"}, {"t": 237.58333333333334, "x": "水の減った淵では魚の影が薄くなった。"}, {"t": 240.16666666666666, "x": "海へ出る道も変わった。以前は"}, {"t": 242.15, "x": "川口から岸づたいに海辺の岩場まで行けた。"}, {"t": 244.96666666666667, "x": "今はそのあいだを人間の道が横切っている。"}, {"t": 247.7, "x": "硬くて乾いていて、ときどき"}, {"t": 249.8, "x": "大きなものが唸りを上げて走る。"}, {"t": 251.63333333333333, "x": "私はそこを渡るのが嫌いだった。"}, {"t": 253.71666666666667, "x": "それでも川はまだ川だった。"}, {"t": 255.51666666666668, "x": "水は流れていて、石の下には"}, {"t": 257.4166666666667, "x": "カニがいた。私にはそれで足りていた。"}, {"t": 260.06666666666666, "x": "足りないと思ったことは、少なくとも"}, {"t": 262.3833333333333, "x": "私の覚えている限りでは一度も無い。"}, {"t": 264.7, "x": "人間ははじめから川のそばにいた。"}, {"t": 266.85, "x": "岸に家がある。田んぼがある。"}, {"t": 268.76666666666665, "x": "橋が架かっている。朝になると"}, {"t": 270.8333333333333, "x": "人間が川に来る。網を打つ者。"}, {"t": 272.8833333333333, "x": "竿を出す者。ただ水を眺めている者。"}, {"t": 275.55, "x": "私は明るいあいだは穴にいて、"}, {"t": 277.46666666666664, "x": "人間の立てる音を聞きながら眠っていた。"}, {"t": 280.1333333333333, "x": "人間が川に来るのは珍しいことではない。"}, {"t": 282.81666666666666, "x": "珍しかったのは、人間が私を見に来るようになったことだ。"}, {"t": 286.6166666666667, "x": "ある春から私は明るいうちにも水に出るようになった。"}, {"t": 289.8666666666667, "x": "理由は自分でもよく分からない。"}, {"t": 291.81666666666666, "x": "腹が減っていたのかもしれない。"}, {"t": 293.5833333333333, "x": "最初に私を見た人間は声を上げた。"}, {"t": 296.1166666666667, "x": "次の日には同じ岸に何人も立っていた。"}, {"t": 298.71666666666664, "x": "その次の日には黒い筒をこちらへ"}, {"t": 300.81666666666666, "x": "向ける人間が混ざっていた。"}, {"t": 302.3833333333333, "x": "私が水面に頭を出すたびに筒は小さな音を立てた。"}, {"t": 305.8333333333333, "x": "私は気にしなかった。筒は噛みついてこない。"}, {"t": 308.71666666666664, "x": "音を立てるだけだ。その音は、乾いた小枝を"}, {"t": 311.5, "x": "踏んだときの音に少し似ていた。"}, {"t": 313.5833333333333, "x": "岸に立つ人間たちは、私が潜ると静かになった。"}, {"t": 317.1166666666667, "x": "私が浮かぶとまた声が上がった。"}, {"t": 319.18333333333334, "x": "私が水から頭を出すか出さないかで、岸の音が変わる。"}, {"t": 322.96666666666664, "x": "そういうことは、それまで一度も無かった。"}, {"t": 325.5833333333333, "x": "人間が私を見て黙る。私が動くと人間が騒ぐ。"}, {"t": 329.21666666666664, "x": "川の中で私のほうが人間を動かしているようで、"}, {"t": 332.35, "x": "少し奇妙だった。夏になると川の下のほうに人間の"}, {"t": 335.8833333333333, "x": "子どもが集まるようになった。"}, {"t": 337.4166666666667, "x": "水に飛び込んで声を上げて、跳ねてはまた沈む。"}, {"t": 340.6, "x": "そのあたりは夏じゅう騒がしかった。"}, {"t": 342.6666666666667, "x": "私は上のほうへ行くことが増えた。"}, {"t": 344.85, "x": "上には人間が少ない。けれどもときどきは下にも行った。"}, {"t": 348.3, "x": "子どもたちのいる水に自分から近づいたこともある。"}, {"t": 351.18333333333334, "x": "なぜ近づいたのかはうまく言えない。"}, {"t": 353.25, "x": "怖くはなかった。人間の手から鮎をもらったことがある。"}, {"t": 356.6, "x": "自分では捕れないあの速い鮎だ。"}, {"t": 358.6333333333333, "x": "釣りをしていた人間が岸に投げ捨てた"}, {"t": 360.71666666666664, "x": "魚を拾って食べたこともある。"}, {"t": 362.51666666666665, "x": "人間のそばには食べるものがあった。"}, {"t": 364.6, "x": "私にとって人間はそういうものになっていた。"}, {"t": 367.3333333333333, "x": "泳いでいる子どもの一人に水の中で近づいた。"}, {"t": 370.1, "x": "その子は声を上げて岸へ逃げた。"}, {"t": 372.15, "x": "私はしばらくその場で浮いていた。"}, {"t": 374.1666666666667, "x": "別の日、私は人間の手に捕まった。"}, {"t": 377.03333333333336, "x": "地面に下ろされて胴に縄をかけられた。"}, {"t": 379.3666666666667, "x": "縄の端を人間が持って歩く。"}, {"t": 381.43333333333334, "x": "私は引かれるままに歩いた。"}, {"t": 383.25, "x": "しばらくして通りかかった別の人間が強い声で何か言った。"}, {"t": 386.85, "x": "縄が解かれ、私は水に戻った。"}, {"t": 389.45, "x": "そのころから首に何かが巻きついていた。"}, {"t": 391.8, "x": "細い紐だった。いつどこで引っかけたのかは覚えていない。"}, {"t": 395.18333333333334, "x": "泳ぐたびに水の中で紐の端が揺れた。"}, {"t": 397.6666666666667, "x": "首を振っても外れない。前脚で掻いても外れない。"}, {"t": 400.81666666666666, "x": "飲み込むときに喉のところで少しだけ邪魔をした。"}, {"t": 403.55, "x": "何日かたって、橋の下で私はまた人間の手に押さえられた。"}, {"t": 407.6333333333333, "x": "手が私の首に触れた。指が紐の結び目を探っていた。"}, {"t": 411.31666666666666, "x": "私は暴れなかった。暴れる理由が"}, {"t": 413.3666666666667, "x": "そのときの私には見当たらなかった。"}, {"t": 415.7, "x": "そして紐が外れた。首が軽くなった。"}, {"t": 418.18333333333334, "x": "私はそのまま水に戻された。"}, {"t": 420.18333333333334, "x": "首に紐が絡んだことも、胴に縄をかけられたことも、"}, {"t": 423.51666666666665, "x": "紐が外されたことも、鮎をもらったことも、"}, {"t": 426.65, "x": "全部この川のそばで起きた。"}, {"t": 428.65, "x": "どの手が誰の手だったのかを私は区別できない。"}, {"t": 431.48333333333335, "x": "区別しようと思ったこともない。"}, {"t": 433.3, "x": "夏の終わりが近づくと川の下のほうは静かになった。"}, {"t": 436.48333333333335, "x": "子どもの声が減った。岸に並ぶ人間も減った。"}, {"t": 439.46666666666664, "x": "黒い筒の音も減った。私はまた上へ向かって泳ぎはじめた。"}, {"t": 443.35, "x": "ニホンカワウソは明治の頃まで北海道から九州まで、"}, {"t": 446.9166666666667, "x": "日本の広い範囲の川と海岸に暮らしていた。"}, {"t": 450.18333333333334, "x": "人間がこの動物を捕る理由は古くからあった。"}, {"t": 453.4, "x": "平安時代から肝臓が漢方の薬として使われてきた。"}, {"t": 457.06666666666666, "x": "その需要は明治以降も続いた。"}, {"t": 459.3666666666667, "x": "明治に入って狩猟が広く行われるようになると、"}, {"t": 462.45, "x": "そこに毛皮が加わる。密に生えた毛は"}, {"t": 465.3333333333333, "x": "水を弾き、体の熱を逃がさない。"}, {"t": 467.8833333333333, "x": "明治の初めから昭和の初めにかけて、"}, {"t": 470.3833333333333, "x": "防寒のための毛皮として軍の需要が高まった。"}, {"t": 473.8, "x": "ニホンカワウソは大量に捕られた。"}, {"t": 475.96666666666664, "x": "この動物は増えるのが遅い。"}, {"t": 477.95, "x": "年に一度だけ繁殖し、一度に産む子は一頭か二頭とされる。"}, {"t": 482.5, "x": "捕られた数を、生まれる数で取り戻すことはできなかった。"}, {"t": 486.21666666666664, "x": "一九二八年、カワウソは捕獲を禁じられた獣に指定される。"}, {"t": 491.3666666666667, "x": "だがその後も密猟は続き、数は減り続けた。"}, {"t": 494.85, "x": "一九五〇年代には北海道でも本州でも"}, {"t": 498.2, "x": "ほとんど見られなくなり、残っていたのは主に四国だった。"}, {"t": 501.8, "x": "戦後、変化は動物ではなく川のほうに起きた。"}, {"t": 505.35, "x": "一九五〇年代からの高度経済成長の時代である。"}, {"t": 509.3, "x": "農業のために川から水が引かれ、川は改修された。"}, {"t": 513.3666666666667, "x": "餌になる魚が減った。海岸沿いには道路が造られ、海と川を"}, {"t": 518.2666666666667, "x": "行き来するこの動物の通り道が断たれた。"}, {"t": 520.8, "x": "コンクリートの護岸が岸の土を覆った。"}, {"t": 523.3666666666667, "x": "ナイロン製の漁網に絡まって死ぬ事故が起きた。"}, {"t": 526.3333333333334, "x": "水の汚れがそこに重なった。"}, {"t": 528.3166666666667, "x": "四国ではこうした変化がニホンカワウソの"}, {"t": 530.8166666666667, "x": "減少の一因になったと考えられている。"}, {"t": 533.3333333333334, "x": "高知県の教育委員会は、この動物が"}, {"t": 536.4833333333333, "x": "減った理由を二つにまとめている。"}, {"t": 538.4166666666666, "x": "自然環境の破壊と、毛皮を目当てにした乱獲である。"}, {"t": 542.4, "x": "捕ることと、住む場所を変えること。"}, {"t": 544.7166666666667, "x": "その二つが、時代をずらしながら重なった。"}, {"t": 547.8833333333333, "x": "保護の仕組みはこの間に整えられていった。"}, {"t": 550.6666666666666, "x": "一九六四年六月二十七日、カワウソは"}, {"t": 554.7166666666667, "x": "国の天然記念物に指定された。"}, {"t": 556.8666666666667, "x": "同じ年に愛媛県はこの動物を県の獣に選んでいる。"}, {"t": 560.6333333333333, "x": "翌一九六五年五月十二日には特別天然記念物になった。"}, {"t": 565.5666666666667, "x": "指定の理由を記した文章にはこう書かれている。"}, {"t": 568.6666666666666, "x": "もとは国内の各地に多く生息していたが、現在その数は"}, {"t": 572.95, "x": "きわめて少なく、学術的な価値はきわめて高い。"}, {"t": 576.4166666666666, "x": "守ると決めた時点で、すでに残りは少なかった。"}, {"t": 579.85, "x": "この指定は地域を定めない形で行われた。"}, {"t": 582.9333333333333, "x": "特定の川や海岸を守るのではなく、"}, {"t": 585.5166666666667, "x": "動物そのものを保存の対象にしたのである。"}, {"t": 588.5333333333333, "x": "一方で川の改修も海沿いの道路づくりも、"}, {"t": 591.3666666666667, "x": "同じ時代に続いていた。特別天然記念物になった"}, {"t": 595.6833333333333, "x": "年の暮れ、一九六五年十二月。"}, {"t": 598.4333333333333, "x": "動物写真家の田中光常が愛媛県でこの動物を撮影している。"}, {"t": 602.8166666666667, "x": "彼が撮ることのできたニホンカワウソは、"}, {"t": 605.1166666666667, "x": "この一回きりだった。指定から"}, {"t": 607.6833333333333, "x": "十年がたった一九七五年四月六日の"}, {"t": 610.6, "x": "朝、愛媛県宇和島市の九島。"}, {"t": 613.0833333333334, "x": "畑の作業場へ向かった男性と"}, {"t": 615.2166666666667, "x": "義理の弟が見慣れない動物に出会った。"}, {"t": 617.65, "x": "二人はそれをかごで捕まえた。"}, {"t": 619.65, "x": "アジを与えるとよく食べた。"}, {"t": 621.3833333333333, "x": "二〇二五年、九十歳になったその男性は"}, {"t": 624.8, "x": "取材に対して当時をこう振り返っている。"}, {"t": 627.3166666666667, "x": "畑の作業場に行ったら、変なものが通りよった。"}, {"t": 630.8833333333333, "x": "県の教育事務所に連絡すると、天然記念物だから"}, {"t": 634.8, "x": "すぐに逃がしなさいと告げられた。"}, {"t": 636.5833333333334, "x": "かごのところへ戻ると、その動物はすでに死んでいた。"}, {"t": 640.2666666666667, "x": "この一頭が愛媛県内で最後に"}, {"t": 642.3666666666667, "x": "捕獲されたニホンカワウソになった。"}, {"t": 644.3666666666667, "x": "剥製は今も県の博物館に残っている。"}, {"t": 647.2, "x": "同じ頃、高知県須崎市の新荘川でも記録が続いていた。"}, {"t": 651.5333333333333, "x": "一九七四年七月二十五日、新荘川で見"}, {"t": 655.7666666666667, "x": "慣れない動物が一頭見つかった。"}, {"t": 657.75, "x": "それがニホンカワウソだと確認されると"}, {"t": 660.1166666666667, "x": "全国の話題になった。同じ月の"}, {"t": 662.15, "x": "二十九日には鮎漁をしていた父と子が"}, {"t": 664.6166666666667, "x": "一頭を捕まえ、放す前に鮎を十尾与えている。"}, {"t": 668.1666666666666, "x": "この年に新荘川で捕まった個体は"}, {"t": 670.55, "x": "雌だったと記録されている。"}, {"t": 672.15, "x": "須崎では住民が集まって、新荘川の"}, {"t": 675.2833333333333, "x": "自然とカワウソを守る会を作った。"}, {"t": 677.6166666666667, "x": "翌一九七五年九月五日の深夜には、"}, {"t": 680.8166666666667, "x": "雄の一頭が川の近くにあるセメント工場の"}, {"t": 684.1333333333333, "x": "食堂に入り込み、そのあと放された。"}, {"t": 686.8833333333333, "x": "雌と雄が同じ川の周りにいたことになる。"}, {"t": 689.6, "x": "子が生まれていた可能性もあると後の研究者は書いている。"}, {"t": 693.2166666666667, "x": "一九七〇年代の新荘川では、夏になると"}, {"t": 696.7166666666667, "x": "下流に子どもたちの水泳場が設けられていた。"}, {"t": 699.5666666666667, "x": "川は人間の遊び場でもあった。"}, {"t": 701.7833333333333, "x": "そして一九七六年から一九七八年までの三年間、"}, {"t": 706.65, "x": "新荘川の周辺ではこの動物が生きていることを"}, {"t": 710.2833333333333, "x": "示す情報が一つも残っていない。"}, {"t": 712.4, "x": "次に姿が見られたのは一九七九年の三月である。"}, {"t": 716.6, "x": "秋の水は夏の水とにおいが違う。"}, {"t": 718.9, "x": "草が枯れはじめるにおいが混ざる。"}, {"t": 720.8333333333334, "x": "落ちた葉が淵の底に沈んで、水の色が少し濃くなる。"}, {"t": 724.3166666666667, "x": "朝の川面からは白い湯気のようなものが上がる。"}, {"t": 727.1166666666667, "x": "夏のあいだ下の水で騒いでいた子どもの"}, {"t": 729.4666666666667, "x": "声は、もう聞こえなかった。"}, {"t": 731.2, "x": "岸に並んでいた人間の姿もほとんど無くなった。"}, {"t": 734.1833333333333, "x": "黒い筒を持った人間はいつのまにか来なくなっていた。"}, {"t": 737.2666666666667, "x": "私はまた暗いうちにだけ水に出るようになった。"}, {"t": 740.0666666666667, "x": "首は軽いままだった。紐の跡がしばらく痒かった。"}, {"t": 743.3166666666667, "x": "岩に首をこすりつけると少しおさまった。"}, {"t": 745.8166666666667, "x": "紐を外された橋の下を、一度だけ通った。"}, {"t": 749.0, "x": "橋の上にはもう誰も立っていなかった。"}, {"t": 751.3166666666667, "x": "橋の脚に水が当たって、いつもと同 const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';

D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}

const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
