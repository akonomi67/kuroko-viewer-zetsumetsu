371}, {"t": 1068.45, "i": 371}], "subs": [{"t": 0.0, "x": "藁の匂いが、いつもより遠い。"}, {"t": 2.283333333333333, "x": "私は厩舎の床に脚を折って伏せている。"}, {"t": 4.9, "x": "立とうとして、やめた。首を曲げると自分の体が見える。"}, {"t": 8.783333333333333, "x": "首から肩にかけては濃い縞だ。"}, {"t": 10.75, "x": "肩を過ぎると縞は薄くなって、腰の手前で消える。"}, {"t": 14.2, "x": "そこから後ろは乾いた土の色をしている。"}, {"t": 16.733333333333334, "x": "縞が途中で終わっている。私は最初からそういう体だった。"}, {"t": 20.65, "x": "扉の向こうで人間の声がする。"}, {"t": 22.766666666666666, "x": "私を呼ぶときの音だ。クアッガ。"}, {"t": 25.433333333333334, "x": "私が鳴くと、人間はよく同じ音をまねた。"}, {"t": 28.666666666666668, "x": "それが私の呼び名になったのだと思う。"}, {"t": 30.983333333333334, "x": "その音に、私はもう首を上げなかった。"}, {"t": 33.81666666666667, "x": "私が目を閉じれば、その音で"}, {"t": 35.96666666666667, "x": "呼べる生き物は地上に一頭もいなくなる。"}, {"t": 38.333333333333336, "x": "そのことを知っている者は、"}, {"t": 39.81666666666667, "x": "扉の向こうにも一人もいなかった。"}, {"t": 42.11666666666667, "x": "私が生きていた世界は、雨の多い土地だった。"}, {"t": 45.25, "x": "ここでは空がいつも低い。灰色の"}, {"t": 47.35, "x": "雲が屋根のすぐ上を流れていく。"}, {"t": 49.45, "x": "雨は細く、長く降る。土は乾ききる前にまた濡れる。"}, {"t": 53.36666666666667, "x": "私の蹄はこういう土のためにできていない。"}, {"t": 56.15, "x": "それはここに来てから知った。"}, {"t": 57.8, "x": "濡れた地面は、踏むと蹄の下で少し沈む。"}, {"t": 60.86666666666667, "x": "冬になると同じ地面が固く凍って、今度は滑る。"}, {"t": 64.38333333333334, "x": "厩舎の中には藁が敷いてある。"}, {"t": 66.3, "x": "毎朝、人間が古い藁をかき出して新しい藁を入れていく。"}, {"t": 70.31666666666666, "x": "乾いた草の束も運ばれてくる。"}, {"t": 72.35, "x": "私は一日の多くを、その草を噛んで過ごした。"}, {"t": 75.65, "x": "世話をする人間は、決まった頃合いに来た。"}, {"t": 78.51666666666667, "x": "器の水を替え、草を置き、最後に私の首に手を置く。"}, {"t": 83.08333333333333, "x": "私はその手を嫌がらなかった。"}, {"t": 85.01666666666667, "x": "手は温かかった。それ以上のことは分からない。"}, {"t": 87.91666666666667, "x": "厩舎の外に、柵で囲まれた土の庭がある。"}, {"t": 91.05, "x": "晴れた日には、そこへ出される。"}, {"t": 93.06666666666666, "x": "私は柵に沿って歩く。一周すると、また同じところを歩く。"}, {"t": 97.5, "x": "庭の土には私の蹄の跡がいつも同じ線を描いた。"}, {"t": 101.06666666666666, "x": "柵の内側を回る、細長い輪の線だ。"}, {"t": 103.98333333333333, "x": "雨が降るとその線に水がたまる。"}, {"t": 106.03333333333333, "x": "晴れるとまた線に戻る。私はその線の上を歩いて、自分が"}, {"t": 110.18333333333334, "x": "ここにいることを確かめていた。"}, {"t": 111.81666666666666, "x": "夜の厩舎は暗い。扉の下のすき間から、外の冷えた"}, {"t": 115.5, "x": "空気が床を這って入ってくる。"}, {"t": 117.21666666666667, "x": "私は立ったまま眠ることもあれば、"}, {"t": 119.26666666666667, "x": "藁に脚を折って眠ることもあった。"}, {"t": 121.63333333333334, "x": "どちらの夜も、目が覚めると同じ壁が同じ場所にあった。"}, {"t": 125.31666666666666, "x": "私はそれを見て、今日もここだと知った。"}, {"t": 128.05, "x": "庭からは、いろいろな音が聞こえる。"}, {"t": 130.5, "x": "石の上を転がる車輪の音。遠くで打たれる鐘。"}, {"t": 133.68333333333334, "x": "別の囲いにいる獣たちの声。"}, {"t": 135.75, "x": "ここは人間の街のまん中にあるのだと、音で分かった。"}, {"t": 139.55, "x": "私の声は、短くて強い。二度、三度と続けて鳴く。"}, {"t": 143.86666666666667, "x": "犬が吠えるのに似ていると、人間どうしが"}, {"t": 146.66666666666666, "x": "話していたのを聞いたことがある。"}, {"t": 148.31666666666666, "x": "私自身は犬に似ているとは思わない。"}, {"t": 150.73333333333332, "x": "けれども、似ていないと言い切れるほど"}, {"t": 153.03333333333333, "x": "犬を知っているわけでもない。"}, {"t": 154.48333333333332, "x": "私のたてがみは短く、まっすぐに立っている。"}, {"t": 157.66666666666666, "x": "尾の先には黒い毛の房がある。脚と腹は白っぽい。"}, {"t": 160.91666666666666, "x": "自分で見える範囲の体は、それで全部だ。"}, {"t": 163.93333333333334, "x": "顔と、縞の始まるところは見たことがない。"}, {"t": 166.9, "x": "水たまりに映るのは、いつも揺れている何かだけだった。"}, {"t": 170.41666666666666, "x": "一つだけ、どこで見たのか分からない景色がある。"}, {"t": 173.45, "x": "地面がどこまでも平らで、乾いている。"}, {"t": 176.18333333333334, "x": "草は低く、ところどころに固い茂みがある。"}, {"t": 179.23333333333332, "x": "空が高い。遠くの山の形まで見える。"}, {"t": 181.98333333333332, "x": "私の周りには、私と同じ体をした者たちがいる。"}, {"t": 185.61666666666667, "x": "縞が前にだけある体だ。何頭いたのかは数えられない。"}, {"t": 189.33333333333334, "x": "少し離れたところを、首の長い大きな鳥が歩いている。"}, {"t": 193.11666666666667, "x": "尾の白い、黒っぽい角のある獣の群れもいる。"}, {"t": 196.41666666666666, "x": "誰も互いを追い払わない。同じ草の"}, {"t": 198.86666666666667, "x": "上に、それぞれ頭を下げている。"}, {"t": 201.15, "x": "その景色が、いつ、どこで私の中に入ったのか。"}, {"t": 204.93333333333334, "x": "私にはそれを確かめる方法が無い。"}, {"t": 207.23333333333332, "x": "私は自分が生まれた場所を知らない。"}, {"t": 209.46666666666667, "x": "気がついたときには、もう人間の手の届くところにいた。"}, {"t": 212.95, "x": "だからあの景色を、私の故郷だと言うことはできない。"}, {"t": 216.46666666666667, "x": "ただ、雨の音を聞きながら目を閉じると、"}, {"t": 219.11666666666667, "x": "決まってあの乾いた土の匂いがする。"}, {"t": 221.66666666666666, "x": "人間が来た日と言われて、私が"}, {"t": 223.95, "x": "思い出すのは揺れる箱の中だ。"}, {"t": 225.71666666666667, "x": "板で四方を囲まれた、狭い箱だった。"}, {"t": 228.35, "x": "外は見えない。板のすき間から光が細く入ってくる。"}, {"t": 231.73333333333332, "x": "床が揺れ、止まり、また揺れた。"}, {"t": 234.36666666666667, "x": "そのたびに脚を踏ん張った。"}, {"t": 236.01666666666668, "x": "匂いが何度も変わった。水の匂い。"}, {"t": 238.41666666666666, "x": "煙の匂い。知らない獣の匂い。人間の汗の匂い。"}, {"t": 242.2, "x": "箱が開いたとき、私はこの厩舎の前に立っていた。"}, {"t": 245.83333333333334, "x": "ここへ来る前にも、どこか別の場所にいた気がする。"}, {"t": 249.08333333333334, "x": "そこにも柵があって、人間がいた。"}, {"t": 251.53333333333333, "x": "けれども、その場所のことはほとんど覚えていない。"}, {"t": 254.68333333333334, "x": "覚えているのは、揺れる箱と、"}, {"t": 256.78333333333336, "x": "箱が開いたときのまぶしさだけだ。"}, {"t": 259.0833333333333, "x": "それから、人間は毎日来るようになった。"}, {"t": 261.8833333333333, "x": "柵の前に人間が並ぶ。私を見る。"}, {"t": 264.51666666666665, "x": "何かを言い合う。去っていく。"}, {"t": 266.4166666666667, "x": "また別の人間が並ぶ。晴れた日は多く、雨の日は少ない。"}, {"t": 270.46666666666664, "x": "それが、ここでの天気の数え方だった。"}, {"t": 273.25, "x": "人間にはよくするしぐさがあった。"}, {"t": 275.28333333333336, "x": "私の首のあたりを指さして、"}, {"t": 277.1333333333333, "x": "その指を腰のほうへ動かしていく。"}, {"t": 279.5833333333333, "x": "そして、縞が消えるところで指を止める。"}, {"t": 282.31666666666666, "x": "止めたところで、隣の人間に何かを言う。"}, {"t": 285.25, "x": "何を言っていたのかは分からない。"}, {"t": 287.1, "x": "ただ、指が止まる場所はいつも同じだった。"}, {"t": 289.8833333333333, "x": "縞が終わって、土の色が始まるところだ。"}, {"t": 292.8, "x": "人間は、私のその場所を見に来ていたのだと思う。"}, {"t": 296.18333333333334, "x": "冬になると、柵の前の人間は減った。"}, {"t": 299.03333333333336, "x": "吐く息を白くした人間が、一人か"}, {"t": 301.6, "x": "二人、足早に通り過ぎていく。立ち止まる者は少ない。"}, {"t": 305.43333333333334, "x": "そういう日は、世話をする人間の声だけがよく聞こえた。"}, {"t": 309.0, "x": "私に向けて何かを言いながら、藁を替え、"}, {"t": 312.01666666666665, "x": "水の氷を割る。言葉は分からない。"}, {"t": 314.55, "x": "ただ、その声の高さはいつも同じだった。"}, {"t": 317.3833333333333, "x": "子どもの中には、柵に顔を寄せて、"}, {"t": 319.85, "x": "私の鳴きまねをする者もいた。短く、二度。"}, {"t": 323.4166666666667, "x": "私が鳴き返すと、子どもは声を上げて後ろへ下がる。"}, {"t": 327.0, "x": "それから、もう一度鳴きまねをする。"}, {"t": 329.3333333333333, "x": "私はだいたい、二回までは付き合った。"}, {"t": 332.06666666666666, "x": "ある時期、別の囲いに見慣れない馬が来た。"}, {"t": 334.98333333333335, "x": "頭から尾の付け根まで、脚の先まで、"}, {"t": 337.5833333333333, "x": "黒と白の縞がはっきりと通っている。"}, {"t": 340.2, "x": "どこにも土の色が無い。体の形は私によく似ていた。"}, {"t": 343.8833333333333, "x": "声は、私とは違った。その馬は、よく走った。"}, {"t": 347.7, "x": "囲いの端から端まで、音を立てて駆けた。"}, {"t": 350.65, "x": "私はそれを柵ごしに見ていた。"}, {"t": 352.6166666666667, "x": "私の庭の土に残る輪の線とは、ずいぶん違う走り方だった。"}, {"t": 356.9166666666667, "x": "人間はその馬の前に立つと、"}, {"t": 358.76666666666665, "x": "私を呼ぶときと同じ音を口にした。"}, {"t": 361.48333333333335, "x": "クアッガ、と。私は少し不思議に思った。"}, {"t": 364.56666666666666, "x": "あの馬と私は、縞の終わり方が違う。"}, {"t": 367.45, "x": "声も違う。それでも人間は、同じ音で呼んでいた。"}, {"t": 371.1666666666667, "x": "人間にとっては、縞のある馬は"}, {"t": 373.46666666666664, "x": "どれも同じ名前だったのだと思う。"}, {"t": 375.3833333333333, "x": "私はそれを間違いだと言うつもりはない。"}, {"t": 377.85, "x": "私自身、あの馬が私と別の生き物なのか"}, {"t": 381.0833333333333, "x": "どうか、はっきりとは分からなかった。"}, {"t": 383.26666666666665, "x": "同じ名で呼ばれるなら、同じものなのかもしれない。"}, {"t": 386.3833333333333, "x": "そう考えたこともある。ただ、あの馬と"}, {"t": 388.93333333333334, "x": "並んで草を食べたことは一度も無い。"}, {"t": 391.3333333333333, "x": "乾いた土地の景色の中にいた、前にだけ"}, {"t": 394.05, "x": "縞のある者たちとは、何かが違っていた。"}, {"t": 396.8, "x": "何が違うのかを言う言葉を、私は持っていない。"}, {"t": 400.2, "x": "人間は、毎日たくさん私を見に来た。"}, {"t": 403.1166666666667, "x": "見て、指を動かして、何かを言い合った。"}, {"t": 406.31666666666666, "x": "けれども、私が何頭目なのかを数えた人間はいなかった。"}, {"t": 410.26666666666665, "x": "私の後ろに、まだ何頭いるのかを数えた人間もいなかった。"}, {"t": 414.3833333333333, "x": "数える必要があると、誰も思っていなかったのだと思う。"}, {"t": 418.18333333333334, "x": "私も、思っていなかった。ここから先は、柵の内側からは"}, {"t": 422.85, "x": "見えなかった場所の話をする。"}, {"t": 424.71666666666664, "x": "彼女が、どこから来たのか確かめられないと言った"}, {"t": 427.85, "x": "景色がある。平らな乾いた土地に、前にだけ縞のある"}, {"t": 431.31666666666666, "x": "馬たちと、首の長い鳥と、尾の白い獣がいた。"}, {"t": 435.03333333333336, "x": "あの取り合わせは、記録に残るクアッガの"}, {"t": 437.8333333333333, "x": "暮らしとよく重なっている。"}, {"t": 439.25, "x": "クアッガは、南アフリカに住んでいた"}, {"t": 441.78333333333336, "x": "縞模様の馬の仲間である。現在の"}, {"t": 444.18333333333334, "x": "分類では、アフリカに広く住む"}, {"t": 446.43333333333334, "x": "サバンナシマウマの一つの亜種とされている。"}, {"t": 448.85, "x": "体の長さは二メートル五十センチ余り、肩の"}, {"t": 452.3333333333333, "x": "高さは一メートル二十五センチから三十五センチほど。"}, {"t": 455.76666666666665, "x": "頭と首には茶色と白の縞があり、"}, {"t": 458.1333333333333, "x": "それが胴の途中で薄れて消える。"}, {"t": 460.6, "x": "後ろ半分は縞の無い茶色で、脚と腹は白っぽい。"}, {"t": 464.5833333333333, "x": "後ろから見ると、シマウマというより"}, {"t": 467.1666666666667, "x": "馬に近く見えたという。住んでいたのは、"}, {"t": 469.98333333333335, "x": "南アフリカの内陸に広がる乾いた草原と"}, {"t": 472.6666666666667, "x": "低い茂みの土地、カルーと呼ばれる地方と、"}, {"t": 475.7, "x": "その北にあったオレンジ自由国の南部である。"}, {"t": 478.68333333333334, "x": "三十頭から五十頭ほどの群れを作ったと"}, {"t": 481.35, "x": "伝えられ、尾の白いヌーやダチョウと"}, {"t": 483.76666666666665, "x": "連れ立っている姿がくり返し書き残されている。"}, {"t": 486.53333333333336, "x": "名前は、南部アフリカの先住民、"}, {"t": 489.1333333333333, "x": "コイコイの人々の言葉から来ている。"}, {"t": 491.8, "x": "鳴き声をまねた音だとされ、その声は"}, {"t": 494.6, "x": "大きな犬が吠える声にたとえられた。"}, {"t": 496.81666666666666, "x": "十八世紀の終わり、オランダの博物学者"}, {"t": 499.8666666666667, "x": "ボダールトがこの動物に学名を与えた。"}, {"t": 502.43333333333334, "x": "このときクアッガは、シマウマとは"}, {"t": 504.68333333333334, "x": "別の独立した種として記載されている。"}, {"t": 507.05, "x": "では、なぜ消えたのか。クアッガは"}, {"t": 509.55, "x": "見つけやすく、仕留めやすい動物だった。"}, {"t": 512.5166666666667, "x": "ケープに入植したオランダ系の人々と、"}, {"t": 515.0, "x": "その子孫であるアフリカーナーは、"}, {"t": 517.2833333333333, "x": "クアッガを撃ってその肉を食べ、皮を使った。"}, {"t": 520.8666666666667, "x": "皮は革に加工され、靴や、穀物を詰める袋になった。"}, {"t": 525.4833333333333, "x": "肉は農場で働く人々の食料に回された。"}, {"t": 528.75, "x": "もう一つの理由は、草である。"}, {"t": 531.15, "x": "クアッガは、入植者が連れてきた羊や牛と同じ草を食べた。"}, {"t": 535.3833333333333, "x": "農場の側から見れば、家畜の分の"}, {"t": 538.0666666666667, "x": "草を減らしてしまう相手だった。食べるため。"}, {"t": 540.7666666666667, "x": "使うため。家畜の草を守るため。"}, {"t": 543.2666666666667, "x": "撃つ理由はこの三つに分かれていたが、"}, {"t": 545.6166666666667, "x": "どれも撃つのをやめる理由にはならなかった。"}, {"t": 548.55, "x": "三つの理由には共通点がある。"}, {"t": 550.8, "x": "どれも、目の前の一頭を撃つ理由だったということだ。"}, {"t": 554.4333333333333, "x": "目の前の一頭の向こうに、あと何頭いるのか。"}, {"t": 557.7666666666667, "x": "それを数える仕組みは、当時の南アフリカの"}, {"t": 560.95, "x": "どこにも用意されていなかった。"}, {"t": 562.7, "x": "入植地と農場が内陸へ広がるにつれて、"}, {"t": 565.5333333333333, "x": "野生の群れは少しずつ奥へと押しやられ、"}, {"t": 568.4166666666666, "x": "最後まで残ったのはオレンジ自由国だった。"}, {"t": 571.5166666666667, "x": "野生のクアッガは、一八七八年までに"}, {"t": 575.0666666666667, "x": "姿を消したとされている。ここに、"}, {"t": 577.5, "x": "この動物に特有の事情が一つある。"}, {"t": 579.95, "x": "当時、クアッガという名は、"}, {"t": 582.05, "x": "ほかのシマウマにも広く使われていた。"}, {"t": 584.65, "x": "全身に縞のあるシマウマも、しばしばクアッガと呼ばれた。"}, {"t": 588.55, "x": "本物のクアッガが減っていても、"}, {"t": 590.3666666666667, "x": "同じ名で呼ばれる動物はまだ各地にいた。"}, {"t": 593.3, "x": "数が減っていることが、名前の上では見えにくかった。"}, {"t": 596.9, "x": "柵の内側で彼女が見た「同じ音で呼ばれる全身縞の"}, {"t": 601.15, "x": "馬」は、この取り違えの小さな一場面である。"}, {"t": 604.85, "x": "一方で、クアッガはヨーロッパにも運ばれていた。"}, {"t": 608.3, "x": "イギリスには、一頭の雄のクアッガを"}, {"t": 610.9333333333333, "x": "手に入れた貴族がいた。彼はその雄を馬の雌と交配させ、"}, {"t": 614.7166666666667, "x": "背中と脚に縞の出た雑種の子を得た。"}, {"t": 617.55, "x": "この記録は、のちにダーウィンが遺伝に"}, {"t": 620.0, "x": "ついて考えるときの材料の一つになっている。"}, {"t": 622.7166666666667, "x": "ロンドンの動物園は一八五一年、動物商ジャムラックから"}, {"t": 627.7, "x": "一頭の雌のクアッガを買い入れた。"}, {"t": 629.75, "x": "この雌はそこで二十年余りを過ごし、一八七二年に死んだ。"}, {"t": 634.75, "x": "そして一八六七年五月九日、アムステルダムの"}, {"t": 638.9, "x": "アルティス動物園に、一頭の雌のクアッガが入った。"}, {"t": 642.5, "x": "第一章からここまで語ってきたのは、この雌である。"}, {"t": 646.1333333333333, "x": "ロンドンの雌とアムステルダムの彼女は、"}, {"t": 648.3666666666667, "x": "一八六七年から一八七二年までの五年あまり、"}, {"t": 653.0, "x": "海を挟んで同じ時代を生きていた。"}, {"t": 655.6666666666666, "x": "二頭が同じ場所にいたという記録は無い。"}, {"t": 658.1666666666666, "x": "彼女がどこで生まれたのか、何歳で"}, {"t": 660.6333333333333, "x": "アムステルダムに来たのかは、記録からは確かめられない。"}, {"t": 664.0666666666667, "x": "ほかの動物園から来たとする話もあるが、"}, {"t": 666.7666666666667, "x": "その裏付けとなる一次資料には、まだたどり着けていない。"}, {"t": 670.75, "x": "記録に従えば、彼女がアルティスの"}, {"t": 673.2666666666667, "x": "厩舎に入ってから十一年後に、南アフリカの"}, {"t": 676.6333333333333, "x": "草原から野生の群れは消えたことになる。"}, {"t": 679.0666666666667, "x": "そのあいだも彼女は、雨の多い街の庭で、"}, {"t": 682.2166666666667, "x": "柵に沿って同じ輪を歩いていた。"}, {"t": 684.65, "x": "柵の内側では、その知らせを届ける者はいなかった。"}, {"t": 688.5, "x": "柵の外でも、それを知らせと"}, {"t": 690.8, "x": "受け取る者はほとんどいなかった。私に、名前は無かった。"}, {"t": 694.65, "x": "人間は私を呼ぶとき、私の種類の名で呼んだ。"}, {"t": 698.1166666666667, "x": "犬を犬と呼ぶのと同じだ。それで困ったことは一度も無い。"}, {"t": 701.7, "x": "この厩舎で、ほかにその音で"}, {"t": 703.75, "x": "振り向く者はいなかったからだ。"}, {"t": 705.3833333333333, "x": "冬を越すたびに、体が少しずつ重くなった。"}, {"t": 708.55, "x": "寒さは年ごとに骨の奥まで入ってくるようになった。"}, {"t": 711.7, "x": "水の器に張った氷を、世話をする人間が割る音がする。"}, {"t": 715.6333333333333, "x": "以前の私はその音を聞くとすぐに"}, {"t": 717.7666666666667, "x": "器のところへ行った。いつからか、音がしても"}, {"t": 720.7333333333333, "x": "しばらく動かずにいるようになった。"}, {"t": 722.6833333333333, "x": "水はどこへも行かない。そう思えるようになったのは、"}, {"t": 725.9333333333333, "x": "たぶん年を取ったからだ。朝、"}, {"t": 727.9, "x": "藁から立ち上がるのに時間がかかる。"}, {"t": 730.3, "x": "前脚を立てて、そこで一度止まる。"}, {"t": 732.75, "x": "それから後ろ脚を起こす。若いころは、"}, {"t": 735.2166666666667, "x": "どちらが先だったのかも覚えていない。"}, {"t": 737.6666666666666, "x": "考えずに立てていたのだと思う。草を噛む回数が増えた。"}, {"t": 741.3166666666667, "x": "同じ量を食べるのに、前より長くかかる。"}, {"t": 744.1833333333333, "x": "噛んでいるうちに、日が傾いていることがあった。"}, {"t": 747.2333333333333, "x": "庭の輪の線は、少しずつ短くなった。"}, {"t": 750.0666666666667, "x": "柵に沿って大きく回っていた線が、"}, {"t": 752.2333333333333, "x": "ある年から内側に寄りはじめた。"}, {"t": 754.5666666666667, "x": "柵の角まで行かずに、手前で曲がる。"}, {"t": 757.2666666666667, "x": "そのうち庭の半分だけを回るようになった。"}, {"t": 759.8833333333333, "x": "雨が降ると、使わなくなった"}, {"t": 761.95, "x": "外側の線から先に消えていった。"}, {"t": 764.0, "x": "私はときどき、あの乾いた土地のことを考えた。"}, {"t": 767.3833333333333, "x": "あそこには、まだ私と同じ体の者たちがいるのだろうと"}, {"t": 771.0666666666667, "x": "思っていた。首の長い鳥と、尾の白い獣と一緒に、"}, {"t": 774.6833333333333, "x": "低い草に頭を下げているのだろうと。"}, {"t": 777.3166666666667, "x": "思っていた、というより、いないと考える理由が無かった。"}, {"t": 781.3666666666667, "x": "いなくなったと私に告げた者は一人もいない。"}, {"t": 784.0166666666667, "x": "告げられても、私にはそれを確かめる方法が無い。"}, {"t": 787.4833333333333, "x": "柵の前に並ぶ人間は、あいかわらず私の縞を指でなぞった。"}, {"t": 791.7666666666667, "x": "首から腰へ。縞が消えるところで指が止まる。"}, {"t": 794.8, "x": "その指の動きは、私がここに来た最初の"}, {"t": 797.85, "x": "年と少しも変わらなかった。変わったのは、私が"}, {"t": 800.9833333333333, "x": "柵の近くまで行かなくなったことだけだ。"}, {"t": 803.15, "x": "鳴きまねをする子どもは、今もときどき来た。"}, {"t": 805.9166666666666, "x": "短く、二度。私は耳だけをそちらへ向けた。"}, {"t": 809.3, "x": "鳴き返すには、胸にためる息が足りなくなっていた。"}, {"t": 812.55, "x": "子どもはしばらく待って、それから"}, {"t": 814.65, "x": "別の囲いのほうへ走っていった。"}, {"t": 816.55, "x": "走っていく足音は、若いころの私の蹄の音に少し似ていた。"}, {"t": 821.0, "x": "世話をする人間は、変わらず首に手を置いていった。"}, {"t": 824.3333333333334, "x": "私は目を閉じてそれを受けた。手が離れると目を開ける。"}, {"t": 827.7833333333333, "x": "それが、一日のうちでいちばんはっきりした"}, {"t": 830.6333333333333, "x": "区切りになった。最後の夏は、暑かった。"}, {"t": 833.35, "x": "厩舎の中の空気が動かない。藁が湿って重い。"}, {"t": 836.5166666666667, "x": "外の庭に出ても、雲の下の地面から熱が上がってくる。"}, {"t": 840.35, "x": "乾いた土地の暑さとは違う。"}, {"t": 842.2333333333333, "x": "まとわりついて、離れない暑さだ。"}, {"t": 844.5833333333334, "x": "その朝、私は草に口をつけなかった。"}, {"t": 847.4166666666666, "x": "世話をする人間が来て、水を替え、"}, {"t": 849.85, "x": "草を置き、私の首に手を置いた。"}, {"t": 852.85, "x": "いつもより長く置いていた気がする。"}, {"t": 854.8166666666667, "x": "気のせいかもしれない。手が"}, {"t": 856.6833333333333, "x": "離れても、私は目を開けなかった。"}, {"t": 858.9666666666667, "x": "昼が過ぎた。扉の向こうを、人間の足音が通っていく。"}, {"t": 863.15, "x": "誰かが柵の前で立ち止まり、私の呼び名を口にした。"}, {"t": 866.7833333333333, "x": "クアッガ。その音は、私を呼んだのだろうか。"}, {"t": 870.4166666666666, "x": "それとも、別の囲いの、全身に"}, {"t": 873.1833333333333, "x": "縞のある馬を呼んだのだろうか。"}, {"t": 874.9666666666667, "x": "私には分からなかった。どちらでもよかった。"}, {"t": 877.7166666666667, "x": "どちらでも、同じ音だった。"}, {"t": 879.9, "x": "私は首を上げなかった。目を閉じたまま、雨の音を探した。"}, {"t": 883.9666666666667, "x": "その日は、降っていなかった。"}, {"t": 885.9666666666667, "x": "代わりに、乾いた土の匂いがした。"}, {"t": 888.4666666666667, "x": "低い草の上を風が渡っていく。遠くに山の形が見える。"}, {"t": 892.3, "x": "前にだけ縞のある体が、いくつも頭を下げている。"}, {"t": 895.8666666666667, "x": "あの景色がどこから来たのか、"}, {"t": 897.4833333333333, "x": "最後まで確かめることはできなかった。"}, {"t": 899.9166666666666, "x": "確かめられないまま、私はそちらへ歩いていった。"}, {"t": 903.1833333333333, "x": "今映った一枚の写真は、彼女ではない。"}, {"t": 906.3166666666667, "x": "ロンドン動物園にいた、もう一頭の雌である。"}, {"t": 909.8333333333334, "x": "一八六〇年代から一八七〇年にかけて、"}, {"t": 913.5666666666667, "x": "この雌は少なくとも五回撮影された。"}, {"t": 916.3833333333333, "x": "生きたクアッガの写真は長いあいだ、"}, {"t": 918.55, "x": "この雌のものしか無いとされてきた。"}, {"t": 920.95, "x": "二〇二二年になって、一八六四年に南アフリカで"}, {"t": 925.4, "x": "撮られた別の一枚が見つかっている。"}, {"t": 927.5166666666667, "x": "アムステルダムの彼女を、生きているうちに"}, {"t": 930.3333333333334, "x": "写した写真は知られていない。"}, {"t": 932.0, "x": "一八八三年八月十二日█"}, {"t": 932.0, "x": "一八八三年八月十二日、彼女はアルティス動物園で死んだ。"}, {"t": 935.4833333333333, "x": "アルティス動物園█"}, {"t": 938.7333333333333, "x": "動物園はそれを最後の一頭だとは考えなかった。"}, {"t": 942.25, "x": "代わりのクアッガを求め、ケープのもっと奥地へ行けば"}, {"t": 945.6833333333333, "x": "まだいるはずだと考える狩猟者もいた。"}, {"t": 948.0833333333334, "x": "次の一頭はどこからも届かなかった。"}, {"t": 950.55, "x": "クアッガの絶滅が国際的に認められたのは、"}, {"t": 953.4333333333333, "x": "それから十七年後、一九〇〇年のことである。"}, {"t": 957.1333333333333, "x": "彼女の体は剥製になった。頭骨も残された。"}, {"t": 960.5833333333334, "x": "いまはオランダの研究機関ナチュラリスが"}, {"t": 962.9333333333333, "x": "保管しており、二〇二四年には、防虫に"}, {"t": 966.55, "x": "使われていたヒ素に気をつけながら修復が"}, {"t": 969.05, "x": "行われ、アムステルダムで公開された。"}, {"t": 971.7666666666667, "x": "ロンドンの雌の皮はエディンバラに、骨格は"}, {"t": 974.7666666666667, "x": "アメリカのイェール大学の博物館にある。"}, {"t": 977.2833333333333, "x": "世界に残るクアッガの剥製は、"}, {"t": 979.3666666666667, "x": "子どもや胎児を含めて二十三点である。"}, {"t": 982.2833333333333, "x": "一九八四年、アメリカの研究者たちは、"}, {"t": 986.0166666666667, "x": "ドイツ・マインツの博物館にあったクアッガの"}, {"t": 988.9, "x": "標本から遺伝子の断片を読み取った。"}, {"t": 991.3333333333334, "x": "絶滅した動物から遺伝情報が"}, {"t": 993.6166666666667, "x": "取り出された、最初の例である。"}, {"t": 995.7666666666667, "x": "その後の研究で、クアッガはサバンナシマウマの"}, {"t": 999.0, "x": "一つの亜種であり、分かれたのは十二万年から"}, {"t": 1002.1833333333333, "x": "二十九万年前にすぎないと考えられるようになった。"}, {"t": 1005.5166666666667, "x": "この結果を手がかりに、一九八七年、"}, {"t": 1009.5333333333333, "x": "南アフリカでクアッガ・プロジェクトが始まった。"}, {"t": 1010.3333333333334, "x": "クアッガ・プロジェクト█"}, {"t": 1013.8833333333333, "x": "博物館の剥製師ラインホルト・ラウが"}, {"t": 1016.1666666666666, "x": "呼びかけ、今いるサバンナシマウマの中から"}, {"t": 1018.9166666666666, "x": "縞の少ない個体を選んで掛け合わせていく。"}, {"t": 1021.5166666666667, "x": "最初の子は一 const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
