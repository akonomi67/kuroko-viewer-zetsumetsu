, {"t": 1002.0666666666667, "i": 370}, {"t": 1004.7666666666667, "i": 371}, {"t": 1006.7833333333333, "i": 372}, {"t": 1010.05, "i": 373}, {"t": 1014.0666666666667, "i": 374}, {"t": 1016.0333333333333, "i": 375}, {"t": 1018.05, "i": 376}, {"t": 1021.1666666666666, "i": 377}, {"t": 1025.4333333333334, "i": 378}, {"t": 1028.2, "i": 379}, {"t": 1032.4, "i": 380}, {"t": 1035.1833333333334, "i": 381}, {"t": 1038.9666666666667, "i": 382}, {"t": 1042.7, "i": 383}, {"t": 1046.0666666666666, "i": 384}, {"t": 1049.2333333333333, "i": 385}, {"t": 1052.4166666666667, "i": 386}, {"t": 1056.6166666666666, "i": 387}, {"t": 1058.5333333333333, "i": 388}, {"t": 1060.6833333333334, "i": 389}, {"t": 1063.9166666666667, "i": 390}, {"t": 1067.4166666666667, "i": 391}, {"t": 1069.8333333333333, "i": 392}, {"t": 1072.55, "i": 393}, {"t": 1074.2333333333333, "i": 394}, {"t": 1076.55, "i": 395}, {"t": 1080.8, "i": 396}, {"t": 1084.75, "i": 396}], "subs": [{"t": 0.0, "x": "息を吸うために頭を上げた。"}, {"t": 1.85, "x": "鼻から古い息と少しの水を吹き出す。新しい息を吸う。"}, {"t": 5.55, "x": "それからまた頭を海に沈めて昆布の根を噛む。"}, {"t": 8.45, "x": "私たちは一生それを繰り返す。"}, {"t": 10.566666666666666, "x": "だから私は浜の上を見ていなかった。"}, {"t": 12.916666666666666, "x": "背中に何かが入ってきた。重く、深く。"}, {"t": 16.116666666666667, "x": "長い棒の先に付いた鉄だった。"}, {"t": 18.116666666666667, "x": "私は沖へ向かった。傷を負ったら沖へ出る。"}, {"t": 21.0, "x": "少し休んでまた浜へ戻る。昔からそうしてきた。"}, {"t": 24.166666666666668, "x": "今度は戻る場所に仲間がいない。息を吐いた。"}, {"t": 27.083333333333332, "x": "声は出ない。私たちはもともと声を持たない。"}, {"t": 30.0, "x": "この海で私と同じ形をしたものは、それで終わりになった。"}, {"t": 33.766666666666666, "x": "私が生きていた世界は、浜から"}, {"t": 36.016666666666666, "x": "少しだけ離れた浅い海だった。"}, {"t": 37.86666666666667, "x": "足もとには昆布の林がある。"}, {"t": 39.81666666666667, "x": "茎が長く葉が揺れる。キャベツの葉のように縮れたもの。"}, {"t": 43.11666666666667, "x": "棍棒のような形のもの。丸い盾のような形のもの。"}, {"t": 46.55, "x": "私たちが好んで食べるのは決まった何種類かだけだ。"}, {"t": 49.61666666666667, "x": "私たちの口には歯が無い。上と下に白く硬い板があり、"}, {"t": 53.11666666666667, "x": "昆布の葉をその板にはさんでつぶす。唇も硬い。"}, {"t": 56.71666666666667, "x": "茎にかみついて頭を振ると、葉だけがちぎれて口に残る。"}, {"t": 60.583333333333336, "x": "硬い根と太い茎は食べずに捨てる。"}, {"t": 62.7, "x": "私たちは食べるのをやめない。"}, {"t": 64.46666666666667, "x": "頭を水に入れたまま前の足を片方ずつ動かして進む。"}, {"t": 68.13333333333334, "x": "泳いでいるのか歩いているのか自分でもよく分からない。"}, {"t": 71.25, "x": "背中と脇腹はいつも水の上に出ている。"}, {"t": 73.88333333333334, "x": "食べているあいだは、まわりで"}, {"t": 75.73333333333333, "x": "何が起きてもあまり気にならない。"}, {"t": 77.46666666666667, "x": "頭を上げるのは息をするときだけだ。"}, {"t": 79.7, "x": "何度か噛むうちに胸が苦しくなってくる。"}, {"t": 82.08333333333333, "x": "そうしたら頭を上げる。鼻から息と水を一度に吹き出す。"}, {"t": 85.66666666666667, "x": "馬が鼻を鳴らすのに似た音だと、あとで人間が書いた。"}, {"t": 89.38333333333334, "x": "私はその音をずっと自分の音だと思っていた。"}, {"t": 92.3, "x": "川が海へ流れ込む口のあたりがいちばん好きだった。"}, {"t": 95.33333333333333, "x": "水の味が少し薄くなる。昆布もよく育つ。"}, {"t": 98.21666666666667, "x": "私たちの群れはそういう場所を幾つか知っていて、"}, {"t": 101.08333333333333, "x": "浜に沿ってその間を行き来していた。"}, {"t": 103.48333333333333, "x": "捨てた根と茎は潮に運ばれて浜に打ち上げられる。"}, {"t": 106.51666666666667, "x": "少しのあいだとどまっただけの場所でも、"}, {"t": 108.63333333333334, "x": "浜には根と茎の山ができた。"}, {"t": 110.8, "x": "その山を見れば、私たちがどこで食べていたかが分かる。"}, {"t": 114.41666666666667, "x": "あとで人間たちも、それを見て私たちの居場所を知った。"}, {"t": 118.0, "x": "群れには並び方がある。子どもと"}, {"t": 119.95, "x": "まだ育ちきっていない者は前に出す。"}, {"t": 122.16666666666667, "x": "大きな者たちがその横と後ろを囲む。"}, {"t": 124.63333333333334, "x": "子どもは群れの真ん中で食べる。"}, {"t": 126.43333333333334, "x": "私も小さかったころは真ん中にいた。"}, {"t": 128.8, "x": "大きくなってからは外側に回った。"}, {"t": 131.0, "x": "群れの中は家族ごとにまとまっている。"}, {"t": 133.23333333333332, "x": "一頭の雄と一頭の雌とその子ども。"}, {"t": 135.53333333333333, "x": "私の父と母もそうだった。私にも"}, {"t": 137.71666666666667, "x": "のちに一頭の連れができた。"}, {"t": 139.6, "x": "背中にはいつも誰かが乗っている。白い鳥だ。"}, {"t": 142.56666666666666, "x": "カモメという。私たちの皮には小さな虫が住みついている。"}, {"t": 146.31666666666666, "x": "カモメはそれを嘴でつついて食べる。"}, {"t": 148.51666666666668, "x": "痛くはない。こちらは食べ続け、向こうも食べ続ける。"}, {"t": 152.13333333333333, "x": "背中の上と下で、どちらも食事をしている。"}, {"t": 155.13333333333333, "x": "私たちの皮は厚くて硬い。古い木の"}, {"t": 157.31666666666666, "x": "皮のように割れてでこぼこしている。"}, {"t": 159.63333333333333, "x": "岩に当たっても流れてきた氷に"}, {"t": 161.53333333333333, "x": "擦られても、そう簡単には破れない。"}, {"t": 164.11666666666667, "x": "腹がいっぱいになると何頭かは仰向けになって眠る。"}, {"t": 167.2, "x": "眠る前に少し沖へ出る。潮が引いたとき"}, {"t": 169.7, "x": "乾いた砂の上に取り残されないためだ。"}, {"t": 172.21666666666667, "x": "一度だけそれをしくじった者を見た。"}, {"t": 174.3, "x": "眠っているあいだに水が引いて、"}, {"t": 176.13333333333333, "x": "浜に乗り上げたまま動けなくなった。"}, {"t": 178.46666666666667, "x": "私たちの体は陸の上では何もできない。"}, {"t": 181.16666666666666, "x": "潮が戻るまでそこでじっとしているしかなかった。"}, {"t": 183.86666666666667, "x": "冬は痩せる季節だ。昆布が減る。海が荒れる。"}, {"t": 186.98333333333332, "x": "背中の骨が浮き、脇腹にあばらの形が出てくる。"}, {"t": 190.45, "x": "流れてくる氷に挟まれて息ができなくなる者がいる。"}, {"t": 193.63333333333333, "x": "波に押されて岩に何度も打ちつけられる者もいる。"}, {"t": 196.51666666666668, "x": "春になると浜に打ち上げられた"}, {"t": 198.33333333333334, "x": "大きな体が幾つか残っている。"}, {"t": 200.26666666666668, "x": "それでも春は来る。春の夕方に海が凪ぐ日がある。"}, {"t": 203.56666666666666, "x": "雄は雌のあとを追って泳ぐ。"}, {"t": 205.4, "x": "雌はくるりと向きを変えて離れる。それを何度も繰り返す。"}, {"t": 209.05, "x": "子どもが生まれるのはたいてい秋だ。"}, {"t": 211.08333333333334, "x": "一度に一頭だけ生まれる。浜にはキツネがいた。"}, {"t": 214.03333333333333, "x": "灰色がかった毛の小さな獣だ。"}, {"t": 216.15, "x": "打ち上げられた者があれば、それを食べに集まってくる。"}, {"t": 219.46666666666667, "x": "キツネは私たちに何もしない。"}, {"t": 221.38333333333333, "x": "私たちもキツネに何もしない。"}, {"t": 223.26666666666668, "x": "岩場の近くには、仰向けに浮かんで"}, {"t": 225.71666666666667, "x": "腹の上で貝を割る小さな獣もいた。"}, {"t": 228.08333333333334, "x": "食べるものが違うので、私たちとは互いに用が無かった。"}, {"t": 231.8, "x": "私たちの世界にいたのは、それで全部だった。"}, {"t": 234.83333333333334, "x": "昆布と潮とカモメとキツネと、同じ形をした仲間たち。"}, {"t": 238.76666666666668, "x": "そこに一つ、まだ知らない形のものが加わった。"}, {"t": 241.98333333333332, "x": "その日のことを、私は群れの真ん中から見ていた。"}, {"t": 245.3, "x": "秋の終わりだった。海が荒れていた。"}, {"t": 247.55, "x": "沖から大きな木の塊が流れてきて、"}, {"t": 249.86666666666667, "x": "浜の近くの岩に乗り上げた。"}, {"t": 251.91666666666666, "x": "塊はきしんで傾き、そこから動かなくなった。"}, {"t": 255.26666666666668, "x": "中から二本の足で歩く生きものが出てきた。"}, {"t": 257.9166666666667, "x": "初めて見る形だった。細い。"}, {"t": 260.51666666666665, "x": "毛の生えた皮を何枚も重ねて体に巻いている。"}, {"t": 263.46666666666664, "x": "浜に上がってくると、多くの者が"}, {"t": 265.81666666666666, "x": "砂の上に座り込んだり横になったりした。"}, {"t": 268.15, "x": "立ち上がれない者もいた。運ばれていく者もいた。"}, {"t": 271.1666666666667, "x": "冬のあいだ、その生きものたちは浜にいた。"}, {"t": 273.98333333333335, "x": "砂を掘って穴を作りそこに入っていた。"}, {"t": 276.3666666666667, "x": "煙が上がった。キツネたちがすぐに寄っていった。"}, {"t": 279.25, "x": "人間は石を投げてキツネを追い払っていた。"}, {"t": 281.8666666666667, "x": "それが人間というものだった。"}, {"t": 283.7, "x": "冬が進むにつれて人間の数は減っていった。"}, {"t": 286.4166666666667, "x": "浜の穴のそばに何かを埋めている姿を何度か見た。"}, {"t": 289.6166666666667, "x": "春が来て夏が近づいたころ、一人の人間が海に入ってきた。"}, {"t": 293.6, "x": "潮の満ちるころだった。私たちは"}, {"t": 295.6, "x": "浜のすぐ近くまで寄って昆布を食べていた。"}, {"t": 298.26666666666665, "x": "その人間は膝まで、腰まで水に"}, {"t": 300.78333333333336, "x": "浸かって私たちの間に立った。"}, {"t": 302.6, "x": "それから手を伸ばして私の母の背中を撫でた。"}, {"t": 305.3666666666667, "x": "母は食べるのをやめなかった。私もやめなかった。"}, {"t": 308.4166666666667, "x": "人間の手はカモメの足とそれほど違わなかった。"}, {"t": 311.28333333333336, "x": "あのころの私たちは、人間を"}, {"t": 313.5, "x": "よけるということを知らなかった。"}, {"t": 315.2, "x": "すぐ横を歩かれても背中に触れられても、"}, {"t": 317.6, "x": "昆布から口を離さなかった。"}, {"t": 319.7, "x": "その人間は浜に上がると、岩に"}, {"t": 322.1666666666667, "x": "座って長いあいだ私たちを見ていた。"}, {"t": 324.4, "x": "手元で何かを動かし続けていた。"}, {"t": 326.55, "x": "キツネがその手元から何かを"}, {"t": 328.25, "x": "くわえて走り去ったことがある。"}, {"t": 329.8833333333333, "x": "人間は追いかけて、戻ってきて、"}, {"t": 332.1333333333333, "x": "また座り込んで手を動かした。"}, {"t": 334.25, "x": "別の日、人間たちは木の舟を出してきた。"}, {"t": 337.1333333333333, "x": "舟の先に一人が立っている。"}, {"t": 338.9, "x": "手には鉄の鉤を持っている。"}, {"t": 340.6, "x": "舟はゆっくりと群れに近づいてきた。"}, {"t": 342.8, "x": "私たちは頭を水に入れたまま食べていた。"}, {"t": 345.4166666666667, "x": "舟をこぐ音は聞こえていた。"}, {"t": 347.2, "x": "けれども、それは頭を上げる理由にはならなかった。"}, {"t": 350.53333333333336, "x": "舟は群れの中をゆっくりと進み、"}, {"t": 352.53333333333336, "x": "並んだ背中を一つずつ見比べていた。"}, {"t": 355.1333333333333, "x": "どの一頭にするかを選んでいたのだろう。"}, {"t": 357.48333333333335, "x": "鉤が一頭の背中に入った。その一頭は暴れた。"}, {"t": 360.68333333333334, "x": "群れ全体が揺れた。まわりの者たちは"}, {"t": 362.9, "x": "その一頭を助けようとした。"}, {"t": 364.6, "x": "ある者は背中で舟を押し上げようとした。"}, {"t": 367.01666666666665, "x": "ある者は綱の上にのしかかった。"}, {"t": 369.01666666666665, "x": "ある者は尾で鉤を叩き落とそうとした。"}, {"t": 371.3833333333333, "x": "何度かはそれでうまくいった。"}, {"t": 373.0833333333333, "x": "けれども綱は浜まで続いていた。"}, {"t": 375.1666666666667, "x": "浜では大勢の人間がその綱を引いていた。"}, {"t": 377.9, "x": "鉤をかけられたのはある雌だった。"}, {"t": 379.93333333333334, "x": "その連れの雄は最後まで舟から離れなかった。"}, {"t": 382.71666666666664, "x": "叩かれても離れなかった。雌が"}, {"t": 384.55, "x": "浜の上に引き上げられて動かなくなった"}, {"t": 386.9, "x": "あとも、雄は波打ち際から沖へ出なかった。"}, {"t": 389.8333333333333, "x": "次の朝、人間たちが刃物を持って"}, {"t": 392.35, "x": "浜に来たとき雄はまだそこにいた。"}, {"t": 394.31666666666666, "x": "その次の朝、人間が一人でやって来たときにも"}, {"t": 397.45, "x": "雄はそこにいた。私はそれを群れの中から見ていた。"}, {"t": 400.5, "x": "何のためにそこにいるのかは分からなかった。"}, {"t": 402.96666666666664, "x": "ただ、そこにいた。その夏、人間たちは浜で壊れた木の塊を"}, {"t": 407.56666666666666, "x": "ばらし、小さな新しい塊を組み立てていた。"}, {"t": 410.71666666666664, "x": "組み上がるとそれを海に浮かべた。"}, {"t": 412.71666666666664, "x": "夏の終わりに、人間たちはその小さな塊に"}, {"t": 415.93333333333334, "x": "乗って沖の向こうへ消えた。"}, {"t": 417.43333333333334, "x": "浜には穴と灰と骨が残った。"}, {"t": 419.51666666666665, "x": "キツネたちが骨のまわりをしばらく歩いていた。"}, {"t": 422.2, "x": "私はそれで終わったのだと思った。"}, {"t": 424.31666666666666, "x": "次の冬、沖から別の木の塊が来た。"}, {"t": 427.31666666666666, "x": "今度のものは壊れていなかった。"}, {"t": 429.2, "x": "中から出てきた人間たちは座り込まなかった。"}, {"t": 431.96666666666664, "x": "すぐに浜を歩き回りキツネを捕った。"}, {"t": 434.23333333333335, "x": "それから海の中の私たちを見た。"}, {"t": 436.43333333333334, "x": "その次の冬も来た。その次の冬も来た。"}, {"t": 439.2, "x": "一七四一年十一月。ロシア帝国の探検船、聖ピョートル号が"}, {"t": 444.98333333333335, "x": "カムチャツカ半島の東に浮かぶ無人の島に乗り上げた。"}, {"t": 448.35, "x": "指揮官はデンマーク生まれの"}, {"t": 450.03333333333336, "x": "航海者ヴィトゥス・ベーリング。"}, {"t": 451.65, "x": "ベーリングはこの年の十二月に島で死んだ。"}, {"t": 454.55, "x": "島はのちに彼の名で呼ばれることになる。"}, {"t": 457.01666666666665, "x": "今のコマンドル諸島のベーリング島である。"}, {"t": 459.5833333333333, "x": "船に乗っていた七十七人のうち、"}, {"t": 461.8, "x": "生きて帰り着いたのは四十六人だった。"}, {"t": 464.8666666666667, "x": "この船に博物学者のゲオルク・"}, {"t": 466.9, "x": "ヴィルヘルム・ステラーが乗っていた。"}, {"t": 468.6333333333333, "x": "この動物がステラーカイギュウと"}, {"t": 470.5, "x": "呼ばれるのは彼の名による。"}, {"t": 472.01666666666665, "x": "ステラーは島に残された十か月のあいだ、自分の小屋の"}, {"t": 475.8833333333333, "x": "戸口から毎日この動物の群れを見ていたと書いている。"}, {"t": 479.1166666666667, "x": "一七四二年七月十二日に捕らえた雌を測り、"}, {"t": 482.8833333333333, "x": "口先から尾の端までを二百九十六インチ、"}, {"t": 486.25, "x": "およそ七・五メートルと記録した。"}, {"t": 488.75, "x": "群れの並び方も、背中のカモメも、三日待った雄も、"}, {"t": 492.75, "x": "すべて彼が自分の目で見て書き残したものである。"}, {"t": 496.0, "x": "生きている姿を観察した記録は、事実上これしかない。"}, {"t": 500.06666666666666, "x": "ステラーは肉の味も書いている。"}, {"t": 502.0833333333333, "x": "煮込むと牛肉と区別しにくい。"}, {"t": 504.1166666666667, "x": "脂は甘いアーモンドの油に近く、"}, {"t": 506.65, "x": "暑い日に外に置いても長く傷まない。"}, {"t": 509.43333333333334, "x": "彼はこの島のまわりにいる数だけでカムチャツカの"}, {"t": 512.3, "x": "住民すべてを養えるだろうとまで書いた。"}, {"t": 514.8, "x": "生き残りの四十六人は船の残骸で小さな船を"}, {"t": 518.2666666666667, "x": "組み、一七四二年八月に島を離れた。"}, {"t": 521.9666666666667, "x": "彼らが持ち帰ったのは、その海が毛皮になる"}, {"t": 525.05, "x": "獣に満ちているという知らせだった。"}, {"t": 527.15, "x": "翌一七四三年には毛皮商人エメリヤン・バソフの"}, {"t": 531.1, "x": "一行がベーリング島で冬を越し、"}, {"t": 533.2333333333333, "x": "大量の毛皮を持ち帰って財を成した。"}, {"t": 536.15, "x": "それが次の船を呼んだ。ラッコの"}, {"t": 538.3166666666667, "x": "毛皮を求める船はカムチャツカから東の"}, {"t": 540.9, "x": "アリューシャン列島へ、さらにアメリカ大陸へと向かう。"}, {"t": 544.7166666666667, "x": "その途中にベーリング島がある。"}, {"t": 546.7833333333333, "x": "一七四三年から一七六三年まで、この島で冬を"}, {"t": 551.9, "x": "越す一行が出なかった冬はほとんど無かった。"}, {"t": 554.55, "x": "一行は八か月から九か月を島で過ごし、そのあいだ"}, {"t": 558.5, "x": "ほぼこの動物の肉だけを食べて暮らした。"}, {"t": 560.9, "x": "やがて遠くへ向かう船は、わざわざこの島で"}, {"t": 564.0666666666667, "x": "冬を越してこの動物の肉を積み込むのが習わしになった。"}, {"t": 567.5666666666667, "x": "隣のメードヌイ島にもこの動物はいた。"}, {"t": 570.1833333333333, "x": "一七四五年から翌年にかけて"}, {"t": 572.8666666666667, "x": "人が初めて渡ったときには浜に姿があった。"}, {"t": 575.85, "x": "九年後の一七五四年には一頭も残っていなかった。"}, {"t": 579.9, "x": "その一七五四年の冬、ベーリング島で"}, {"t": 583.45, "x": "冬を越した人間は百三十人余りにのぼった。"}, {"t": 586.6166666666667, "x": "その中に、政府から銅の調査を"}, {"t": 589.15, "x": "命じられた鉱山技師ヤコブレフがいた。"}, {"t": 591.4666666666667, "x": "ヤコブレフは狩りのやり方を日誌に書いている。"}, {"t": 594.2666666666667, "x": "船の食料にするときは八人が漕ぐ舟から銛を打ち、"}, {"t": 597.7, "x": "仕留めたらすぐ浜に引き上げて切り分ける。"}, {"t": 600.6166666666667, "x": "一頭で三十三人を一か月養えたと彼は書いている。"}, {"t": 604.5166666666667, "x": "だが島に散らばってキツネを捕る猟師たちは違った。"}, {"t": 607.6666666666666, "x": "二人か三人ずつで浜を歩き、岸の近くにいる"}, {"t": 611.1666666666666, "x": "一頭に忍び寄って鉄をはめた棒を突き刺す。"}, {"t": 613.9, "x": "一撃では死なない。傷を負った一頭は沖へ出てそこで死ぬ。"}, {"t": 617.85, "x": "その日のうちに浜へ流れ着けばよい。"}, {"t": 620.1333333333333, "x": "多くは食べられない状態で流れ着くか、"}, {"t": 622.6833333333333, "x": "どこかへ流されていった。ヤコブレフはこのやり方では"}, {"t": 626.2333333333333, "x": "この動物がすぐにいなくなると考えた。"}, {"t": 628.6666666666666, "x": "一七五五年、カムチャツカに戻った彼はこうした殺し方を"}, {"t": 633.3166666666667, "x": "禁じる命令を出してほしいと当局に訴え出た。"}, {"t": 636.4, "x": "ベーリング島がメードヌイ島と同じように"}, {"t": 638.8166666666667, "x": "荒らされることのないように、という訴えである。"}, {"t": 641.7666666666667, "x": "訴えは聞き入れられなかった。"}, {"t": 643.7666666666667, "x": "一八八七年、この島に一年半滞在したアメリカの"}, {"t": 648.35, "x": "博物学者が残された記録から計算を試みている。"}, {"t": 651.7833333333333, "x": "発見された時の数は多く見ても千五百頭ほど。"}, {"t": 655.1833333333333, "x": "一七六三年までに殺された数は、無駄に"}, {"t": 658.9166666666666, "x": "死なせた分を多く見積もれば二千四百頭を超える。"}, {"t": 662.1, "x": "どちらも推計であり確かめる方法は無い。"}, {"t": 664.9, "x": "一七六三年を過ぎると、島を"}, {"t": 668.0333333333333, "x": "訪れる船の記録はまばらになる。"}, {"t": 670.1, "x": "一八〇二年、ロシアの探検隊に同行した"}, {"t": 673.5666666666667, "x": "イギリス人マーティン・ザウアーは、最後の"}, {"t": 676.1333333333333, "x": "一頭は一七六八年にベーリング島で殺され、"}, {"t": 679.6833333333333, "x": "その後は一頭も見られていないと書いた。"}, {"t": 682.3333333333334, "x": "一七四一年から数えて二十七年目にあたる。"}, {"t": 686.2, "x": "ただしザウアー自身がそれを見たわけではない。"}, {"t": 688.9, "x": "一七七二年にこの島で冬を越した"}, {"t": 691.8333333333334, "x": "ドミトリー・ブラギンは、島の動物を"}, {"t": 694.3833333333333, "x": "書き並べた一覧にこの動物を入れなかった。"}, {"t": 697.15, "x": "一七六八年は、そのあいだのどこかで最後の"}, {"t": 701.0, "x": "一頭が死んだことを示す年として使われている。"}, {"t": 703.8833333333333, "x": "殺されたことだけが原因だったのかに"}, {"t": 706.1166666666667, "x": "ついては別の見方もある。二〇二一年に"}, {"t": 708.8333333333334, "x": "骨のゲノムを調べた研究は、"}, {"t": 710.7833333333333, "x": "この最後の群れの遺伝的な多様性が、"}, {"t": 713.55, "x": "四千年前に北極海の島で消えたマンモスの"}, {"t": 716.9333333333333, "x": "最後の群れと同じくらい低かったと報告した。"}, {"t": 719.65, "x": "人間が来る前から減り始めていたという見方である。"}, {"t": 722.8333333333334, "x": "一方でラッコが狩られて減り、ウニが増えて"}, {"t": 725.7666666666667, "x": "昆布が減ったことが追い打ちをかけたという説もある。"}, {"t": 728.7666666666667, "x": "どちらもまだ議論が続いている。"}, {"t": 730.7666666666667, "x": "群れは少しずつ短くなっていった。"}, {"t": 732.8166666666667, "x": "最初に気づいたのは並び方だった。"}, {"t": 734.9666666666667, "x": "子どもを真ん中に置いても外側を"}, {"t": 736.95, "x": "囲む大きな者の数が足りない。横が空く。"}, {"t": 739.6333333333333, "x": "後ろが空く。それでも私たちは同じ並び方を続けた。"}, {"t": 743.2166666666667, "x": "ほかの並び方を知らなかった。冬ごとに木の塊が来た。"}, {"t": 746.7666666666667, "x": "人間たちは浜に穴を作り、煙を上げ、舟を出した。"}, {"t": 750.9333333333333, "x": "背中を撫でに来る人間はもういなかった。"}, {"t": 753.3833333333333, "x": "春の浜に打ち上げられている体の数は前より多かった。"}, {"t": 756.9, "x": "その中には背中に深い傷のある体があった。"}, {"t": 759.7333333333333, "x": "人間はそれを引き上げなかった。"}, {"t": 761.6166666666667, "x": "キツネが集まりカモメが集まった。"}, {"t": 763.7166666666667, "x": "私の父はある冬に群れから消えた。"}, {"t": 766.0166666666667, "x": "母はそのあとの冬に消えた。どちらも見ていない。"}, {"t": 768.9833333333333, "x": "いなくなったことにあとで気づいただけだ。"}, {"t": 771.1333333333333, "x": "私の連れが鉤をかけられたのは夏の初めだった。"}, {"t": 774.15, "x": "私は舟に体を寄せた。背中で押し上げようとした。"}, {"t": 777.5333333333333, "x": "綱の上にのしかかった。尾で鉤を叩いた。"}, {"t": 780.2, "x": "鉤は外れなかった。綱は浜へ続いていた。"}, {"t": 783.1166666666667, "x": "私は連れが引き上げられた浜のそばにいた。"}, {"t": 785.7333333333333, "x": "人間が何度か叩いた。私は沖へ出なかった。"}, {"t": 788.7666666666667, "x": "子どものころ群れの真ん中から見ていた"}, {"t": 790.7833333333333, "x": "雄のことを、そのとき思い出した。"}, {"t": 793.05, "x": "あのとき分からなかったことが分かったわけではない。"}, {"t": 795.7833333333333, "x": "ただ、あの雄と同じ場所に自分がいた。"}, {"t": 798.5166666666667, "x": "次の朝、刃物を持った人間たちが来た。"}, {"t": 801.3833333333333, "x": "私はそこでようやく沖へ出た。"}, {"t": 803.3833333333333, "x": "群れの残りはそれからもう少しのあいだいた。"}, {"t": 805.8666666666667, "x": "鉤がかかった者を助けに行く数も減った。"}, {"t": 808.3666666666667, "x": "以前は何頭もで舟を押し上げた。"}, {"t": 810.55, "x": "今は二頭か三頭で押しても舟は傾きもしない。"}, {"t": 813.6166666666667, "x": "助けに寄った者が、そのまま次の鉤を受けることもあった。"}, {"t": 817.3666666666667, "x": "子どもを真ん中に置くことはもうしなくなった。"}, {"t": 819.8666666666667, "x": "真ん中に置く子どもがいなかった。"}, {"t": 821.75, "x": "そのうちに一頭で昆布を噛んでいる"}, {"t": 823.8, "x": "時間のほうが長くなった。一頭で"}, {"t": 825.9333333333333, "x": "食べていても、頭を上げるのは息をするときだけだった。"}, {"t": 829.2833333333333, "x": "群れの中にいたころと同じやり方しか、私は知らなかった。"}, {"t": 833.1166666666667, "x": "頭を上げて息を吹き出すと、"}, {"t": 834.8, "x": "どこかで別の一頭が同じ音を立てる。"}, {"t": 837.5166666666667, "x": "その音が私たちの交わせるただ一つの合図だった。"}, {"t": 840.5833333333334, "x": "声を持たない私たちにとって、"}, {"t": 842.45, "x": "息の音がそこにいるという知らせだった。"}, {"t": 845.05, "x": "ある季節から、その音が返ってこなくなった。"}, {"t": 847.9166666666666, "x": "川の口まで行った。次の川の口まで行った。"}, {"t": 850.85, "x": "浜に沿って知っている場所を全部回った。"}, {"t": 853.3333333333334, "x": "昆布はあった。仲間はいなかった。"}, {"t": 855.5666666666667, "x": "私はそれでも元の場所に戻って昆布を噛んだ。"}, {"t": 858.4833333333333, "x": "食べることをやめる理由はどこにも無かった。"}, {"t": 860.9333333333333, "x": "浜には私の噛み残した根と茎が打ち上げられた。"}, {"t": 863.9666666666667, "x": "一頭分の小さな山だ。以前は群れの分の"}, {"t": 866.8166666666667, "x": "山が、浜に沿って長く続いていた。"}, {"t": 869.35, "x": "背中にはまだカモメが乗った。"}, {"t": 871.1166666666667, "x": "一羽か二羽だ。以前は背中が白く見えるほどとまっていた。"}, {"t": 874.7666666666667, "x": "今はその一羽か二羽が、ほかに行く"}, {"t": 877.15, "x": "背中が無いので私の背中にだけ来ていた。"}, {"t": 879.5833333333334, "x": "冬が来て痩せた。氷が流れてきた。"}, {"t": 882.0166666666667, "x": "岩に打ちつけられた。春が来た。"}, {"t": 884.15, "x": "木の塊は来ない冬のほうが多くなった。"}, {"t": 886.6833333333333, "x": "来ても大きくはなかった。降りてくる人間も少ない。"}, {"t": 889.7333333333333, "x": "浜に散らばってキツネばかりを追っていた。"}, {"t": 892.05, "x": "舟は出さなかった。その日は潮が満ちていた。"}, {"t": 894.9333333333333, "x": "私は川の口のそばで浜のすぐ近くまで寄っていた。"}, {"t": 898.2, "x": "昆布の根を噛んでいた。頭は水の中だった。"}, {"t": 901.0833333333334, "x": "背中に鉄が入った。人間は二人だった。舟は無い。"}, {"t": 904.9833333333333, "x": "浜から水の中を歩いて来て長い棒を突き出していた。"}, {"t": 908.1333333333333, "x": "私はその足音に気づかなかった。"}, {"t": 910.3166666666667, "x": "頭を上げていなかったからだ。"}, {"t": 912.0666666666667, "x": "人間たちは、浜に積もった私の"}, {"t": 914.4333333333333, "x": "根と茎の山をたどって来たのかもしれない。"}, {"t": 916.7333333333333, "x": "私は沖へ出た。傷を負ったら沖へ出る。"}, {"t": 919.4166666666666, "x": "少し離れたところで休む。痛みが"}, {"t": 921.4166666666666, "x": "遠くなったらまた戻ってくる。"}, {"t": 923.2833333333333, "x": "私たちはずっとそうしてきた。"}, {"t": 925.0833333333334, "x": "人間の手から逃れた者たちも、"}, {"t": 927.0, "x": "そうやって群れに戻ってきた。"}, {"t": 928.9333333333333, "x": "沖は静かだった。頭を上げて息を吹き出した。"}, {"t": 931.9333333333333, "x": "音はどこからも返ってこなかった。"}, {"t": 933.9166666666666, "x": "背中にいたカモメが一羽、飛び立った。"}, {"t": 936.5333333333333, "x": "頭を上げるたびに浜が少しずつ遠くなる。"}, {"t": 939.1333333333333, "x": "体が重くなっていく。水が冷たいのか"}, {"t": 941.7166666666667, "x": "私の体が冷たいのか、もう分からない。"}, {"t": 944.4666666666667, "x": "私の体がこのあと浜に着くのか、どこかへ"}, {"t": 947.4166666666666, "x": "流されていくのか、私には分からない。"}, {"t": 949.9666666666667, "x": "もう一度頭を上げた。息を長く吐いた。"}, {"t": 957.6666666666666, "x": "最後の一頭の性別も死んだ季節も、"}, {"t": 960.1833333333333, "x": "仕留めた人間の名も記録には残っていない。"}, {"t": 963.2, "x": "この動物の柔らかい体は何一つ残っていない。"}, {"t": 966.5, "x": "確かに本物と言える皮も肉も、"}, {"t": 968.6833333333333, "x": "今のところ見つかっていない。"}, {"t": 970.6666666666666, "x": "ステラーは子どもの骨格と干し草を"}, {"t": 972.9666666666667, "x": "詰めた皮を持ち帰ろうとした。"}, {"t": 974.7833333333333, "x": "だが帰りの船が小さすぎて積めなかった。"}, {"t": 977.55, "x": "残ったのは骨だけである。二〇〇六年の"}, {"t": 980.2833333333333, "x": "時点で、ほぼ全身がそろった骨格が"}, {"t": 982.7166666666667, "x": "二十七体、頭の骨が六十二点確認されている。"}, {"t": 986.6333333333333, "x": "その多くは二頭から十六頭分の骨を組み合わせたものだ。"}, {"t": 990.4333333333333, "x": "ヘルシンキやワシントン、コペンハーゲンなどの"}, {"t": 993.4333333333333, "x": "博物館に、組み上げられた骨格が立っている。"}, {"t": 996.6166666666667, "x": "二〇一七年にはベーリング島の海岸で、"}, {"t": 999.4666666666667, "x": "地面から突き出たあばら骨をきっかけに"}, {"t": 1002.0666666666667, "x": "長さ五・二メートルの骨格が掘り出された。"}, {"t": 1004.7666666666667, "x": "頭の骨は見つからなかった。"}, {"t": 1006.7833333333333, "x": "生きていたころは六メートルほどあったと推定されている。"}, {"t": 1010.05, "x": "骨格は今、同じ島のニコリスコエ村の博物館にある。"}, {"t": 1014.0666666666667, "x": "体の色ははっきりしていない。"}, {"t": 1016.0333333333333, "x": "ステラーは皮を黒いと書いた。"}, {"t": 1018.05, "x": "白いまだら模様のある個体がいたという記述もある。"}, {"t": 1021.1666666666666, "x": "生きた姿を描いた絵として残るのは、一七四四年に"}, {"t": 1025.4333333333334, "x": "作られた地図の隅の小さな図などに限られる。"}, {"t": 1028.2, "x": "二〇二二年、骨から取り出した遺伝子を調べた研究が、"}, {"t": 1032.4, "x": "木の皮のような皮膚の手がかりを見つけた。"}, {"t": 1035.1833333333334, "x": "皮膚の外側を作る遺伝子のいくつかが働かなくなっていた。"}, {"t": 1038.9666666666667, "x": "人間では皮膚の病気の原因になる変化が、冷たい"}, {"t": 1042.7, "x": "海では体を守る方向に働いていた可能性がある。"}, {"t": 1046.0666666666666, "x": "北海道の滝川市では一九八〇年に、"}, {"t": 1049.2333333333333, "x": "同じ仲間の化石が川底から見つかっている。"}, {"t": 1052.4166666666667, "x": "およそ五百万年から四百万年前の海にいた別の種である。"}, {"t": 1056.6166666666666, "x": "この動物をよみがえらせたいと"}, {"t": 1058.5333333333333, "x": "表明している企業や団体もある。"}, {"t": 1060.6833333333334, "x": "近い親戚のジュゴンの遺伝子を書き換える計画だが、"}, {"t": 1063.9166666666667, "x": "生まれるまで育てるには人工の子宮が要るとされる。"}, {"t": 1067.4166666666667, "x": "今のところ生きた一頭はどこにもいない。"}, {"t": 1069.8333333333333, "x": "ステラーはこの動物に声は無いと書いた。"}, {"t": 1072.55, "x": "鳴き声を上げることはなく、"}, {"t": 1074.2333333333333, "x": "聞こえるのは重い息づかいだけ。"}, {"t": 1076.55, "x": "傷を負ったときには、ため息をつくように息を吐いた、と。"}, {"t": 1080.8, "x": "それが、人間の耳が聞いたこの種のただ一つの声である。"}], "w": 720, "h": 405, "n_cuts": 397, "noimage": false};

  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
