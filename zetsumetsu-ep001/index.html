<script>
const D={"name": "絶滅遺言 ep001", "file": "ep001", "dur": 1024.3333125, "segs": [], "subs": [{"t": 0.0, "x": "床の砂は冷たかった。"}, {"t": 1.5666666666666667, "x": "私はそこに横たわっていた。"}, {"t": 3.4166666666666665, "x": "止まり木までは、もう届かない。"}, {"t": 5.533333333333333, "x": "何年か前から私の体は思うように動かなくなっていた。"}, {"t": 9.166666666666666, "x": "人間は低いところに新しい止まり木を作ってくれた。"}, {"t": 12.35, "x": "その低い止まり木にさえ、その日の私は上がれなかった。"}, {"t": 16.016666666666666, "x": "天井は鉄の網だ。"}, {"t": 17.433333333333334, "x": "網の目は四角い。"}, {"t": 18.583333333333332, "x": "私が知っている空というのは、"}, {"t": 20.4, "x": "その四角の向こう側にあるものだけだった。"}, {"t": 23.066666666666666, "x": "外はまだ明るかった。"}, {"t": 24.533333333333335, "x": "九月の初めの光だ。"}, {"t": 26.083333333333332, "x": "私の名はマーサ。"}, {"t": 27.316666666666666, "x": "人間がそう呼んだ。"}, {"t": 28.583333333333332, "x": "私が息を止めた時刻は人間の手で書き残された。"}, {"t": 31.833333333333332, "x": "一九一四年九月一日、午後一時。"}, {"t": 35.15, "x": "その瞬間、私と同じ鳥はこの地上から一羽もいなくなった。"}, {"t": 39.4, "x": "私が生きていた世界は、鉄の網の内側だった。"}, {"t": 42.81666666666667, "x": "広さは私の翼を広げて何度か進めば端に着く程度だ。"}, {"t": 46.68333333333333, "x": "床には砂が敷いてある。"}, {"t": 48.21666666666667, "x": "上には止まり木が渡してある。"}, {"t": 49.983333333333334, "x": "片側に水の器があって、もう片側に餌の器がある。"}, {"t": 54.03333333333333, "x": "それが私の世界の全部だった。"}, {"t": 56.15, "x": "朝になると人間が来て器を満たす。"}, {"t": 58.46666666666667, "x": "夕方にはまた来て水を取り替える。"}, {"t": 60.6, "x": "その二回のあいだが私にとっての一日だった。"}, {"t": 63.5, "x": "網の目から外が見える。"}, {"t": 65.05, "x": "木が見える。"}, {"t": 65.86666666666666, "x": "人が歩く道が見える。"}, {"t": 67.4, "x": "もっと遠くには、別の檻と別の鳥がいる。"}, {"t": 70.35, "x": "声はそこまで届く。"}, {"t": 71.75, "x": "けれども私に返事をする声はそこに無かった。"}, {"t": 74.55, "x": "音は一日じゅう絶えない。"}, {"t": 76.16666666666667, "x": "どこか遠くで大きな獣が低く唸る。"}, {"t": 78.55, "x": "別の方角で甲高い鳥が続けざまに鳴く。"}, {"t": 81.31666666666666, "x": "人間の足音と話し声が朝から"}, {"t": 83.55, "x": "夕方まで途切れずに網の外を流れていく。"}, {"t": 86.13333333333334, "x": "私はその音の並び方で、今が"}, {"t": 88.6, "x": "一日のどのあたりかを知っていた。"}, {"t": 90.45, "x": "時計というものを人間は持っている。"}, {"t": 92.66666666666667, "x": "私は音を持っていた。"}, {"t": 94.16666666666667, "x": "餌の中身はいつも同じだった。"}, {"t": 96.03333333333333, "x": "硬い粒だ。"}, {"t": 96.95, "x": "器に入れられた順に食べる。"}, {"t": 98.8, "x": "多い日も少ない日も無い。"}, {"t": 100.33333333333333, "x": "探す必要が無いというのはたぶん楽なことなのだと思う。"}, {"t": 103.6, "x": "私は自分の姿を知らない。"}, {"t": 105.51666666666667, "x": "水の器の表面で見ただけだ。"}, {"t": 107.55, "x": "胸のあたりが赤みを帯びていて、"}, {"t": 109.4, "x": "背中は青みがかった灰色をしている。"}, {"t": 111.98333333333333, "x": "そういう鳥だった。"}, {"t": 113.16666666666667, "x": "飛ぶことはできた。"}, {"t": 114.3, "x": "網の端から端までなら羽ばたいて渡れた。"}, {"t": 116.76666666666667, "x": "ただ、それは飛んだと言えるのだろうか。"}, {"t": 119.26666666666667, "x": "翼を開き切る前に向こう側の網に着いてしまう。"}, {"t": 122.41666666666667, "x": "私はここで生まれた。"}, {"t": 123.83333333333333, "x": "だから外の世界のことを何も知らない。"}, {"t": 126.16666666666667, "x": "人間が語る昔の話も私には届かない。"}, {"t": 129.11666666666667, "x": "私が持っている記憶は、この四角の中のものだけだ。"}, {"t": 132.56666666666666, "x": "森を見たことはない。"}, {"t": 133.85, "x": "地面に落ちた木の実をついばんだことはない。"}, {"t": 136.23333333333332, "x": "風に乗るという感覚を私は一度も持っていない。"}, {"t": 139.33333333333334, "x": "翼は付いていた。"}, {"t": 140.61666666666667, "x": "使い方は教わる相手がいなかった。"}, {"t": 142.83333333333334, "x": "季節は網の目を通ってやってくる。"}, {"t": 144.96666666666667, "x": "春になると外の木に葉が出る。"}, {"t": 146.8, "x": "夏は床の砂が熱を持つ。"}, {"t": 148.65, "x": "秋には葉の色が変わって風に混ざって落ちてくる。"}, {"t": 151.53333333333333, "x": "冬は器の水に薄い氷が張る。"}, {"t": 153.85, "x": "それを四十回近く数えた、と人間は言う。"}, {"t": 157.05, "x": "私は数えていない。"}, {"t": 158.46666666666667, "x": "若いころはこの檻にほかにも同じ鳥がいた。"}, {"t": 161.13333333333333, "x": "何羽いたかは覚えていない。"}, {"t": 162.86666666666667, "x": "ただ、止まり木が混んでいた"}, {"t": 164.71666666666667, "x": "時期があったことは覚えている。"}, {"t": 166.36666666666667, "x": "羽根がぶつかる音がした。"}, {"t": 167.9, "x": "餌の器を横から押しのけられたこともある。"}, {"t": 170.53333333333333, "x": "そういう音が、少しずつ減っていった。"}, {"t": 173.05, "x": "卵を産んだことはある。"}, {"t": 174.53333333333333, "x": "温めもした。"}, {"t": 175.51666666666668, "x": "けれども私の卵から雛が出たことは一度もなかった。"}, {"t": 178.86666666666667, "x": "人間が器を替えにくるとき、卵を見て何かを話していた。"}, {"t": 182.98333333333332, "x": "何を言っていたのかは分からない。"}, {"t": 184.83333333333334, "x": "ある年、私の体の片側が急にうまく動かなくなった。"}, {"t": 188.9, "x": "翼も脚も思ったところへ行かない。"}, {"t": 191.1, "x": "止まり木に上がろうとして落ちた。"}, {"t": 192.9, "x": "何度か落ちた。"}, {"t": 193.86666666666667, "x": "人間はそれを見て低いところに新しい止まり木を作った。"}, {"t": 197.28333333333333, "x": "それ以来、私は高いほうの止まり木を使っていない。"}, {"t": 200.83333333333334, "x": "私は自分が何なのかを最後まで人間の口から聞いていた。"}, {"t": 204.5, "x": "訳は分からない。"}, {"t": 205.61666666666667, "x": "ただ、私を見る目つきだけは途中から変わった。"}, {"t": 208.85, "x": "人間が来た日というものを、私は覚えていない。"}, {"t": 212.13333333333333, "x": "私が目を開けたときには、もう人間はそこにいた。"}, {"t": 215.43333333333334, "x": "器を持ってくるのも人間だ。"}, {"t": 217.35, "x": "網を直すのも人間だ。"}, {"t": 218.96666666666667, "x": "私にとって人間は空や木と同じように"}, {"t": 221.5, "x": "最初からあるものだった。"}, {"t": 222.86666666666667, "x": "だから私は人間を恨んでいない。"}, {"t": 225.08333333333334, "x": "恨む理由を、私は自分の目で見ていない。"}, {"t": 228.16666666666666, "x": "人間は毎日やってきた。"}, {"t": 229.83333333333334, "x": "器を持つ人間と、何も持たずに"}, {"t": 232.36666666666667, "x": "立っているだけの人間がいる。"}, {"t": 233.96666666666667, "x": "立っているだけの人間は、網の前に来て"}, {"t": 236.66666666666666, "x": "しばらく私を見て、それから去っていく。"}, {"t": 239.28333333333333, "x": "次の人間が来る。"}, {"t": 240.56666666666666, "x": "それの繰り返しだ。"}, {"t": 241.83333333333334, "x": "ある時期から、その数がはっきり増えた。"}, {"t": 244.43333333333334, "x": "網の外に板が立てられた。"}, {"t": 246.1, "x": "文字が書いてある。"}, {"t": 247.16666666666666, "x": "私には読めない。"}, {"t": 248.38333333333333, "x": "けれども、その板が立ってから"}, {"t": 250.41666666666666, "x": "立ち止まる人間の数が変わった。"}, {"t": 252.33333333333334, "x": "指をさす人間が増えた。"}, {"t": 253.98333333333332, "x": "声を出さずに長く見ている人間が増えた。"}, {"t": 256.5833333333333, "x": "黒い箱を三本の脚に乗せて運んでくる人間もいた。"}, {"t": 259.8833333333333, "x": "箱の前で布をかぶってじっとしている。"}, {"t": 262.15, "x": "それから何かの音がしてまた布を外す。"}, {"t": 264.56666666666666, "x": "私はその間ずっと動かずにいた。"}, {"t": 266.85, "x": "動かずにいたのは、そのころの私には、"}, {"t": 269.45, "x": "動くこと自体が難しかったからだ。"}, {"t": 271.96666666666664, "x": "同じ人間が何度も来るようになった。"}, {"t": 274.23333333333335, "x": "顔は覚えない。"}, {"t": 275.31666666666666, "x": "ただ、立ち止まる位置とそこにいる時間の"}, {"t": 277.95, "x": "長さは人によって決まっている。"}, {"t": 279.68333333333334, "x": "決まった位置に決まった長さだけ立つ人間が何人かいた。"}, {"t": 282.9166666666667, "x": "網を軽く叩く人間もいた。"}, {"t": 284.8, "x": "私が動かないので動かそうとしたのだと思う。"}, {"t": 287.6, "x": "私は動かなかった。"}, {"t": 289.01666666666665, "x": "悪気があってのことではないのだろう。"}, {"t": 291.1166666666667, "x": "悪気の有る無しを私は見分けられない。"}, {"t": 293.48333333333335, "x": "人間は私に近づきすぎることはなかった。"}, {"t": 296.1166666666667, "x": "網があるからだ。"}, {"t": 297.2, "x": "ただ、網ごしに手を伸ばしてくる者はいた。"}, {"t": 299.96666666666664, "x": "手の先には何も無い。"}, {"t": 301.3833333333333, "x": "何を渡したかったのかは分からない。"}, {"t": 303.46666666666664, "x": "私を見に来る人間のうち何人かは長いあいだ動かなかった。"}, {"t": 307.2, "x": "子どもを抱えた人間が、子どもに"}, {"t": 309.5833333333333, "x": "何かを言い聞かせていることもあった。"}, {"t": 311.6, "x": "子どもは私を見てすぐ別のほうを向いた。"}, {"t": 314.1333333333333, "x": "子どもにとって私はただの灰色の鳥だ。"}, {"t": 316.73333333333335, "x": "それでいいと思う。"}, {"t": 317.9, "x": "檻の中の話をする。"}, {"t": 319.4, "x": "私が若いころ、この檻には雄がいた。"}, {"t": 322.23333333333335, "x": "二羽いた時期を覚えている。"}, {"t": 323.81666666666666, "x": "先に一羽が動かなくなった。"}, {"t": 325.7, "x": "朝、器を満たしに来た人間が、床にいる"}, {"t": 329.05, "x": "その一羽を見つけて手に取って運び出した。"}, {"t": 331.35, "x": "それが春のことだったと後で人間は記録に残している。"}, {"t": 334.73333333333335, "x": "残った一羽とは、それから一年以上を一緒に過ごした。"}, {"t": 338.3666666666667, "x": "止まり木の端と端にいた。"}, {"t": 339.98333333333335, "x": "近づくことも離れすぎることもなかった。"}, {"t": 342.3333333333333, "x": "その一羽も夏のある日に床にいた。"}, {"t": 344.53333333333336, "x": "人間が来て、同じように運び出した。"}, {"t": 347.2, "x": "その日からこの檻にいる私と同じ鳥は、私だけになった。"}, {"t": 351.03333333333336, "x": "私は鳴いた。"}, {"t": 352.05, "x": "返事は無い。"}, {"t": 352.9166666666667, "x": "別の檻の鳥は鳴き返してくるが、あれは私の声ではない。"}, {"t": 356.78333333333336, "x": "私の声に返ってくる私の声というものが"}, {"t": 359.55, "x": "この世界から消えた。"}, {"t": 360.75, "x": "それが何を意味するのかを私は知らなかった。"}, {"t": 363.48333333333335, "x": "ただ、止まり木が広くなったとだけ思っていた。"}, {"t": 366.48333333333335, "x": "人間はそのあと、私の相手を探したらしい。"}, {"t": 369.65, "x": "器を替えにくる人間が、網の外の"}, {"t": 372.3333333333333, "x": "人間とその話をしているのを何度も聞いた。"}, {"t": 374.93333333333334, "x": "言葉は分からない。"}, {"t": 376.15, "x": "ただ、私のほうを指しながら"}, {"t": 378.2, "x": "話していたから私の話だったのだと思う。"}, {"t": 380.73333333333335, "x": "探しても、誰も連れてこなかった。"}, {"t": 383.15, "x": "一年たっても連れてこなかった。"}, {"t": 385.03333333333336, "x": "二年たっても連れてこなかった。"}, {"t": 386.8, "x": "四年のあいだ、誰も。"}, {"t": 388.55, "x": "今なら分かる。"}, {"t": 389.55, "x": "連れてくる相手が、どこにも残っていなかったのだ。"}, {"t": 392.6333333333333, "x": "ここからは、彼女の目が届かなかった場所の話をする。"}, {"t": 396.3833333333333, "x": "リョコウバトはかつて北アメリカで最も数の多い鳥だった。"}, {"t": 400.01666666666665, "x": "総個体数は三十億から五十億羽と推定されている。"}, {"t": 403.8833333333333, "x": "北アメリカの陸に住む鳥のうち二十五から"}, {"t": 406.45, "x": "四十パーセントを占めていたという推定もある。"}, {"t": 409.18333333333334, "x": "十九世紀の初め、鳥類学者アレクサンダー・"}, {"t": 412.8, "x": "ウィルソンはケンタッキー州"}, {"t": 414.4166666666667, "x": "フランクフォート付近で一つの群れを見た。"}, {"t": 416.8833333333333, "x": "彼はその群れの幅と長さと密度から個体数を計算し、"}, {"t": 420.56666666666666, "x": "二十二億三千二十七万二千羽という数字を出した。"}, {"t": 424.56666666666666, "x": "そのうえで彼はこれを控えめな数だと書き添えている。"}, {"t": 427.78333333333336, "x": "一八七一年、ウィスコンシン州に作られた営巣地は"}, {"t": 432.23333333333335, "x": "約二千二百平方キロメートルに広がっていた。"}, {"t": 435.25, "x": "そこで巣を作っていた成鳥は"}, {"t": 437.2, "x": "およそ一億三千六百万羽と見積もられている。"}, {"t": 440.3333333333333, "x": "ただしこの鳥は、その数に見合った増え方をしなかった。"}, {"t": 444.0833333333333, "x": "一つの巣に産む卵は一個である。"}, {"t": 446.35, "x": "年に一度。"}, {"t": 447.3333333333333, "x": "抱卵はおよそ二週間。"}, {"t": 449.1333333333333, "x": "雛が巣を離れるまで、全部で三十日ほどしかかからない。"}, {"t": 453.21666666666664, "x": "速いが、数は増えない。"}, {"t": 455.26666666666665, "x": "一組の親から一年に一羽だ。"}, {"t": 457.53333333333336, "x": "そして彼らは巨大な集団でしか行動しなかった。"}, {"t": 460.78333333333336, "x": "集団でいることそのものが、この鳥の生き方だった。"}, {"t": 464.3833333333333, "x": "数が減った後で回復できなかった理由をここに"}, {"t": 467.1166666666667, "x": "求める説明が有力とされているが、それが"}, {"t": 470.23333333333335, "x": "どう働いたのかまで確かめられているわけではない。"}, {"t": 473.03333333333336, "x": "十九世紀の半ば、二つの技術がこの鳥の上に重なった。"}, {"t": 477.3333333333333, "x": "電信と、鉄道である。"}, {"t": 479.4, "x": "営巣地が見つかると、その場所は電信で各地に伝えられた。"}, {"t": 483.5833333333333, "x": "それを受け取った職業の狩猟者たちが鉄道で現地に集まる。"}, {"t": 487.5, "x": "撃たれ網で捕られた鳥は樽に"}, {"t": 489.25, "x": "詰められて同じ鉄道で都市へ運ばれていく。"}, {"t": 491.9166666666667, "x": "一八七一年のウィスコンシンの新聞は、"}, {"t": 495.1666666666667, "x": "その現場をこう書いている。"}, {"t": 497.1166666666667, "x": "到着する列車のほとんどが猟師か罠師を運んでくる。"}, {"t": 500.53333333333336, "x": "ホテルは満室になり樽屋は樽作りに追われている。"}, {"t": 503.68333333333334, "x": "男も女も子どもも鳥を詰め樽を満たしている。"}, {"t": 506.6, "x": "そして鉄道沿線のあらゆる場所へ、"}, {"t": 508.8, "x": "ミルウォーキーへ、シカゴへ、セントルイスへ、"}, {"t": 512.8333333333334, "x": "シンシナティへ、フィラデルフィアへ、"}, {"t": 515.4333333333333, "x": "ニューヨークへ、ボストンへ送り出されていく。"}, {"t": 518.8, "x": "規模を数字で見る。"}, {"t": 520.0333333333333, "x": "一八六九年、ミシガン州ハートフォード。"}, {"t": 523.7833333333333, "x": "ここからは四十日間にわたって毎日三両分の貨車が出た。"}, {"t": 527.8, "x": "合計は千百万羽を超えたと記録されている。"}, {"t": 530.8, "x": "一八七八年、ミシガン州ペトスキー。"}, {"t": 534.5166666666667, "x": "知られている限り最後の大規模な営巣地だった。"}, {"t": 537.6166666666667, "x": "長さおよそ六十四キロメートル、幅は五キロから十六キロ。"}, {"t": 542.0166666666667, "x": "ここでは一日に五万羽が殺され、それが五か月近く続いた。"}, {"t": 546.4833333333333, "x": "その夏の死亡数は約百五十万羽と見積もられている。"}, {"t": 550.1833333333333, "x": "これとは別に、八万三百五十二羽が生きたまま籠に"}, {"t": 554.0, "x": "詰められて射撃の的として出荷された。"}, {"t": 556.2833333333333, "x": "法はどうだったのか。"}, {"t": 557.6666666666666, "x": "一八五七年、オハイオ州議会上院の"}, {"t": 561.3166666666667, "x": "特別委員会はリョコウバトを保護する法案に"}, {"t": 564.1, "x": "ついて次のような報告を出している。"}, {"t": 566.25, "x": "リョコウバトに保護は必要ない。"}, {"t": 568.2166666666667, "x": "驚くほど多産であり、北方の広大な森を繁殖地に"}, {"t": 571.9666666666667, "x": "持ち、餌を求めて何百マイルも移動する。"}, {"t": 575.0166666666667, "x": "今日ここにいて明日は別の場所にいる。"}, {"t": 577.3166666666667, "x": "並の破壊では、その数を減らすことはできない。"}, {"t": 580.6333333333333, "x": "これは嘘をつくために書かれた文章ではない。"}, {"t": 583.3833333333333, "x": "当時その判断を疑う材料が誰の"}, {"t": 585.85, "x": "手元にもなかった、ということである。"}, {"t": 588.2333333333333, "x": "一八九七年、ミシガン州議会にリョコウバトの"}, {"t": 592.3, "x": "十年間の禁猟を求める法案が出された。"}, {"t": 595.15, "x": "このとき野生の群れはすでにほとんど残っていなかった。"}, {"t": 598.4333333333333, "x": "一九〇〇年、アメリカ合衆国はレイシー法を"}, {"t": 601.9666666666667, "x": "成立させ、違法に捕獲された野生動物を"}, {"t": 605.25, "x": "州をまたいで輸送することを禁じた。"}, {"t": 607.5, "x": "この法律はその後の多くの鳥を救っている。"}, {"t": 610.4, "x": "リョコウバトには間に合わなかった。"}, {"t": 612.4833333333333, "x": "同じ時期、ブナや堅果類の生える低地の"}, {"t": 615.4166666666666, "x": "森が次々に農地へ変えられていった。"}, {"t": 617.6666666666666, "x": "撃たれることと、巣を作る場所が"}, {"t": 619.8666666666667, "x": "無くなることが同時に進んだ。"}, {"t": 621.5666666666667, "x": "野生の最後の一羽がどれだったのかは、"}, {"t": 624.1, "x": "今も決着していない。"}, {"t": 625.85, "x": "オハイオ州パイク郡で一九〇〇年三月二十四日に"}, {"t": 629.5333333333333, "x": "少年が撃った一羽は、剥製師がガラスの"}, {"t": 632.5166666666667, "x": "目を切らして片目に黒い靴のボタンを"}, {"t": 634.8333333333334, "x": "入れたことから「バトンズ」と呼ばれ、現在も"}, {"t": 638.8, "x": "オハイオ・ヒストリー・コネクションに収蔵されている。"}, {"t": 641.55, "x": "ただし同館自身がこれより後の日付で採集された標本の"}, {"t": 645.4, "x": "記録が見つかっていることを公表している。"}, {"t": 647.8333333333334, "x": "インディアナ州は一九〇二年四月三日に"}, {"t": 650.6, "x": "ローレル近郊で撃たれた一羽を、最後に確認された"}, {"t": 654.2333333333333, "x": "野生個体として州の史跡標識に記している。"}, {"t": 657.15, "x": "その標本は後年、風雨で失われた。"}, {"t": 660.45, "x": "どちらが最後だったのかは分からない。"}, {"t": 662.6666666666666, "x": "分かっているのは、この頃にはもうどちらでもよくなるほど"}, {"t": 666.1166666666667, "x": "少なくなっていたということだけである。"}, {"t": 668.1, "x": "四年は長い。"}, {"t": 669.1, "x": "いや、長いという言い方は正しくない。"}, {"t": 671.7833333333333, "x": "私には比べるものが無かった。"}, {"t": 673.6666666666666, "x": "ただ、その四年のあいだに私の"}, {"t": 675.8833333333333, "x": "中で減っていったものがある。"}, {"t": 677.3166666666667, "x": "鳴かなくなった。"}, {"t": 678.2833333333333, "x": "最初のうちは鳴いていた。"}, {"t": 679.85, "x": "返事が無いことに慣れるまでしばらくかかった。"}, {"t": 682.3, "x": "慣れたあとは、鳴く理由が思いつかなくなった。"}, {"t": 685.1666666666666, "x": "止まり木の上で私は外を見て過ごした。"}, {"t": 687.6166666666667, "x": "外の木の葉が出て、色が変わって、落ちる。"}, {"t": 690.9166666666666, "x": "それを四回見た。"}, {"t": 692.1666666666666, "x": "器の水に氷が張るのを四回見た。"}, {"t": 694.6833333333333, "x": "一羽になってからの一年目は、まだ探していた。"}, {"t": 697.8166666666667, "x": "止まり木の端まで行って、そこから檻の向こう側を見る。"}, {"t": 701.3, "x": "誰もいないことを確かめてまた元の場所に戻る。"}, {"t": 704.1333333333333, "x": "それを日に何度もやっていた。"}, {"t": 705.85, "x": "二年目には、端まで行かなくなった。"}, {"t": 708.2666666666667, "x": "三年目には、止まり木の上から動かなくなった。"}, {"t": 711.45, "x": "四年目に、その止まり木にも上がれなくなった。"}, {"t": 714.3, "x": "人間は増え続けていた。"}, {"t": 715.9166666666666, "x": "私の前に立つ人間の数は年が経つほど多くなった。"}, {"t": 719.25, "x": "網の外の板の文字が増えたのも、たぶんそのころだ。"}, {"t": 722.6166666666667, "x": "読めないが、板そのものが大きくなったことは分かる。"}, {"t": 725.9166666666666, "x": "私はそのころほとんど動かなかった。"}, {"t": 728.1833333333333, "x": "動かないでいる私を見て、離れていく人間もいた。"}, {"t": 731.7, "x": "網を軽く叩く人間もいた。"}, {"t": 733.5833333333334, "x": "私は動かなかった。"}, {"t": 735.0, "x": "動けなかったからだ。"}, {"t": 736.2666666666667, "x": "低い止まり木に上がるのにも、時間がかかるようになった。"}, {"t": 739.75, "x": "翼を使って体を持ち上げる。"}, {"t": 741.8, "x": "そこで一度休む。"}, {"t": 743.0833333333334, "x": "それからもう一度。"}, {"t": 744.3, "x": "以前は一息でできたことだ。"}, {"t": 746.0666666666667, "x": "床に降りるのは簡単だった。"}, {"t": 747.9333333333333, "x": "降りるのは、落ちるのとあまり変わらない。"}, {"t": 750.5166666666667, "x": "そのころ私は、一日の大半を同じ場所で過ごしていた。"}, {"t": 754.3833333333333, "x": "止まり木の右端だ。"}, {"t": 755.7166666666667, "x": "そこからは網の外の道がいちばんよく見える。"}, {"t": 758.45, "x": "人間が来る方向も、去っていく"}, {"t": 760.6666666666666, "x": "方向も、その位置なら早く分かる。"}, {"t": 763.0166666666667, "x": "誰かが来るのを待っていたわけではない。"}, {"t": 765.1333333333333, "x": "ただ、そこが自分の場所になっていた。"}, {"t": 767.6, "x": "体は少しずつ軽くなっていった。"}, {"t": 769.65, "x": "羽根が抜けて、床に落ちているのを見た。"}, {"t": 772.2166666666667, "x": "拾う理由は無い。"}, {"t": 773.4166666666666, "x": "人間が掃除のときに持っていった。"}, {"t": 775.45, "x": "最後の何日かのことを、順番通りには覚えていない。"}, {"t": 779.1333333333333, "x": "覚えているのは、朝の光の角度だ。"}, {"t": 781.7833333333333, "x": "夏のあいだ朝の光は網の目を通って床の右側に落ちていた。"}, {"t": 785.6166666666667, "x": "それが少しずつ左へ寄っていく。"}, {"t": 787.6666666666666, "x": "それは毎年のことで私はその移り方で季節を知っていた。"}, {"t": 791.3333333333334, "x": "その日の朝、光は左寄りにあった。"}, {"t": 794.0166666666667, "x": "器は満たされていた。"}, {"t": 795.4833333333333, "x": "人間が来ていつも通りに水を替えて、"}, {"t": 797.75, "x": "いつも通りに去っていった。"}, {"t": 799.5, "x": "私は止まり木にいた。"}, {"t": 800.9333333333333, "x": "特別なことは何も起きていない。"}, {"t": 802.95, "x": "特別なことが起きないというのは、私の一日の通常の形だ。"}, {"t": 807.3, "x": "外の音も普段どおりだった。"}, {"t": 809.1, "x": "遠くで獣が唸り、足音が流れ、"}, {"t": 811.7, "x": "話し声が途切れずに通り過ぎていく。"}, {"t": 814.2666666666667, "x": "網の前に誰かが立ってしばらくして離れていく。"}, {"t": 817.0666666666667, "x": "またひとり立つ。"}, {"t": 818.05, "x": "私はそれを目だけで追っていた。"}, {"t": 819.9666666666667, "x": "昼になった。"}, {"t": 820.8333333333334, "x": "光は真上から落ちていた。"}, {"t": 822.5333333333333, "x": "私は止まり木から降りた。"}, {"t": 824.1666666666666, "x": "降りたというより、体が先に落ちた。"}, {"t": 826.85, "x": "床の砂は冷たかった。"}, {"t": 828.4166666666666, "x": "上を見た。"}, {"t": 829.5, "x": "四角い網がある。"}, {"t": 830.6666666666666, "x": "その向こうに空がある。"}, {"t": 832.1166666666667, "x": "私はその空を、飛んだことがない。"}, {"t": 834.5666666666667, "x": "私と同じ鳥が何十億羽いたということを私は知らない。"}, {"t": 838.2333333333333, "x": "空が埋まるほどの群れがあったということを"}, {"t": 840.55, "x": "私は見ていない。"}, {"t": 841.6, "x": "誰も私に教えなかったし、教えられても"}, {"t": 844.7, "x": "分からなかっただろう。"}, {"t": 845.8166666666667, "x": "私が知っているのは、この砂と、この網と、"}, {"t": 849.0833333333334, "x": "毎日やってきて器を満たす人間の手と、"}, {"t": 851.9666666666667, "x": "かつて止まり木の向こう側にいた二羽の気配だけだ。"}, {"t": 855.2, "x": "それで足りていたのかと聞かれれば"}, {"t": 856.9, "x": "分からないと答えるしかない。"}, {"t": 858.4166666666666, "x": "ほかを知らないのだから、比べようがない。"}, {"t": 861.15, "x": "ただ一つだけ、思ったことがある。"}, {"t": 863.4666666666667, "x": "私が鳴いたとき、返ってくる声があった"}, {"t": 866.2666666666667, "x": "ころのほうが網の内側は少しだけ広かった。"}, {"t": 868.9333333333333, "x": "光が、床の砂の上で動いている。"}, {"t": 871.6166666666667, "x": "もう、目を開けているのも難しい。"}, {"t": 874.15, "x": "私はここで生まれた。"}, {"t": 875.5666666666667, "x": "ここしか知らない。"}, {"t": 876.6166666666667, "x": "ここで終わる。"}, {"t": 877.4666666666667, "x": "それだけのことだ。"}, {"t": 883.5833333333334, "x": "一九一四年九月一日、午後一時。"}, {"t": 887.2333333333333, "x": "マーサはシンシナティ動物園の"}, {"t": 889.2, "x": "檻の床で死んでいるのを発見された。"}, {"t": 891.4666666666667, "x": "遺体はその日のうちにシンシナティ製氷会社へ"}, {"t": 894.2833333333333, "x": "運ばれ、およそ百四十キログラムの氷の塊に"}, {"t": 897.95, "x": "凍らせて列車でワシントンへ送られた。"}, {"t": 900.2, "x": "到着は九月四日である。"}, {"t": 902.0, "x": "皮を剥いだのはウィリアム・パーマー、"}, {"t": 904.5, "x": "剥製にしたのはネルソン・ウッド。"}, {"t": 907.4, "x": "内臓は別に解剖のうえ保存され、"}, {"t": 909.75, "x": "いずれも国立自然史博物館が保管している。"}, {"t": 913.1166666666667, "x": "彼女が何歳だったのかは、今も確定していない。"}, {"t": 916.5833333333334, "x": "一般には二十九歳とされることが多い。"}, {"t": 919.3833333333333, "x": "一方で十七歳前後だった可能性を示す記録もあり、"}, {"t": 922.9, "x": "生まれた場所についてもシカゴ大学の"}, {"t": 925.5166666666667, "x": "教授が飼っていた群れの出身とする説と、"}, {"t": 928.0166666666667, "x": "シンシナティ動物園で孵ったとする説が並んでいる。"}, {"t": 931.5, "x": "どちらとも決まっていない。"}, {"t": 933.0666666666667, "x": "最後の一羽の年齢すら"}, {"t": 934.75, "x": "確かめられていないということである。"}, {"t": 936.75, "x": "標本としてのマーサは、これまで"}, {"t": 939.1, "x": "何度か展示と収蔵を行き来してきた。"}, {"t": 941.4, "x": "一九五六年から一九九九年まで鳥類の常設展示にいた。"}, {"t": 946.8166666666667, "x": "二〇一四年から二〇一五年には"}, {"t": 949.0833333333334, "x": "絶滅百年にあわせた特別展に出ている。"}, {"t": 951.8166666666667, "x": "二〇一七年から二〇二四年九月までの展示を"}, {"t": 955.2, "x": "最後に、常設の展示からは外れている。"}, {"t": 958.1166666666667, "x": "一度だけ、彼女は生まれた街に戻っている。"}, {"t": 961.3, "x": "一九七四年六月、シンシナティ動物園に"}, {"t": 965.1833333333333, "x": "リョコウバト記念館が開館した。"}, {"t": 967.1666666666666, "x": "そのとき標本となったマーサが式のために"}, {"t": 969.7833333333333, "x": "ワシントンから運ばれた。"}, {"t": 971.3, "x": "動物園の教育担当者はその移動について、"}, {"t": 974.2833333333333, "x": "彼女が飛んだのはあのときが"}, {"t": 976.2666666666667, "x": "初めてだったかもしれない、と語っている。"}, {"t": 979.0333333333333, "x": "記念館は動物園に残っていた"}, {"t": 981.2333333333333, "x": "古い鳥舎の一つを転用したものだ。"}, {"t": 983.5, "x": "彼女が暮らしていた建物だと考えられているが、"}, {"t": 986.4333333333333, "x": "これも断定はされていない。"}, {"t": 988.4333333333333, "x": "現在、地球上に残っているリョコウバトの"}, {"t": 991.5666666666667, "x": "標本は千五百三十二点とされる。"}, {"t": 994.0166666666667, "x": "二〇一二年から、Revive &"}, {"t": 997.0333333333333, "x": "Restore という団体が"}, {"t": 999.1166666666667, "x": "リョコウバトを復活させる計画を進めている。"}, {"t": 1002.0666666666667, "x": "近縁のオビオバトのゲノムに遺伝子編集で"}, {"t": 1004.7, "x": "リョコウバトの遺伝子を書き込むという方針である。"}, {"t": 1007.5166666666667, "x": "二〇三〇年代に最初の個体を孵すことを目標に掲げている。"}, {"t": 1011.7166666666667, "x": "現時点で、生きた個体はまだ一羽も生まれていない。"}, {"t": 1015.3, "x": "五十億羽が消えるのに、百年かからなかった。"}, {"t": 1018.6833333333333, "x": "戻すほうの話は、始まってから"}, {"t": 1021.0166666666667, "x": "十四年たってまだ一羽目の前にいる。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
