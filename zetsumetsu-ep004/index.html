3333333, "i": 372}, {"t": 1036.65, "i": 373}, {"t": 1040.4, "i": 374}, {"t": 1043.1333333333334, "i": 375}, {"t": 1046.2666666666667, "i": 376}, {"t": 1050.4833333333333, "i": 377}, {"t": 1053.7833333333333, "i": 378}, {"t": 1057.1833333333334, "i": 379}, {"t": 1059.65, "i": 380}, {"t": 1063.3333333333333, "i": 381}, {"t": 1065.7833333333333, "i": 382}, {"t": 1069.1666666666667, "i": 383}, {"t": 1071.7166666666667, "i": 384}, {"t": 1075.9166666666667, "i": 385}, {"t": 1078.45, "i": 386}, {"t": 1080.7666666666667, "i": 387}, {"t": 1083.2833333333333, "i": 388}, {"t": 1085.9666666666667, "i": 388}], "subs": [{"t": 0.0, "x": "人間が山の道を歩いていると、"}, {"t": 2.0166666666666666, "x": "藪の中を同じ速さでついてくるものがいる。"}, {"t": 4.933333333333334, "x": "姿は見せず、襲いもせず、人間が私たちの"}, {"t": 8.633333333333333, "x": "山の境目を越えて向こうへ消えるまで、"}, {"t": 10.9, "x": "ただ後ろから見届けて、そこで引き返す。"}, {"t": 13.9, "x": "それが私たちだった。怖がって"}, {"t": 16.083333333333332, "x": "足を速める人間もいたし、振り返って"}, {"t": 18.733333333333334, "x": "何かをつぶやいてから、また歩き出す人間もいた。"}, {"t": 21.9, "x": "何とつぶやいていたのか、私には分からない。"}, {"t": 24.833333333333332, "x": "父も母も兄弟も、その前の群れも、"}, {"t": 27.55, "x": "そうやって人間の背中を送ってきた。"}, {"t": 30.1, "x": "境目の向こうでは別の群れが受け取り、"}, {"t": 32.416666666666664, "x": "人間の背中は山から山へ手渡されていった。"}, {"t": 35.63333333333333, "x": "これは、その受け渡しがどこで途切れたかという話だ。"}, {"t": 39.11666666666667, "x": "この道で見送る側にいたのは、いつも私たちだった。"}, {"t": 42.7, "x": "だから、最後に山から出ていったのが"}, {"t": 45.06666666666667, "x": "誰だったのかも、私が話すしかない。"}, {"t": 47.6, "x": "私が生きていた世界は、尾根と"}, {"t": 49.81666666666667, "x": "谷とそのあいだを縫う細い道でできていた。"}, {"t": 52.2, "x": "道には二種類ある。人間の道と獣の道だ。"}, {"t": 55.333333333333336, "x": "人間の道は幅が揃っていて、"}, {"t": 57.3, "x": "踏み固められていて、どこまでも続く。"}, {"t": 60.233333333333334, "x": "獣の道は細い。途中で消えて、また別の場所から始まる。"}, {"t": 64.43333333333334, "x": "私は両方を知っていた。群れがいた。"}, {"t": 66.9, "x": "前を行く者の尾が見えて、後ろを来る者の息が聞こえる。"}, {"t": 70.61666666666666, "x": "それくらいの数だ。父と母がいて、"}, {"t": 73.08333333333333, "x": "同じ春に生まれた兄弟がいた。"}, {"t": 75.23333333333333, "x": "私が生まれたのは山の上の岩穴だった。"}, {"t": 77.88333333333334, "x": "ススキの原の奥にあって、入口は低い。"}, {"t": 80.71666666666667, "x": "外の光が細く差しこむだけの場所だ。"}, {"t": 83.1, "x": "目が開いて最初に覚えたのは、"}, {"t": 85.26666666666667, "x": "光より先に匂いだった。母の匂い。"}, {"t": 87.75, "x": "兄弟の匂い。岩の湿った匂い。"}, {"t": 90.11666666666666, "x": "穴から出られるようになると、群れの後ろについて歩いた。"}, {"t": 93.71666666666667, "x": "最初は尾根までしか行けなかった。"}, {"t": 95.63333333333334, "x": "次の季節には谷の水場まで行けた。"}, {"t": 97.95, "x": "その次には尾根を二つ越えた。"}, {"t": 99.81666666666666, "x": "冬になると鹿は尾根の南の斜面に集まる。"}, {"t": 102.53333333333333, "x": "雪の少ない場所を知っているからだ。"}, {"t": 104.61666666666666, "x": "私たちもそれを知っていた。"}, {"t": 106.31666666666666, "x": "だから冬は南へ行き、夏は北の谷へ戻る。"}, {"t": 109.65, "x": "群れの歩く道は季節ごとに少しずつ入れ替わった。"}, {"t": 112.66666666666667, "x": "狩りは夜明けと日暮れにやる。"}, {"t": 114.36666666666666, "x": "暗くなりきる前と、明るくなりきる前だ。"}, {"t": 117.28333333333333, "x": "鹿の匂いは風上から来る。群れは声を出さずに散る。"}, {"t": 120.66666666666667, "x": "谷の下と尾根の上から同時に寄せていく。"}, {"t": 123.16666666666667, "x": "若いころの私は、いつも尾根の側を任された。"}, {"t": 126.43333333333334, "x": "脚が速かったからだ。猪は違う。"}, {"t": 128.93333333333334, "x": "猪は逃げずに向かってくる。"}, {"t": 130.78333333333333, "x": "牙で脚を裂かれた仲間を私は見ている。"}, {"t": 133.4, "x": "だから猪には無理をしない。"}, {"t": 135.21666666666667, "x": "弱った一頭を見つけるまで、何日でも後をつける。"}, {"t": 138.6, "x": "鹿と猪のほかにも、食べるものはあった。"}, {"t": 141.63333333333333, "x": "大きな獲物が見つからない日には、藪の中で兎を追った。"}, {"t": 145.46666666666667, "x": "枯れ草の下を走る鼠を押さえることもあった。"}, {"t": 148.3, "x": "兎も鼠も、一頭で仕留められる大きさだ。"}, {"t": 151.45, "x": "最初に一頭で捕まえたのも、鼠だった。"}, {"t": 154.4, "x": "まだ尾根までしか行けなかったころだ。"}, {"t": 156.4, "x": "群れが散っているあいだ、私は"}, {"t": 158.55, "x": "よくそうやって腹を満たした。"}, {"t": 160.08333333333334, "x": "私たちの脚は短く、耳も小さい。"}, {"t": 162.91666666666666, "x": "それでも藪の中で兎に追いつけなかったことは、"}, {"t": 165.71666666666667, "x": "あまり覚えていない。大きな獲物の"}, {"t": 168.15, "x": "匂いが途切れた季節にも、雪の"}, {"t": 170.26666666666668, "x": "上には小さな足跡がいくつも残っていた。"}, {"t": 172.76666666666668, "x": "低い枝の下をくぐるたびに、この体でよかったと思った。"}, {"t": 176.51666666666668, "x": "山の群れは私たちだけではなかった。"}, {"t": 178.75, "x": "尾根の向こうには別の群れがいた。"}, {"t": 180.68333333333334, "x": "姿を見ることはほとんど無い。"}, {"t": 182.56666666666666, "x": "けれども境目の木に行けば分かる。"}, {"t": 184.65, "x": "そこには向こうの匂いが付いていて、"}, {"t": 186.7, "x": "その上に私たちの匂いが付いている。"}, {"t": 189.33333333333334, "x": "匂いが重なっている場所が、山の境目だった。"}, {"t": 192.51666666666668, "x": "私は群れの中で、道を見る役をよくやった。"}, {"t": 195.63333333333333, "x": "人間は下から上がってくる。"}, {"t": 197.33333333333334, "x": "薪を背負った者。何かを担いだ者。"}, {"t": 199.98333333333332, "x": "ただ歩いているだけの者。私たちの"}, {"t": 202.45, "x": "山を通って、別の谷へ抜けていく。"}, {"t": 204.9, "x": "私はその後ろを歩いた。姿は見せない。"}, {"t": 207.75, "x": "道から少し外れた藪の中を、同じ速さでついていく。"}, {"t": 211.55, "x": "人間が止まれば私も止まる。"}, {"t": 213.43333333333334, "x": "人間が振り返れば私は伏せる。"}, {"t": 215.58333333333334, "x": "そして人間が私たちの山を出ていくまで見届ける。"}, {"t": 218.75, "x": "境目の木を過ぎたら、そこで引き返す。"}, {"t": 221.51666666666668, "x": "噛みつくためではない。追い払うためでもない。"}, {"t": 224.15, "x": "ここが誰の山なのかを、確かめ"}, {"t": 226.03333333333333, "x": "終えるまで見ている。ただそれだけの習いだ。"}, {"t": 228.86666666666667, "x": "人間のほうも、たぶん気づいていた。足を速める者がいた。"}, {"t": 232.88333333333333, "x": "わざと大きな音を立てて歩く者もいた。"}, {"t": 235.28333333333333, "x": "何も気にせず歌いながら歩く者もいた。"}, {"t": 237.75, "x": "どの人間も、最後には山を出ていった。"}, {"t": 240.58333333333334, "x": "夜になると私たちは声を上げた。"}, {"t": 242.76666666666668, "x": "谷の向こうで人間の家の明かりが揺れていた。"}, {"t": 245.5, "x": "私の声のあとで、その明かりが一つ消えたことがある。"}, {"t": 248.95, "x": "私たちの声が届いていたのかどうかは分からない。"}, {"t": 251.86666666666667, "x": "そういう世界だった。広くて、"}, {"t": 254.05, "x": "境目があって、境目の向こうにも誰かがいた。"}, {"t": 257.3333333333333, "x": "人間は、下から来る。私が生まれる"}, {"t": 260.01666666666665, "x": "前から、人間は山の下にいた。"}, {"t": 262.3666666666667, "x": "谷の底に家があり、家のまわりに畑があった。"}, {"t": 265.7, "x": "朝になると煙が上がった。煙の"}, {"t": 267.85, "x": "匂いは風に乗って、尾根の上まで届いた。"}, {"t": 270.76666666666665, "x": "人間が山に上がってくるのは、"}, {"t": 272.56666666666666, "x": "木を伐るときと、何かを取りに来るときだ。"}, {"t": 275.5833333333333, "x": "上がってきて、また下りていく。"}, {"t": 277.6666666666667, "x": "下りていくところまで見届けるのが私たちの習いだった。"}, {"t": 280.8333333333333, "x": "長いあいだ、それで何も変わらなかった。"}, {"t": 283.5, "x": "変わったのは匂いからだった。"}, {"t": 285.21666666666664, "x": "人間と一緒に、四本脚の生き物が"}, {"t": 288.03333333333336, "x": "上がってくるようになった。"}, {"t": 289.28333333333336, "x": "犬だ。姿は私たちに少し似ている。けれども匂いが違う。"}, {"t": 293.8833333333333, "x": "人間の家の匂いが体に染みついている。"}, {"t": 296.45, "x": "犬は吠える。藪の中にいる私に向かって吠える。"}, {"t": 299.6166666666667, "x": "人間はその声のほうを見る。"}, {"t": 301.4166666666667, "x": "私は道から離れて、それまでより"}, {"t": 303.85, "x": "遠くからついていくようになった。"}, {"t": 305.55, "x": "犬の中には、群れの匂いのほうへ寄ってくる者もいた。"}, {"t": 309.01666666666665, "x": "吠えずに尾を下げて、境目の木のあたりをうろついている。"}, {"t": 312.53333333333336, "x": "群れの誰かがそれを追い払わずにいた季節もある。"}, {"t": 315.26666666666665, "x": "そういうことは、この山では昔から時々あったらしい。"}, {"t": 318.9, "x": "ある年、群れの一頭がおかしくなった。"}, {"t": 321.5833333333333, "x": "最初は小さな変化だった。水場に行っても水を飲まない。"}, {"t": 325.18333333333334, "x": "口を近づけて、すぐ顔を背ける。"}, {"t": 327.68333333333334, "x": "それから、何も無いところに噛みつくようになった。"}, {"t": 330.7, "x": "風に揺れた草にも、自分の影にも噛みついた。"}, {"t": 333.93333333333334, "x": "群れはその一頭から離れた。"}, {"t": 335.73333333333335, "x": "離れろと誰かが決めたのではない。"}, {"t": 337.7, "x": "匂いが変わっていたのだ。知っている仲間の匂いの中に、"}, {"t": 341.0, "x": "知らない匂いが混ざっていた。"}, {"t": 343.01666666666665, "x": "その一頭は、ある日、尾根を下りていった。"}, {"t": 346.1, "x": "人間の家のほうへ。群れの誰も、それを止めなかった。"}, {"t": 349.8, "x": "止め方を知らなかった。戻ってこなかった。"}, {"t": 352.3333333333333, "x": "同じことが別の年にも、別の谷でも起きたらしい。"}, {"t": 355.8333333333333, "x": "境目の木に付いている向こうの群れの"}, {"t": 357.96666666666664, "x": "匂いが、ある季節から急に薄くなった。"}, {"t": 360.55, "x": "そのころから、人間の歩き方が変わった。"}, {"t": 363.4, "x": "道の上で立ち止まる時間が長くなった。"}, {"t": 365.8666666666667, "x": "細長い棒を持って上がってくる者が増えた。"}, {"t": 368.5, "x": "棒を持った人間は、見届けようとする"}, {"t": 371.18333333333334, "x": "私のほうを探す。前は私が見る側だった。"}, {"t": 374.1666666666667, "x": "そのころから、見られる側になった。"}, {"t": 376.55, "x": "乾いた音を初めて聞いたのは、秋の終わりだった。"}, {"t": 379.85, "x": "谷に音が響いて、鳥が一斉に飛び立った。"}, {"t": 382.95, "x": "その日の夕方、兄弟の一頭が戻らなかった。"}, {"t": 386.23333333333335, "x": "次の朝、音のした谷へ下りていった母も戻らなかった。"}, {"t": 389.95, "x": "音はそれからも時々響いた。"}, {"t": 391.8833333333333, "x": "響くたびに、私は境目の木を回って群れの匂いを確かめた。"}, {"t": 396.1333333333333, "x": "どの匂いが消えたのかを知るためだ。"}, {"t": 398.2, "x": "道の上に肉が置かれていたこともある。"}, {"t": 400.5, "x": "いい匂いのする肉だった。人間の"}, {"t": 402.6166666666667, "x": "道のまん中に、隠しもせずに置いてある。"}, {"t": 405.3, "x": "群れの若い一頭がそれを食べた。"}, {"t": 407.28333333333336, "x": "その一頭も、次の朝には動かなかった。"}, {"t": 410.1666666666667, "x": "鹿も減っていった。鹿の匂いが風上から来ない日が増えた。"}, {"t": 413.81666666666666, "x": "追っても追っても、足跡が途中で"}, {"t": 416.25, "x": "人間の足跡と重なって消える。"}, {"t": 418.21666666666664, "x": "群れは少しずつ小さくなった。"}, {"t": 420.03333333333336, "x": "尾根の側と谷の側から同時に"}, {"t": 421.95, "x": "寄せる狩りが、できなくなった。寄せる者の数が足りない。"}, {"t": 425.46666666666664, "x": "私は尾根の側も谷の側も、一頭で走るようになった。"}, {"t": 429.3333333333333, "x": "人間が何を考えていたのか、私には分からない。"}, {"t": 432.75, "x": "匂いで分かるのは、人間がそこにいたかどうかだけだ。"}, {"t": 436.01666666666665, "x": "考えていたことの匂いは、嗅いだことがない。"}, {"t": 438.93333333333334, "x": "だから私は人間を裁かない。"}, {"t": 441.0, "x": "裁くための材料を、私は持っていない。"}, {"t": 444.01666666666665, "x": "ある冬、群れの後ろを来る者の息が聞こえなくなった。"}, {"t": 447.46666666666664, "x": "振り返ると、道の上には私の足跡しかなかった。"}, {"t": 451.1, "x": "ここで視点を外に移す。この動物が何者だったのかを、"}, {"t": 454.85, "x": "人間の側に残った記録から並べていく。"}, {"t": 457.8833333333333, "x": "ニホンオオカミは、本州・四国・九州にだけ"}, {"t": 461.9166666666667, "x": "住んでいたオオカミである。"}, {"t": 463.23333333333335, "x": "学名が付いたのは一八三九年。"}, {"t": 466.23333333333335, "x": "長崎の出島にいたシーボルトが日本から送った標本を"}, {"t": 469.81666666666666, "x": "もとに、オランダの動物学者テミンクが記載した。"}, {"t": 473.1, "x": "種小名のホドフィラクスは、"}, {"t": 474.68333333333334, "x": "ギリシャ語で道を守る者という意味を持つ。"}, {"t": 477.6333333333333, "x": "名前の由来とされるのは、この動物の習性である。"}, {"t": 481.26666666666665, "x": "縄張りに入ってきた者の後ろを"}, {"t": 483.28333333333336, "x": "つけて、出ていくまで見届ける。"}, {"t": 485.56666666666666, "x": "人間の側ではこれが送り狼という言い伝えになった。"}, {"t": 489.1666666666667, "x": "ただし、この動物の呼び名は一つではなかった。"}, {"t": 492.6666666666667, "x": "江戸時代の日本ではオオカミと"}, {"t": 494.5833333333333, "x": "ヤマイヌという二つの名前が使われていた。"}, {"t": 497.1, "x": "二つが同じ動物を指すのか、別の動物なのか。"}, {"t": 500.73333333333335, "x": "シーボルトの標本にもこの二つの名前が付いていて、"}, {"t": 504.01666666666665, "x": "その議論は今も完全には決着していない。"}, {"t": 507.18333333333334, "x": "大陸のオオカミよりはっきり小さかった。"}, {"t": 509.78333333333336, "x": "記録に残る体長はおよそ九十五センチから"}, {"t": 512.7, "x": "百十四センチ、尾は三十センチほど。"}, {"t": 515.7333333333333, "x": "体重は二十キログラム前後と推定されている。"}, {"t": 518.8833333333333, "x": "残された剥製を見ると、毛の色は淡い黄土色に"}, {"t": 522.4833333333333, "x": "近く、耳の後ろ側は赤茶色をしている。"}, {"t": 525.4333333333333, "x": "頭骨は短く、鼻先は短くて幅が広い。"}, {"t": 529.0666666666667, "x": "夜明けと日暮れに動き、尾根に"}, {"t": 531.2333333333333, "x": "近いススキの原の岩穴を巣にしたと伝わる。"}, {"t": 533.8833333333333, "x": "近くで遠吠えをすると家の障子が"}, {"t": 536.1166666666667, "x": "震えた、という言い伝えも残っている。"}, {"t": 538.6833333333333, "x": "群れは数頭から十頭ほどで、主な獲物は"}, {"t": 541.8666666666667, "x": "ニホンジカとイノシシ、それにニホンザルだった。"}, {"t": 544.85, "x": "人間はこの動物を、長いあいだ敵とは見ていなかった。"}, {"t": 548.75, "x": "畑を荒らすシカやイノシシを食べるからである。"}, {"t": 551.55, "x": "埼玉県秩父の三峯神社や東京都の武蔵御嶽神社では、"}, {"t": 555.7666666666667, "x": "オオカミは大口真神として祀られた。"}, {"t": 558.6333333333333, "x": "獣害除けや魔除け、憑き物落としの神としてである。"}, {"t": 562.2, "x": "農民と旅人の守り手として敬われてきたと、"}, {"t": 565.0666666666667, "x": "英語の論文にもそのまま書かれている。"}, {"t": 567.7833333333333, "x": "それが変わった。一七三二年、享保十七年。"}, {"t": 572.2333333333333, "x": "長崎から狂犬病が入ってきたと記録されている。"}, {"t": 575.5333333333333, "x": "病気は犬から広がり、キツネやタヌキ、"}, {"t": 578.45, "x": "そしてオオカミにも及んだとされる。"}, {"t": 580.8333333333334, "x": "この病気の侵入をきっかけに、オオカミは敬う相手から"}, {"t": 584.6666666666666, "x": "恐れる相手へと見方が変わっていったとされる。"}, {"t": 587.2833333333333, "x": "その四年後には東日本の犬にも狂犬病が現れた。"}, {"t": 591.2166666666667, "x": "一七四二年ごろには、銃と毒を使ってオオカミを"}, {"t": 595.3666666666667, "x": "狩る専門の猟師がいたことも知られている。"}, {"t": 597.8166666666667, "x": "十九世紀の後半、明治に入ると、"}, {"t": 600.8166666666667, "x": "今度は制度がオオカミに向かった。"}, {"t": 603.25, "x": "東北地方の明治期の公文書を調べた研究がある。"}, {"t": 606.8333333333334, "x": "そこには放し飼いの馬や牛を襲われたことを"}, {"t": 609.6166666666667, "x": "理由にした駆除の記録が数多く残っている。"}, {"t": 612.2833333333333, "x": "青森県では警察がオオカミを殺した。"}, {"t": 615.05, "x": "現在の岩手県と宮城県にまたがっていた"}, {"t": 617.8333333333334, "x": "磐井県では、警察が猟師に駆除を命じた。"}, {"t": 621.05, "x": "一八七五年、岩手県は駆除に賞金を出す制度を作った。"}, {"t": 626.1833333333333, "x": "六年間で二百一頭が殺されている。"}, {"t": 628.8166666666667, "x": "二年後、宮城県も同じ制度を作った。"}, {"t": 632.0666666666667, "x": "福島県では住民自身が駆除にあたっていた。"}, {"t": 635.2333333333333, "x": "駆除は上から命じられたものだけではない。"}, {"t": 637.7, "x": "毛皮や肉も取引されていた。"}, {"t": 639.8, "x": "銃が行き渡ったことも重なった。"}, {"t": 641.9833333333333, "x": "狩りの手段は、それ以前とは"}, {"t": 644.1333333333333, "x": "比べものにならなくなっていた。獲物の側も減っていた。"}, {"t": 647.5666666666667, "x": "明治期にはシカやイノシシも大量に狩られ、"}, {"t": 650.1666666666666, "x": "オオカミの食べるものが少なくなった。"}, {"t": 652.6166666666667, "x": "そして明治になって持ちこまれた西洋の"}, {"t": 654.9333333333333, "x": "犬とともに、ジステンパーという別の"}, {"t": 657.3166666666667, "x": "病気が広がったとも考えられている。"}, {"t": 659.5, "x": "犬との関わりは病気だけではない。"}, {"t": 661.7333333333333, "x": "二〇二一年に発表されたゲノムの解析では、"}, {"t": 664.95, "x": "ニホンオオカミと日本の犬とのあいだに、"}, {"t": 667.6333333333333, "x": "はっきりとした交雑の跡が見つかっている。病気。賞金。"}, {"t": 672.45, "x": "銃。獲物の減少。どれか一つが決め手だったのか"}, {"t": 676.45, "x": "どうかは、今も分かっていない。"}, {"t": 678.55, "x": "記録から言えるのは、これらが"}, {"t": 680.5333333333333, "x": "同じ時期に重なったということである。"}, {"t": 682.6166666666667, "x": "ここで一つ、はっきりさせておくことがある。"}, {"t": 685.65, "x": "記録に残っている駆除の理由は、"}, {"t": 687.6, "x": "馬を守りたい、人を守りたいというものだ。"}, {"t": 690.9333333333333, "x": "オオカミを絶やそうとして作られた文書は見当たらない。"}, {"t": 694.1666666666666, "x": "それぞれの村や県が、それぞれの目の前の被害に対応した。"}, {"t": 698.3833333333333, "x": "その足し算の先に、一つの種の終わりがあった。"}, {"t": 701.7833333333333, "x": "北海道には別の系統のエゾオオカミがいたが、"}, {"t": 704.8, "x": "こちらも一八九六年の記録を最後に姿を消している。"}, {"t": 709.2666666666667, "x": "本州のニホンオオカミについて、確実な記録の"}, {"t": 712.6833333333333, "x": "最後に置かれているのは一九〇五年一月の一頭である。"}, {"t": 716.4166666666666, "x": "一頭でやる狩りは、狩りとは呼べない。"}, {"t": 718.9833333333333, "x": "鹿を追う。谷の側へ回りこむ者がいないから、"}, {"t": 721.9833333333333, "x": "鹿はそのまま谷へ抜けていく。"}, {"t": 724.15, "x": "私はそれを尾根の上から見送る。"}, {"t": 726.2666666666667, "x": "一頭で追えるのは、弱ったものか小さなものだけだ。"}, {"t": 729.6, "x": "そういうものを探して、私は"}, {"t": 731.75, "x": "前よりずっと長く歩くようになった。"}, {"t": 733.85, "x": "朝になると、境目の木を回った。"}, {"t": 736.4166666666666, "x": "これは群れがいたころからの習いだ。"}, {"t": 738.4, "x": "木の根元に匂いを付ける。前の日に"}, {"t": 740.7, "x": "付けた匂いの上に、今日の匂いを重ねる。"}, {"t": 743.4333333333333, "x": "そうして山 const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
