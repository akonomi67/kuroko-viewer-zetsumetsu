": 370}, {"t": 978.3166666666667, "i": 371}, {"t": 980.2333333333333, "i": 372}, {"t": 982.0333333333333, "i": 373}, {"t": 985.8166666666667, "i": 374}, {"t": 988.1, "i": 375}, {"t": 990.65, "i": 376}, {"t": 993.5333333333333, "i": 377}, {"t": 996.5166666666667, "i": 378}, {"t": 999.1166666666667, "i": 379}, {"t": 1001.6666666666666, "i": 380}, {"t": 1004.35, "i": 381}, {"t": 1007.95, "i": 382}, {"t": 1009.8833333333333, "i": 383}, {"t": 1013.2833333333333, "i": 384}, {"t": 1016.0, "i": 385}, {"t": 1019.5333333333333, "i": 386}, {"t": 1022.1833333333333, "i": 387}, {"t": 1025.4666666666667, "i": 388}, {"t": 1029.25, "i": 389}, {"t": 1032.8, "i": 390}, {"t": 1035.6, "i": 391}, {"t": 1038.45, "i": 392}, {"t": 1042.0333333333333, "i": 393}, {"t": 1044.3, "i": 394}, {"t": 1048.6333333333334, "i": 395}, {"t": 1051.1333333333334, "i": 396}, {"t": 1053.8166666666666, "i": 397}, {"t": 1055.6333333333334, "i": 398}, {"t": 1058.1666666666667, "i": 399}, {"t": 1060.3333333333333, "i": 400}, {"t": 1062.3666666666666, "i": 401}, {"t": 1064.2166666666667, "i": 402}, {"t": 1067.3666666666666, "i": 403}, {"t": 1070.2166666666667, "i": 404}, {"t": 1073.65, "i": 405}, {"t": 1076.7166666666667, "i": 405}], "subs": [{"t": 0.0, "x": "呼べば返ってくる声があった。"}, {"t": 1.7833333333333334, "x": "去年の夏の終わりまでは、そうだった。"}, {"t": 4.283333333333333, "x": "今は違う。私が鳴くと、その声は屋根の下を"}, {"t": 7.683333333333334, "x": "ひと回りしてどこにも着かずに消えていく。"}, {"t": 9.883333333333333, "x": "二月の朝は暗い。金網の向こうの"}, {"t": 12.05, "x": "木には葉が一枚も残っていない。"}, {"t": 14.2, "x": "この鳥小屋の中で色を持っているのは私だけだ。"}, {"t": 17.133333333333333, "x": "黄色い頭と橙色の顔と緑の体。"}, {"t": 19.916666666666668, "x": "人間は私をインカスと呼んだ。一九一八年二月二十一日。"}, {"t": 24.55, "x": "私はシンシナティ動物園の鳥小屋で息を止めた。"}, {"t": 27.65, "x": "人間の檻の中で生きていたこの色の"}, {"t": 29.783333333333335, "x": "鳥のうち、私が最後の一羽だった。"}, {"t": 32.53333333333333, "x": "私が黙ったあと、この建物にはもう誰の声も残らなかった。"}, {"t": 36.63333333333333, "x": "私が生きていた世界は騒がしかった。"}, {"t": 38.983333333333334, "x": "最初にそれを言っておきたい。"}, {"t": 40.65, "x": "私たちは静かな鳥ではない。"}, {"t": 42.583333333333336, "x": "朝に屋根の隙間から光が入ると誰かが鳴く。"}, {"t": 45.416666666666664, "x": "すると隣が鳴く。その隣も鳴く。"}, {"t": 47.75, "x": "建物の中が声でいっぱいになるまでそれは止まらない。"}, {"t": 50.833333333333336, "x": "鳥小屋の屋根は端が上に反り返った形をしていた。"}, {"t": 54.05, "x": "柱と金網で囲まれていて、中には枝を"}, {"t": 57.016666666666666, "x": "渡した止まり木と餌の台と水の皿があった。"}, {"t": 59.666666666666664, "x": "人間の建物の中では少し変わった形だったのだと思う。"}, {"t": 63.15, "x": "見に来た人間はよく屋根を見上げていた。"}, {"t": 65.56666666666666, "x": "ここに来たとき、私たちは一つの箱に詰められていた。"}, {"t": 69.16666666666667, "x": "蓋が開くと緑の塊が一度に飛び出した。"}, {"t": 72.0, "x": "天井にぶつかる者もいた。金網にしがみつく者もいた。"}, {"t": 75.58333333333333, "x": "私はたぶんそのどちらかだった。"}, {"t": 77.51666666666667, "x": "それより前のことを私はうまく思い出せない。"}, {"t": 80.31666666666666, "x": "暗い木の中の匂いとたくさんの体の温かさ。"}, {"t": 83.23333333333333, "x": "それが本当に見たものなのか、あとで"}, {"t": 85.61666666666666, "x": "眠っているあいだに見たものなのか区別がつかない。"}, {"t": 88.25, "x": "だからそれについてはこれ以上言わない。"}, {"t": 90.45, "x": "私たちはくっついていないと落ち着かない鳥だ。"}, {"t": 93.13333333333334, "x": "夜になると一本の止まり木に"}, {"t": 94.81666666666666, "x": "並んで肩と肩を押しつけ合って眠る。"}, {"t": 96.93333333333334, "x": "端の一羽が少しずれると全員が少しずつずれる。"}, {"t": 99.96666666666667, "x": "朝になるとまた誰かが鳴いて全員が鳴く。"}, {"t": 102.45, "x": "その繰り返しが私たちの一日だった。"}, {"t": 104.93333333333334, "x": "最初の一声を上げるのが誰なのかは日によって違った。"}, {"t": 108.2, "x": "私のこともあった。仲間の頭は黄色い。"}, {"t": 111.1, "x": "顔のまわりだけが橙色に燃えている。"}, {"t": 113.53333333333333, "x": "体は緑で翼の付け根に黄色が差す。"}, {"t": 116.15, "x": "若い鳥は顔まで緑一色で、年を"}, {"t": 118.88333333333334, "x": "重ねるにつれて頭が黄色く変わっていく。"}, {"t": 121.33333333333333, "x": "私もはじめは全身が緑だったはずだ。"}, {"t": 123.9, "x": "止まり木に全員が並ぶと枝の上は黄色と緑で埋まる。"}, {"t": 127.33333333333333, "x": "私は数を数えることができない。"}, {"t": 129.46666666666667, "x": "けれども色の量なら分かる。"}, {"t": 131.16666666666666, "x": "今日の枝にはこれだけの緑がある。"}, {"t": 133.25, "x": "それが私にとっての群れの大きさだった。"}, {"t": 135.73333333333332, "x": "餌の台には人間がいろいろな物を置いた。"}, {"t": 138.33333333333334, "x": "種や穀物や果物だ。ときどき棘だらけの"}, {"t": 140.78333333333333, "x": "小さな実がついた枝が差し入れられた。"}, {"t": 143.23333333333332, "x": "人間はそれをオナモミと呼んでいた。"}, {"t": 145.31666666666666, "x": "硬い殻を嘴で割って中の種を取り出す。"}, {"t": 148.05, "x": "あの実が来た日だけは、止まり木の"}, {"t": 150.25, "x": "上の全員が少し静かになった。"}, {"t": 152.13333333333333, "x": "食べるのに忙しかったからだ。"}, {"t": 153.9, "x": "群れの中にいつも私の隣にいる一羽がいた。"}, {"t": 156.78333333333333, "x": "人間は彼女をレディ・ジェーンと呼んだ。"}, {"t": 158.93333333333334, "x": "どちらが先に隣に来たのかは覚えていない。"}, {"t": 161.61666666666667, "x": "気がついたときには、眠るときも"}, {"t": 163.8, "x": "餌を食べるときも彼女は私の右にいた。"}, {"t": 166.35, "x": "首の後ろの自分の嘴が届かない場所の羽根を彼女が整えた。"}, {"t": 170.36666666666667, "x": "私も同じことを彼女にした。"}, {"t": 172.28333333333333, "x": "この鳥小屋で私が覚えている季節はどれもうるさかった。"}, {"t": 175.73333333333332, "x": "春はうるさい。夏もうるさい。"}, {"t": 177.76666666666668, "x": "秋になると外の木々の葉が落ちて声が"}, {"t": 180.03333333333333, "x": "よく響くようになるので、もっとうるさい。"}, {"t": 182.55, "x": "冬だけが少し静かだった。寒さで"}, {"t": 184.51666666666668, "x": "みんなが体を寄せ合って黙っていたからだ。"}, {"t": 187.13333333333333, "x": "雨の日もうるさかった。屋根を叩く音に負けまいとして、"}, {"t": 190.41666666666666, "x": "全員がいつもより大きな声で鳴いた。"}, {"t": 193.06666666666666, "x": "何に負けまいとしていたのかは自分でも分からない。"}, {"t": 195.86666666666667, "x": "雨がやむと、誰からともなく鳴きやんだ。"}, {"t": 198.66666666666666, "x": "それが私の知っている世界の全部だった。"}, {"t": 201.28333333333333, "x": "人間の手はいつも上から来た。"}, {"t": 203.18333333333334, "x": "箱の蓋を開けたのも上からの手だった。"}, {"t": 205.51666666666668, "x": "餌の台に種を置くのも水の皿を替えるのも上から来る手だ。"}, {"t": 209.06666666666666, "x": "私たちは上を見上げてその手が"}, {"t": 211.0, "x": "何を持っているかを確かめた。"}, {"t": 212.68333333333334, "x": "持っているのが種なら鳴いた。"}, {"t": 214.35, "x": "何も持っていなければ少し黙った。"}, {"t": 216.43333333333334, "x": "手とは別に、金網の外には立って見ているだけの"}, {"t": 219.73333333333332, "x": "人間たちがいた。その人間たちは"}, {"t": 221.66666666666666, "x": "朝から夕方まで入れ替わりながら来た。"}, {"t": 223.98333333333332, "x": "私たちが一斉に鳴くと驚いて一歩下がる者がいた。"}, {"t": 227.21666666666667, "x": "指をさして笑う者がいた。子どもはとくによく笑った。"}, {"t": 230.55, "x": "私たちの色が人間の目には珍しかったのだと思う。"}, {"t": 233.86666666666667, "x": "人間の頭の上に鳥の羽根が乗っていることがあった。"}, {"t": 237.05, "x": "白い羽根。黒い羽根。ときどき緑の羽根。"}, {"t": 240.31666666666666, "x": "人間はそれを揺らしながら金網の前を通り過ぎていく。"}, {"t": 243.71666666666667, "x": "私はその羽根を見上げて鳴いてみたことがある。"}, {"t": 246.36666666666667, "x": "返事は無かった。羽根は鳴かない。"}, {"t": 248.41666666666666, "x": "それが何の鳥の羽根だったのかを私は知らない。"}, {"t": 251.28333333333333, "x": "春になるとレディ・ジェーンは卵を産んだ。"}, {"t": 253.53333333333333, "x": "一つではなかった。毎年のように何度も産んだ。"}, {"t": 256.5, "x": "白くて丸い卵だ。けれどもその卵から"}, {"t": 258.98333333333335, "x": "雛が出たことは一度もない。"}, {"t": 260.8833333333333, "x": "私たちは自分たちの卵を巣から"}, {"t": 262.7, "x": "押し出してしまったからだ。転がして外へ落とした。"}, {"t": 265.8, "x": "なぜそうしたのかと聞かれても答えは無い。そうしたのだ。"}, {"t": 269.0, "x": "人間は落ちた卵を拾って長いあいだ何かを言い合っていた。"}, {"t": 272.6, "x": "次の春もその次の春も雛は出なかった。"}, {"t": 275.25, "x": "ある朝、止まり木から一羽が消えていた。"}, {"t": 277.96666666666664, "x": "消えたのではない。床に落ちていた。動かなかった。"}, {"t": 281.2, "x": "私たちは止まり木から降りて"}, {"t": 283.0833333333333, "x": "そのまわりに集まった。鳴いた。"}, {"t": 285.26666666666665, "x": "嘴でつついた。また鳴いた。"}, {"t": 287.26666666666665, "x": "私たちはそういう鳥だ。倒れた仲間のそばを離れられない。"}, {"t": 291.0, "x": "人間の手が上から来てそれを"}, {"t": 292.73333333333335, "x": "持っていくまで、私たちはそこにいた。"}, {"t": 295.21666666666664, "x": "同じことが何度もあった。年に"}, {"t": 297.01666666666665, "x": "よって間が空くこともあった。"}, {"t": 298.8, "x": "続けて起きることもあった。"}, {"t": 300.45, "x": "そのたびに私たちは床に降りて集まり、"}, {"t": 302.8666666666667, "x": "鳴いて、上から来る手を待った。"}, {"t": 305.45, "x": "手はいつも動かないほうを持っていった。"}, {"t": 307.6166666666667, "x": "動くほうは残された。止まり木の"}, {"t": 309.5833333333333, "x": "上の色が少しずつ細くなっていった。"}, {"t": 311.81666666666666, "x": "眠るときに押しつけ合う肩が少なくなった。"}, {"t": 314.25, "x": "朝に誰かが鳴いても、建物がいっぱいになる"}, {"t": 317.2, "x": "前に声が途切れるようになった。"}, {"t": 318.98333333333335, "x": "端の一羽がずれても隣がずれない日が来た。"}, {"t": 321.6333333333333, "x": "隣がいなかったからだ。新しい仲間は来なかった。"}, {"t": 324.76666666666665, "x": "箱が運ばれてくることは二度となかった。"}, {"t": 327.1166666666667, "x": "金網の外の人間たちは変わらずに来ていた。"}, {"t": 329.8833333333333, "x": "けれども私たちを指さす指は"}, {"t": 331.85, "x": "前より長く止まるようになった。"}, {"t": 333.6166666666667, "x": "笑う者は減った。黙って見ている者が増えた。"}, {"t": 336.53333333333336, "x": "子どもを抱き上げて私たちを見せる者もいた。"}, {"t": 339.2, "x": "その子どもは笑わなかった。"}, {"t": 340.8833333333333, "x": "金網に顔を近づけて、長いあいだ黙って私たちを見ていた。"}, {"t": 345.05, "x": "ある年、止まり木の上の緑は"}, {"t": 347.4166666666667, "x": "枝の端と端に二つだけになった。私とレディ・ジェーンだ。"}, {"t": 350.6333333333333, "x": "二羽になると止まり木は広すぎた。"}, {"t": 352.65, "x": "私たちは端と端にいるのをやめて、真ん中で並んだ。"}, {"t": 356.18333333333334, "x": "広い枝の真ん中に二羽だけで並ぶのは、"}, {"t": 358.5, "x": "はじめは落ち着かなかった。そのうち慣れた。"}, {"t": 361.2, "x": "そこから先の長い年月を私たちは二羽で過ごした。"}, {"t": 364.4166666666667, "x": "二羽で鳴けば建物は少しだけ"}, {"t": 366.1666666666667, "x": "騒がしくなる。私はそれで足りていた。"}, {"t": 368.6, "x": "カロライナインコはアメリカ合衆国の東部に"}, {"t": 371.26666666666665, "x": "住んでいた、ただ一種の在来のインコである。"}, {"t": 374.1166666666667, "x": "全長はおよそ三十三センチメートル。"}, {"t": 376.75, "x": "体重は百グラムほどだった。"}, {"t": 378.71666666666664, "x": "頭は黄色く、額から目のまわりにかけては"}, {"t": 381.78333333333336, "x": "橙色で、体は緑である。この色は、"}, {"t": 384.5833333333333, "x": "今も残る標本によって確かめられている。"}, {"t": 387.9, "x": "分布はかつて少なくとも二十八の"}, {"t": 390.01666666666665, "x": "州にまたがり、北は北緯四十三度付近から"}, {"t": 393.4166666666667, "x": "南は北緯二十六度付近まで記録がある。"}, {"t": 396.1, "x": "大西洋側とミシシッピ川の流域側と"}, {"t": 398.95, "x": "で二つの亜種に分けられている。"}, {"t": 400.7, "x": "流域側の亜種は体の緑がやや青みを帯びていた。"}, {"t": 404.26666666666665, "x": "二〇一〇年代の後半、研究者たちは一五六四年から"}, {"t": 408.81666666666666, "x": "一九四四年までの目撃記録四百一件と、博物館に"}, {"t": 413.6666666666667, "x": "残る標本の採集地を集めて地図に落とし直した。"}, {"t": 416.81666666666666, "x": "その結果、この鳥が実際に繁殖していた"}, {"t": 419.96666666666664, "x": "範囲は、それまで考えられていたよりも"}, {"t": 422.75, "x": "ずっと狭かったことが分かった。"}, {"t": 424.56666666666666, "x": "二つの亜種の住む場所は離れていて、"}, {"t": 426.8333333333333, "x": "好む気候も少しずつ違っていた。"}, {"t": 429.3333333333333, "x": "住んでいたのは川沿いや沼地に広がる古い森だった。"}, {"t": 432.75, "x": "とくにヌマスギやスズカケノキの大木を好み、"}, {"t": 435.5, "x": "その幹にできた大きな空洞を眠る場所と巣に使った。"}, {"t": 439.23333333333335, "x": "群れは大きく騒がしかった。"}, {"t": 441.1333333333333, "x": "三百羽ほどの群れも記録されている。"}, {"t": 443.6, "x": "食べていたのは森の木々の種である。"}, {"t": 445.76666666666665, "x": "中でもよく知られているのがオナモミの実だ。"}, {"t": 448.3, "x": "オナモミには強い毒を持つ成分が"}, {"t": 450.48333333333335, "x": "含まれているが、この鳥はそれを平気で食べた。"}, {"t": 453.5833333333333, "x": "二〇一九年に読まれたゲノムからは、この毒に"}, {"t": 456.85, "x": "耐えるための遺伝的な適応がうかがえると報告されている。"}, {"t": 460.3, "x": "この鳥を食べた猫が死んだという古い記録も残っている。"}, {"t": 463.76666666666665, "x": "では、なぜこの鳥は消えたのか。"}, {"t": 466.23333333333335, "x": "一つ目は畑である。森が切り開かれて農地になると、群れは"}, {"t": 470.55, "x": "果樹園や穀物の畑に降りてくるようになった。"}, {"t": 473.3666666666667, "x": "農家にとってそれは作物を荒らす害鳥だった。"}, {"t": 476.46666666666664, "x": "画家で博物学者のジョン・ジェームズ・オーデュボンは"}, {"t": 479.21666666666664, "x": "その場面を書き残している。"}, {"t": 480.9, "x": "農夫は実をむしることに夢中になっている"}, {"t": 483.3, "x": "群れに、すぐ近くまで歩み寄ることができた。"}, {"t": 486.28333333333336, "x": "一発撃つと生き残った鳥たちは飛び立って"}, {"t": 488.71666666666664, "x": "叫び、しばらくあたりを飛び回ってから、"}, {"t": 491.48333333333335, "x": "また同じ場所へ降りてくる。"}, {"t": 493.3666666666667, "x": "銃は撃ち続けられ、一発ごとに八羽、"}, {"t": 496.3666666666667, "x": "十羽、ときには二十羽が落ちた。"}, {"t": 499.26666666666665, "x": "撃たれた仲間のそばへ戻ってくるという性質。"}, {"t": 502.06666666666666, "x": "これがこの鳥の減り方を速めたと考えられている。"}, {"t": 505.21666666666664, "x": "群れを離れず倒れた仲間のそばを離れない。"}, {"t": 507.93333333333334, "x": "それはこの鳥の生き方そのものだった。"}, {"t": 510.4, "x": "その生き方が、撃つ側にとっては都合のいい的になった。"}, {"t": 514.3333333333334, "x": "二つ目は羽根である。緑と黄色と橙色の"}, {"t": 517.0833333333334, "x": "羽根は女性の帽子の飾りとして好まれた。"}, {"t": 519.9833333333333, "x": "帽子に鳥の皮を丸ごと載せることもあったという"}, {"t": 522.8666666666667, "x": "報告もある。三つ目はペットとしての捕獲だ。"}, {"t": 525.8, "x": "生け捕りにされて飼い鳥として売られた。"}, {"t": 528.0166666666667, "x": "四つ目は森そのものが消えたことである。"}, {"t": 530.5166666666667, "x": "眠る場所と巣を持つには、中が"}, {"t": 532.8333333333334, "x": "空洞になった大木が必要だった。"}, {"t": 535.0666666666667, "x": "十八世紀から十九世紀にかけて"}, {"t": 537.45, "x": "東部の古い森は大きく切り開かれていった。"}, {"t": 540.1166666666667, "x": "ヨーロッパから持ち込まれたミツバチが同じ木の空洞を"}, {"t": 543.1833333333333, "x": "巣として奪い合ったのではないか、という見方もある。"}, {"t": 546.3666666666667, "x": "五つ目は病気である。家畜のニワトリから鳥の病気が"}, {"t": 549.8333333333334, "x": "うつったのではないかという説がある。"}, {"t": 551.8166666666667, "x": "ただしこれは研究者が可能性として"}, {"t": 554.0666666666667, "x": "述べているもので、実際にこの鳥が病気で"}, {"t": 556.9666666666667, "x": "大量に死んだという記録は見つかっていない。"}, {"t": 559.5333333333333, "x": "どれが決め手だったのかは今も決着していない。"}, {"t": 562.3666666666667, "x": "この鳥を長く研究してきた研究者は、"}, {"t": 564.9666666666667, "x": "おそらく全部だろうと話している。"}, {"t": 567.35, "x": "減っていることに人間が気づいていなかったわけではない。"}, {"t": 570.6, "x": "オーデュボンは一八三〇年代の"}, {"t": 572.95, "x": "初めに、すでにこう書いている。"}, {"t": 575.1166666666667, "x": "この国のインコは非常な速さで減っている。"}, {"t": 577.8, "x": "二十五年前にはたくさんいた場所で、"}, {"t": 580.1166666666667, "x": "今はほとんど一羽も見かけない。"}, {"t": 582.4666666666667, "x": "気づいた人がいてそれを書き残した。"}, {"t": 584.7166666666667, "x": "それでも撃つことも捕まえることも"}, {"t": 586.75, "x": "森を切ることも止まらなかった。"}, {"t": 588.5, "x": "一つ一つは畑を守ることであり、帽子を"}, {"t": 591.6333333333333, "x": "作ることであり、土地を拓くことだった。"}, {"t": 594.35, "x": "それぞれにやめる理由がなかった。"}, {"t": 596.5333333333333, "x": "二〇一九年、スペインの個人の収集品として"}, {"t": 600.2666666666667, "x": "残っていた一羽の標本からこの鳥の全ゲノムが読まれた。"}, {"t": 603.8333333333334, "x": "そこには長い時間をかけて数が減っていった"}, {"t": 606.5166666666667, "x": "種に見られる近親交配の跡がほとんど無かった。"}, {"t": 609.6, "x": "研究者たちはこれを、絶滅が急速に起き、主に人間の"}, {"t": 614.1333333333333, "x": "手によって進んだことを示すものだと結論している。"}, {"t": 617.0833333333334, "x": "野生の群れの最後の確かな標本は、一九〇四年に"}, {"t": 621.0666666666667, "x": "フロリダ州オキーチョビー郡で撃たれた一羽である。"}, {"t": 624.0, "x": "それより後の目撃談はいくつもあるが、"}, {"t": 626.55, "x": "どれも確かめられてはいない。"}, {"t": 628.5666666666667, "x": "レディ・ジェーンが動かなくなったのは夏の終わりだった。"}, {"t": 631.3, "x": "その朝のことはあまり覚えていない。"}, {"t": 633.45, "x": "覚えているのは止まり木の右側が軽かったことだ。"}, {"t": 636.4666666666667, "x": "枝がいつもと違う揺れ方をした。"}, {"t": 638.5, "x": "下を見ると彼女は床にいた。"}, {"t": 640.4, "x": "私は降りた。そばに行った。"}, {"t": 642.3, "x": "鳴いた。嘴で首の後ろをつついた。"}, {"t": 645.3333333333334, "x": "そこは彼女が自分では整えられない場所で、"}, {"t": 648.0166666666667, "x": "私がいつも整えていた場所だ。"}, {"t": 650.3333333333334, "x": "返事は無かった。私たちは倒れた仲間のそばへ戻る鳥だ。"}, {"t": 654.0833333333334, "x": "何度追い払われても同じ場所に降りる。"}, {"t": 656.3333333333334, "x": "私はそこにいた。人間の手が上から来るまでそこにいた。"}, {"t": 659.8666666666667, "x": "手は来た。彼女を持っていった。"}, {"t": 662.2333333333333, "x": "私は彼女がいた床の上に降りた。"}, {"t": 664.5333333333333, "x": "そこにはもう何も無かった。"}, {"t": 666.1833333333333, "x": "何も無い場所に私はしばらく立っていた。"}, {"t": 668.6166666666667, "x": "それから止まり木に戻った。また降りた。"}, {"t": 671.05, "x": "戻った。それを何日くり返したのかは分からない。"}, {"t": 674.5666666666667, "x": "戻る場所はそこにしか無かった。"}, {"t": 676.3833333333333, "x": "けれども戻った先には誰もいなかった。"}, {"t": 678.65, "x": "人間たちはそのころの私を見て、"}, {"t": 680.75, "x": "沈んでいると言っていたらしい。"}, {"t": 682.6833333333333, "x": "私には自分の様子は分からない。"}, {"t": 684.85, "x": "ただ、鳴く回数が減ったことは知っている。"}, {"t": 687.65, "x": "鳴いても建物の中をひと回りして消えるだけだったからだ。"}, {"t": 690.9, "x": "しばらくして、上から来る手が私を別の鳥小屋へ移した。"}, {"t": 694.8333333333334, "x": "そこも同じような屋根の建物だった。"}, {"t": 697.1166666666667, "x": "同じように金網があって止まり木があった。"}, {"t": 699.6833333333333, "x": "前に誰が住んでいたのかは知らない。"}, {"t": 701.7833333333333, "x": "床には私のものではない古い羽根の"}, {"t": 704.0666666666667, "x": "匂いが少しだけ残っていた気がする。"}, {"t": 706.1, "x": "それが何の鳥だったのかは分からない。"}, {"t": 708.3, "x": "秋が来た。金網の外の木の葉が黄色くなって落ちた。"}, {"t": 711.7, "x": "私の頭と同じ色だと思った。"}, {"t": 713.9, "x": "けれども落ちた葉は鳴かない。"}, {"t": 715.5, "x": "冬になった。寒さで体を寄せ合う相手がもういない。"}, {"t": 718.7833333333333, "x": "夜、私は一本の止まり木の上でひとりで肩を張って眠った。"}, {"t": 722.8333333333334, "x": "端がずれても誰もずれない。"}, {"t": 724.5, "x": "ずれるのは私だけだ。朝、光が屋根の隙間から差してくる。"}, {"t": 728.5666666666667, "x": "私は鳴いた。いつもの朝と同じように、誰かが"}, {"t": 731.9833333333333, "x": "鳴き返してくるのを待った。"}, {"t": 733.3666666666667, "x": "建物はいっぱいにならなかった。それでも私は毎朝鳴いた。"}, {"t": 737.1333333333333, "x": "鳴くのをやめる理由が私には思いつかなかった。"}, {"t": 739.9833333333333, "x": "この鳥小屋のどこかに、まだ一羽くらい"}, {"t": 742.5833333333334, "x": "返事をしそうな緑がいる気がしていた。"}, {"t": 744.75, "x": "いないことは分かっていた。"}, {"t": 746.2833333333333, "x": "分かっていても、朝になると体が先に鳴いた。"}, {"t": 749.4, "x": "金網の外の人間たちはこの冬もやってきた。"}, {"t": 752.2833333333333, "x": "立ち止まって私を見る。長く見る。"}, {"t": 754.65, "x": "何も言わずに去っていく。前のように指を"}, {"t": 757.1333333333333, "x": "さして笑う者はもういなかった。"}, {"t": 759.0833333333334, "x": "ある日、上から来る手がオナモミの枝を一本差し入れた。"}, {"t": 762.7, "x": "私は実を割って種を取り出した。"}, {"t": 764.7, "x": "取り出した種を右に渡そうとした。"}, {"t": 766.8333333333334, "x": "右には誰もいなかった。私はその種を自分で食べた。"}, {"t": 770.2833333333333, "x": "雪の日があった。屋根の上に積もった雪が音を吸って、"}, {"t": 773.5833333333334, "x": "建物の中がいつもより静かになった。"}, {"t": 776.2666666666667, "x": "私の声もいつもより早く消えた。"}, {"t": 778.4666666666667, "x": "雨の日のように大きな声で鳴き"}, {"t": 780.3666666666667, "x": "返す仲間は、もういなかった。"}, {"t": 782.4, "x": "二月に入って体が重くなった。"}, {"t": 784.5, "x": "止まり木を握る足に力が入らない。"}, {"t": 786.8333333333334, "x": "翼を開いても思ったほど持ち上がらない。"}, {"t": 789.3333333333334, "x": "餌の台まで行くのに何度も休んだ。"}, {"t": 791.5333333333333, "x": "止まり木を握っている自分の足を、私は見下ろした。"}, {"t": 795.1, "x": "薄い茶色の足だ。指の半分は前を向き、"}, {"t": 797.95, "x": "残りの半分は後ろを向いている。"}, {"t": 800.3333333333334, "x": "前と後ろから枝を挟むようにして握る。"}, {"t": 802.8666666666667, "x": "この鳥小屋に来てから、私は"}, {"t": 805.0333333333333, "x": "ずっとこの足で止まり木にいた。"}, {"t": 806.7333333333333, "x": "金網にしがみつくのも、枝から"}, {"t": 809.0333333333333, "x": "枝へ移るのも、この足だった。"}, {"t": 811.1166666666667, "x": "その足が、今は枝をうまく挟めない。"}, {"t": 813.8333333333334, "x": "足の付け根の羽根は黄色い。"}, {"t": 815.5666666666667, "x": "重い翼を少しだけ開くと、先のほうの"}, {"t": 818.5333333333333, "x": "長い羽根の縁に黄色がのぞく。"}, {"t": 820.3833333333333, "x": "腹の緑は背中の緑より淡い。"}, {"t": 822.5666666666667, "x": "嘴は白っぽい色をしている。"}, {"t": 824.55, "x": "オナモミの硬い殻を何度も割ってきた嘴だ。"}, {"t": 827.35, "x": "レディ・ジェーンと私は同じ色をしていた。"}, {"t": 829.7, "x": "違ったのは体の大きさだけで、"}, {"t": 831.6166666666667, "x": "私のほうが少しだけ大きかった。"}, {"t": 834.0, "x": "金網の外の人間には、どちらがどちらなのか"}, {"t": 837.1, "x": "見分けがつかなかったかもしれない。"}, {"t": 838.8333333333334, "x": "彼女の目のまわりは、白い肌が輪になって囲んでいた。"}, {"t": 842.3666666666667, "x": "首の後ろの羽根を整えてやるとき、"}, {"t": 844.6, "x": "私の顔はいつもその輪のすぐそばにあった。"}, {"t": 847.5, "x": "私の目のまわりにも同じ輪があるはずだ。"}, {"t": 849.9666666666667, "x": "けれども私は自分の目のまわりを見たことがない。"}, {"t": 852.8833333333333, "x": "見えていたのは、いつも彼女の輪のほうだった。"}, {"t": 855.8166666666667, "x": "彼女がいなくなってから、私の"}, {"t": 858.0, "x": "目のまわりを見る者はもういない。"}, {"t": 859.8, "x": "外が冷え込んだ。いつもの二月よりも寒かった。"}, {"t": 862.8333333333334, "x": "雪が降った。夜になると、金網のあいだから入ってくる"}, {"t": 866.6166666666667, "x": "冷たい空気が羽根の奥まで届いた。"}, {"t": 868.7666666666667, "x": "肩を寄せる相手のいない体は、"}, {"t": 870.6666666666666, "x": "朝になっても温まらなかった。"}, {"t": 872.8, "x": "昼になっても、屋根の隙間から入る光は"}, {"t": 875.4833333333333, "x": "細いままで、床までは温めなかった。"}, {"t": 878.15, "x": "それでも私は止まり木にいた。"}, {"t": 880.0833333333334, "x": "この足で握っていられるあいだは、そこが私の場所だった。"}, {"t": 883.7166666666667, "x": "その朝も光は屋根の隙間から入ってきた。"}, {"t": 886.3333333333334, "x": "私は鳴こうとした。声は喉の奥で止まった。"}, {"t": 889.2666666666667, "x": "止まり木の上から下を見た。"}, {"t": 890.9333333333333, "x": "床がある。レディ・ジェーンがいたのとは別の床だ。"}, {"t": 894.1333333333333, "x": "それでもここに降りれば、あのときと同じように"}, {"t": 896.9833333333333, "x": "誰かが集まってきてくれるのではないか。"}, {"t": 899.1333333333333, "x": "そんなことを一瞬だけ思った。"}, {"t": 901.0, "x": "私は床に降りた。降りたというより体が先に落ちた。"}, {"t": 904.5833333333334, "x": "誰も集まってこなかった。集まってくる仲間は、この世界の"}, {"t": 908.4833333333333, "x": "どこにももう残っていなかった。"}, {"t": 910.1333333333333, "x": "私は黄色い頭を床につけたまま屋根を見上げた。"}, {"t": 913.2833333333333, "x": "端の反り返った変わった形の屋根だ。"}, {"t": 915.6666666666666, "x": "その隙間から二月の光が細く入っている。"}, {"t": 918.35, "x": "群れで一番うるさい鳥だった、と自分では思っている。"}, {"t": 921.8833333333333, "x": "その私の声が止まって、この建物は"}, {"t": 924.6166666666667, "x": "はじめて本当に静かになった。"}, {"t": 926.4333333333333, "x": "インカスが死んだのは一九一八年二月二十一日。"}, {"t": 930.3666666666667, "x": "場所はシンシナティ動物園である。"}, {"t": 932.5833333333334, "x": "動物園は一八八五年に、インカスを含む十六羽の"}, {"t": 937.0666666666667, "x": "カロライナインコを四十ドルで買い入れていた。"}, {"t": 939.6166666666667, "x": "インカスは少なくとも三十三歳だったとされる。"}, {"t": 942.6333333333333, "x": "死因は分かっていない。病気や老い、"}, {"t": 945.0666666666667, "x": "つがいを失ったことなどが挙げられているが、"}, {"t": 948.0666666666667, "x": "どれとも決まっていない。つがいの"}, {"t": 950.15, "x": "相手だったレディ・ジェーンは、その前年の"}, {"t": 952.75, "x": "一九一七年の夏の終わりに死んだとされる。"}, {"t": 955.9, "x": "二羽は三十年以上を同じ動物園で過ごし、"}, {"t": 958.9333333333333, "x": "何度も卵を産んだが、雛は一羽も育たなかった。"}, {"t": 962.85, "x": "動物園はインカスの遺体をワシントンの"}, {"t": 965.3833333333333, "x": "スミソニアン協会へ送ると約束していた。"}, {"t": 968.0833333333334, "x": "しかしその体はスミソニアンに届いていない。"}, {"t": 970.8833333333333, "x": "理由は分かっていない。記録も"}, {"t": 972.9, "x": "残されておらず、最後のカロライナインコの"}, {"t": 975.7666666666667, "x": "体が今どこにあるのかは誰にも分からない。"}, {"t": 978.3166666666667, "x": "彼が最後に過ごした鳥小屋に"}, {"t": 980.2333333333333, "x": "ついては一つの言い伝えがある。"}, {"t": 982.0333333333333, "x": "一九一四年九月一日、この動物園で"}, {"t": 985.8166666666667, "x": "最後のリョコウバトであるマーサが死んだ。"}, {"t": 988.1, "x": "インカスはその後、マーサが死んだのと"}, {"t": 990.65, "x": "同じ鳥小屋に移されていた、というものだ。"}, {"t": 993.5333333333333, "x": "ただし、この話は確かめられていない。"}, {"t": 996.5166666666667, "x": "当時の動物園にはほとんど同じ形の"}, {"t": 999.1166666666667, "x": "鳥小屋が六棟並んでいた。そのうちの"}, {"t": 1001.6666666666666, "x": "一棟が、今もリョコウバト記念館として"}, {"t": 1004.35, "x": "園内に残っている。二つの種の最後の一羽が同じ屋根の"}, {"t": 1007.95, "x": "下で死んだのかどうかは分からない。"}, {"t": 1009.8833333333333, "x": "分かっているのは、同じ動物園の中で四年ほどの"}, {"t": 1013.2833333333333, "x": "間をおいて二つの種が終わったということである。"}, {"t": 1016.0, "x": "インカスが本当に最後の一羽だったのかも確かではない。"}, {"t": 1019.5333333333333, "x": "二〇二二年に発表された研究は、"}, {"t": 1022.1833333333333, "x": "二つの亜種を分けて絶滅の時期を推定した。"}, {"t": 1025.4666666666667, "x": "ミシシッピ川流域側の亜種は一九一四年ごろまで、"}, {"t": 1029.25, "x": "大西洋側の亜種は一九三〇年代の"}, {"t": 1032.8, "x": "終わりから一九四〇年代の半ばまで、"}, {"t": 1035.6, "x": "野生で生き延びていた可能性があるという。"}, {"t": 1038.45, "x": "一九三九年、アメリカ鳥学会は"}, {"t": 1042.0333333333333, "x": "カロライナインコの絶滅を宣言した。"}, {"t": 1044.3, "x": "現在、世界の博物館や個人の収集品には八百点"}, {"t": 1048.6333333333334, "x": "近いカロライナインコの標本が残っている。"}, {"t": 1051.1333333333334, "x": "この鳥の緑と黄色と橙色を推測に"}, {"t": 1053.8166666666666, "x": "頼らずに描くことができるのは、"}, {"t": 1055.6333333333334, "x": "これらの標本が残っているからである。"}, {"t": 1058.1666666666667, "x": "南米に住むコガネメキシコインコが"}, {"t": 1060.3333333333333, "x": "最も近い親戚とされている。"}, {"t": 1062.3666666666666, "x": "二つの系統が分かれたのは、"}, {"t": 1064.2166666666667, "x": "およそ三百万年前だと推定されている。"}, {"t": 1067.3666666666666, "x": "四年をおいて同じ動物園で死んだ二羽のうち、"}, {"t": 1070.2166666666667, "x": "マーサの体は今もワシントンに保管されている。"}, {"t": 1073.65, "x": "インカスの体は、どこへ行ったのか分からない。"}], "w": 720, "h": 405, "n_cuts": 406, "noimage": false};

document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
